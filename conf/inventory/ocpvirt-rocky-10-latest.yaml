---
# OCP Virtualization inventory for Rocky Linux 10.1 (latest).
# Use with: --cloud ocpvirt --platform rocky-10 --inventory conf/inventory/ocpvirt-rocky-10-latest.yaml
#
# Prefer for upstream umbrella/community builds on Rocky 10.1.
# Short datasource names resolve via datasources in conf/ocpvirt/<name>.yaml.

version_id: "10.1"
id: rhel
instance:
  create:
    image-name: datasource://rocky10

  setup: |
    #cloud-config

    no_ssh_fingerprints: true
    ssh_pwauth: false
    disable_root: false
    timezone: Etc/UTC

    ssh_authorized_keys:
      - ecdsa-sha2-nistp521 AAAAE2VjZHNhLXNoYTItbmlzdHA1MjEAAAAIbmlzdHA1MjEAAACFBAGAhrLVC1yr8ZP7pX1h8ghCIE7OAMpA6aXxGJkkYu8GPwJvmR5gl9CqJ4bcMc1gxVzJCXe0Aw9xrP3ahnWjMXkRJABWgN1jjv7lZkhFMfDgXhalYNzli7QIeOnujQaaHtWD/o6/Nky+P7fdwn37evr5A0RslI6mxzn4es4PdHGTOjkDXQ== ibm-storage-ceph-ci-user

    groups:
      - cephuser
      - psathyan
      - rchilkun

    users:
      - name: cephuser
        primary-group: cephuser
        sudo: ALL=(ALL) NOPASSWD:ALL
        shell: /bin/bash
        ssh-authorized-keys:
          - ecdsa-sha2-nistp521 AAAAE2VjZHNhLXNoYTItbmlzdHA1MjEAAAAIbmlzdHA1MjEAAACFBAGAhrLVC1yr8ZP7pX1h8ghCIE7OAMpA6aXxGJkkYu8GPwJvmR5gl9CqJ4bcMc1gxVzJCXe0Aw9xrP3ahnWjMXkRJABWgN1jjv7lZkhFMfDgXhalYNzli7QIeOnujQaaHtWD/o6/Nky+P7fdwn37evr5A0RslI6mxzn4es4PdHGTOjkDXQ== ibm-storage-ceph-ci-user
      - name: root
        ssh-authorized-keys:
          - ecdsa-sha2-nistp521 AAAAE2VjZHNhLXNoYTItbmlzdHA1MjEAAAAIbmlzdHA1MjEAAACFBAGAhrLVC1yr8ZP7pX1h8ghCIE7OAMpA6aXxGJkkYu8GPwJvmR5gl9CqJ4bcMc1gxVzJCXe0Aw9xrP3ahnWjMXkRJABWgN1jjv7lZkhFMfDgXhalYNzli7QIeOnujQaaHtWD/o6/Nky+P7fdwn37evr5A0RslI6mxzn4es4PdHGTOjkDXQ== ibm-storage-ceph-ci-user
      - name: psathyan
        primary-group: psathyan
        sudo: ALL=(ALL) NOPASSWD:ALL
        shell: /bin/bash
        ssh-authorized-keys:
          - ecdsa-sha2-nistp384 AAAAE2VjZHNhLXNoYTItbmlzdHAzODQAAAAIbmlzdHAzODQAAABhBPDlMqoFJqzj9yP5o3w4O/rm4fHWSDKAsDr4YxHHFN35hEQ5vb4xALP0KoZg3UthbqnbXWvtSD3VoG3EFvPLjXNoO8xnM6VZrrDZYw8MT9Em2i+mCam+tpDBWbOojGvEfw== psathyan-fips
      - name: rchilkun
        primary-group: rchilkun
        sudo: ALL=(ALL) NOPASSWD:ALL
        shell: /bin/bash
        ssh-authorized-keys:
          - ecdsa-sha2-nistp521 AAAAE2VjZHNhLXNoYTItbmlzdHA1MjEAAAAIbmlzdHA1MjEAAACFBAHzT2JgaOA+RQsExHsk3E4IZjD4ZPNJghZbt4TucWcVd+jVotfWDFR+AHQwShYaCy4RCbXiPgWvZUjMmRWwmZqOwwHRQ520hhwdc6+R/h7i7axVBO++kQDvvH450B+Vr9UHwVB9LICPBSXHXIUUdFB5eSUi8C5LSsxd+JnRIyhM9vOCcg== rakeshnarayanchilkunda@Rakeshs-MacBook-Pro-3.local

    runcmd:
      - sed -i -e 's/^Defaults\s\+requiretty/# \0/' /etc/sudoers
      - echo "net.core.default_qdisc=netem" > /etc/sysctl.d/1000-qdisc.conf
      - hostnamectl set-hostname $(hostname -s)
      - printf '%s\n' 'AuthenticationMethods any' 'PasswordAuthentication no' 'PermitRootLogin prohibit-password' > /etc/ssh/sshd_config.d/00-00-ceph-qe.conf
      - systemctl restart sshd
      - growpart /dev/vda 4 || true
      - pvresize /dev/vda4 || true
      - lvextend -l +100%FREE /dev/mapper/rootvg-rootlv || true
      - xfs_growfs / || true
      - curl -m 120 -o /etc/pki/ca-trust/source/anchors/ceph-qe-ca.pem http://magna002.ceph.redhat.com/cephci-jenkins/.cephqe-ca.pem
      - curl -m 120 -k -o /etc/pki/ca-trust/source/anchors/RH-IT-Root-CA.crt https://certs.corp.redhat.com/certs/Current-IT-Root-CAs.pem
      - update-ca-trust
      - touch /ceph-qa-ready

    final_message: "Ready for ceph qa testing"
