---
version_id: 10.2
id: rhel
instance:
  create:
    image-name: rhel-102-server-amd64-kvm
    private_key: ceph-qe-sa-svc

  setup: |
    #cloud-config
    no_ssh_fingerprints: true
    disable_root: false
    ssh_pwauth: false
    timezone: Etc/UTC

    # We are forcing an update of the packages
    package_update: true

    # Create the base repositories
    yum_repos:
      appstream:
        name: AppStream
        baseurl: http://nginx-vm-01.qe.ceph.lab/repos/10/2/AppStream/
        enabled: true
        gpgcheck: false
      baseos:
        name: BaseOS
        baseurl: http://nginx-vm-01.qe.ceph.lab/repos/10/2/BaseOS/
        gpgcheck: false
        enabled: true

      crb:
        name: codeready-builder
        baseurl: http://nginx-vm-01.qe.ceph.lab/repos/10/2/CRB/
        gpgcheck: false
        enabled: true

    # write the mirror registry details
    write_files:
      - content: |
          [[registry]]
          location = "nginx-vm-01.qe.ceph.lab:5000"
          insecure = true

          [[registry]]
          location = "nginx-vm-01.qe.ceph.lab:5000/rh-stage"
          prefix = "registry-proxy.engineering.redhat.com"
          insecure = true

          [[registry]]
          location = "nginx-vm-01.qe.ceph.lab:5000/rh-stage"
          prefix = "quay.io"
          insecure = true

          [[registry]]
          location = "nginx-vm-01.qe.ceph.lab:5000/rh-stage"
          prefix = "registry.stage.redhat.io"
          insecure = true

          [[registry]]
          location = "nginx-vm-01.qe.ceph.lab:5000/rh-prod"
          prefix = "registry.redhat.io"
          insecure = true

          [[registry]]
          location = "nginx-vm-01.qe.ceph.lab:5000/ibm-stage"
          prefix = "cp.stg.icr.io"
          insecure = true

          [[registry]]
          location = "nginx-vm-01.qe.ceph.lab:5000/ibm-stage"
          prefix = "preprod.icr.io"
          insecure = true

          [[registry]]
          location = "nginx-vm-01.qe.ceph.lab:5000/ibm-prod"
          prefix = "cp.icr.io"
          insecure = true
        path: /etc/containers/registries.conf.d/nginx-vm-01.conf
        owner: root:root
        permissions: '0644'
        defer: true
      - content: |
          net.core.default_qdisc=netem
        path: /etc/sysctl.d/1000-qdisc.conf
        owner: root:root
        permissions: '0644'
      - content: |
          PermitRootLogin prohibit-password
        path: /etc/ssh/sshd_config.d/50-cephci.conf
        owner: root:root
        permissions: '0644'

    groups:
      - cephuser
      - psathyan
      - rchilkun

    users:
      - name: cephuser
        primary-group: cephuser
        sudo: ALL=(root) NOPASSWD:ALL
        shell: /bin/bash
        ssh-authorized-keys:
          - ecdsa-sha2-nistp521 AAAAE2VjZHNhLXNoYTItbmlzdHA1MjEAAAAIbmlzdHA1MjEAAACFBAGAhrLVC1yr8ZP7pX1h8ghCIE7OAMpA6aXxGJkkYu8GPwJvmR5gl9CqJ4bcMc1gxVzJCXe0Aw9xrP3ahnWjMXkRJABWgN1jjv7lZkhFMfDgXhalYNzli7QIeOnujQaaHtWD/o6/Nky+P7fdwn37evr5A0RslI6mxzn4es4PdHGTOjkDXQ== ibm-storage-ceph-ci-user
      - name: root
        ssh-authorized-keys:
          - ecdsa-sha2-nistp521 AAAAE2VjZHNhLXNoYTItbmlzdHA1MjEAAAAIbmlzdHA1MjEAAACFBAGAhrLVC1yr8ZP7pX1h8ghCIE7OAMpA6aXxGJkkYu8GPwJvmR5gl9CqJ4bcMc1gxVzJCXe0Aw9xrP3ahnWjMXkRJABWgN1jjv7lZkhFMfDgXhalYNzli7QIeOnujQaaHtWD/o6/Nky+P7fdwn37evr5A0RslI6mxzn4es4PdHGTOjkDXQ== ibm-storage-ceph-ci-user
      - name: psathyan
        primary-group: psathyan
        sudo: ALL=(root) NOPASSWD:ALL
        shell: /bin/bash
        ssh-authorized-keys:
          - ecdsa-sha2-nistp384 AAAAE2VjZHNhLXNoYTItbmlzdHAzODQAAAAIbmlzdHAzODQAAABhBPDlMqoFJqzj9yP5o3w4O/rm4fHWSDKAsDr4YxHHFN35hEQ5vb4xALP0KoZg3UthbqnbXWvtSD3VoG3EFvPLjXNoO8xnM6VZrrDZYw8MT9Em2i+mCam+tpDBWbOojGvEfw== psathyan-fips
      - name: rchilkun
        primary-group: rchilkun
        sudo: ALL=(root) NOPASSWD:ALL
        shell: /bin/bash
        ssh-authorized-keys:
          - ecdsa-sha2-nistp521 AAAAE2VjZHNhLXNoYTItbmlzdHA1MjEAAAAIbmlzdHA1MjEAAACFBAHzT2JgaOA+RQsExHsk3E4IZjD4ZPNJghZbt4TucWcVd+jVotfWDFR+AHQwShYaCy4RCbXiPgWvZUjMmRWwmZqOwwHRQ520hhwdc6+R/h7i7axVBO++kQDvvH450B+Vr9UHwVB9LICPBSXHXIUUdFB5eSUi8C5LSsxd+JnRIyhM9vOCcg== rakeshnarayanchilkunda@Rakeshs-MacBook-Pro-3.local

    packages:
      - lvm2
      - chrony
      - yum-utils
      - podman
      - net-snmp-utils
      - net-snmp
      - python3-devel
      - wget

    package_upgrade: true

    runcmd:
      - sed -i 's/gpgcheck=1/gpgcheck=0/' /etc/yum.conf
      - sed -i 's/gpgcheck=1/gpgcheck=0/' /etc/dnf/dnf.conf
      - mkdir -p /root/rgw_rpms
      - curl -L --fail -k -o /root/rgw_rpms/oathtool.rpm https://dl.fedoraproject.org/pub/epel/10.2/Everything/x86_64/Packages/o/oathtool-2.6.12-1.el10_0.x86_64.rpm
      - curl -L --fail -k -o /root/rgw_rpms/jdk.rpm https://download.oracle.com/java/25/latest/jdk-25_linux-x64_bin.rpm
      - dnf update -y
      - touch /ceph-qa-ready
