---
# OCP Virtualization inventory for RHEL 8 (latest).
# Use with: --cloud ocpvirt --inventory conf/inventory/ocpvirt-rhel-8-latest.yaml
#
# Prefer this for RHCS 5.3 / 6.x BVTs with --platform rhel-8.
# Short datasource names resolve via datasources in conf/ocpvirt/<name>.yaml.

version_id: "8"
id: rhel
instance:
  create:
    image-name: datasource://rhel8

  setup: |
    #cloud-config
    no_ssh_fingerprints: true
    disable_root: false
    ssh_pwauth: true
    timezone: Etc/UTC

    package_update: true

    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMVphgpz0IIYeZjchEx3WMceAd18tNUBPmsqdRkEiMGF jenkins@ceph-jenkins-n1

    write_files:
      - content: |
          net.core.default_qdisc=netem
        path: /etc/sysctl.d/1000-qdisc.conf
        owner: root:root
        permissions: '0644'
      - content: |
          AuthenticationMethods any
          PasswordAuthentication yes
          PermitRootLogin yes
        path: /etc/ssh/sshd_config.d/00-00-ceph-qe.conf
        owner: root:root
        permissions: '0644'

    groups:
      - cephuser

    users:
      - name: cephuser
        primary-group: cephuser
        sudo: ALL=(ALL) NOPASSWD:ALL
        shell: /bin/bash
        ssh-authorized-keys:
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPoKGCTzMmNvHFY4THKNpZYFLeEgB7Do8y2JAEy+ZvIZ ceph-qe-sa
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILuKaVnvq986B7zkgR0LyQbUo5F6JfrU9NnrRp1XbAYG ceph qe svc
          - ecdsa-sha2-nistp384 AAAAE2VjZHNhLXNoYTItbmlzdHAzODQAAAAIbmlzdHAzODQAAABhBNkaK5/dSj7VjggT4oCnc5nbf9AGAk6zduy0AiCWN/l5p9Q0r0e7rn81Pr8AMVpJL26Jr6ElWyJf1jF8rbxqbfTe6VwyRwQoHZETSqk9oDiSrsbZkNih/akwDlLcXVfWDw== ceph-qe-sa-sm@ibm.com
          - ssh-rsa  ceph-qe-sa-sm@ibm.com
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMVphgpz0IIYeZjchEx3WMceAd18tNUBPmsqdRkEiMGF jenkins@ceph-jenkins-n1

    chpasswd:
      expire: false
      users:
        - name: cephuser
          password: $y$j9T$PxJ09a3yVNnPj0Veb8QDT.$bdWoyLq1IdGwlimyJC98P5OsSFE2w7.9ac68z4eoa01
        - name: root
          password: $y$j9T$L0/xJyxgqCPIezC0dp/0/0$KawKfTR2FhliH9YrG4/30wot90M3xtF03K1XwGnYz2A

    packages:
      - lvm2
      - chrony
      - yum-utils
      - podman
      - net-snmp-utils
      - net-snmp
      - python3-devel
      - wget

    package_upgrade: true
    package_reboot_if_required: true

    runcmd:
      - sed -i -e 's/^Defaults\s\+requiretty/# \0/' /etc/sudoers
      - sed -i 's/gpgcheck=1/gpgcheck=0/' /etc/yum.conf
      - sed -i 's/gpgcheck=1/gpgcheck=0/' /etc/dnf/dnf.conf
      - hostnamectl set-hostname $(hostname -s)
      - systemctl restart sshd
      - growpart /dev/vda 4 || true
      - pvresize /dev/vda4 || true
      - lvextend -l +100%FREE /dev/mapper/rootvg-rootlv || true
      - xfs_growfs / || true
      - curl -m 120 -o /etc/pki/ca-trust/source/anchors/ceph-qe-ca.pem http://magna002.ceph.redhat.com/cephci-jenkins/.cephqe-ca.pem
      - curl -m 120 -k -o /etc/pki/ca-trust/source/anchors/RH-IT-Root-CA.crt https://certs.corp.redhat.com/certs/Current-IT-Root-CAs.pem
      - update-ca-trust
      - touch /ceph-qa-ready

    final_message: "Ready for ceph qa testing"
