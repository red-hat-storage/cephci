---
version_id: 9.6
id: rhel
instance:
  create:
    image-name: rhel-96-server-amd64-kvm
    network_name: ci-sn-01
    private_key: ci-user-rsa-fips
    group_access: sec-grp-ci-vpc-01
    profile: bx2-8x32

  setup: |
    #cloud-config
    no_ssh_fingerprints: true
    disable_root: false
    ssh_pwauth: true
    timezone: Etc/UTC

    # Derive repos/<major>/<minor>/ from guest VERSION_ID so mix-os
    # (e.g. rhel-100 on a 9.2 default inventory) hits the matching mirror.
    # RHEL 9 uses dnf vars under /etc/dnf/vars (yum is dnf-compatible).
    bootcmd:
      - |
        set -e
        . /etc/os-release
        major=${VERSION_ID%%.*}
        minor=${VERSION_ID#*.}
        minor=${minor%%.*}
        mkdir -p /etc/dnf/vars
        printf '%s\n' "$major" > /etc/dnf/vars/releasever_major
        printf '%s\n' "$minor" > /etc/dnf/vars/releasever_minor

    # We are forcing an update of the packages
    package_update: true

    # Create the base repositories (dnf vars from bootcmd above)
    yum_repos:
      appstream:
        name: AppStream
        baseurl: http://nginx-vm-01.qe.ceph.lab/repos/$releasever_major/$releasever_minor/AppStream/
        enabled: true
        gpgcheck: false
      baseos:
        name: BaseOS
        baseurl: http://nginx-vm-01.qe.ceph.lab/repos/$releasever_major/$releasever_minor/BaseOS/
        gpgcheck: false
        enabled: true

      crb:
        name: codeready-builder
        baseurl: http://nginx-vm-01.qe.ceph.lab/repos/$releasever_major/$releasever_minor/CRB/
        gpgcheck: false
        enabled: true

    # write_files: sysctl/sshd only (no containers policy, no registry mirror)
    write_files:
      # Container registries: do NOT mirror via nginx-vm-01 (Frankfurt).
      # Shared by Dallas, London, and Madrid. VMs pull upstream hosts directly
      # (preprod.icr.io, cp.icr.io, quay.io, registry.*.redhat.io).
      # Auth uses bootstrap --registry-url / credentials (see #6124 / #6156).
      - content: |
          net.core.default_qdisc=netem
        path: /etc/sysctl.d/1000-qdisc.conf
        owner: root:root
        permissions: '0644'
      - content: |
          PermitRootLogin yes
        path: /etc/ssh/sshd_config.d/50-cephci.conf
        owner: root:root
        permissions: '0644'

    groups:
      - cephuser
      - psathyan
      - rchilkun

    users:
      - name: cephuser
        primary-group: cephuser
        sudo: ALL=(root) NOPASSWD:ALL
        shell: /bin/bash
        ssh-authorized-keys:
          - ssh-rsa  ibm-storage-qe-ci-user-fips RSA key

      - name: psathyan
        primary-group: psathyan
        sudo: ALL=(root) NOPASSWD:ALL
        shell: /bin/bash
        ssh-authorized-keys:
          - ecdsa-sha2-nistp384 AAAAE2VjZHNhLXNoYTItbmlzdHAzODQAAAAIbmlzdHAzODQAAABhBPDlMqoFJqzj9yP5o3w4O/rm4fHWSDKAsDr4YxHHFN35hEQ5vb4xALP0KoZg3UthbqnbXWvtSD3VoG3EFvPLjXNoO8xnM6VZrrDZYw8MT9Em2i+mCam+tpDBWbOojGvEfw== psathyan-fips

      - name: rchilkun
        primary-group: rchilkun
        sudo: ALL=(root) NOPASSWD:ALL
        shell: /bin/bash
        ssh-authorized-keys:
          - ecdsa-sha2-nistp521 AAAAE2VjZHNhLXNoYTItbmlzdHA1MjEAAAAIbmlzdHA1MjEAAACFBAHzT2JgaOA+RQsExHsk3E4IZjD4ZPNJghZbt4TucWcVd+jVotfWDFR+AHQwShYaCy4RCbXiPgWvZUjMmRWwmZqOwwHRQ520hhwdc6+R/h7i7axVBO++kQDvvH450B+Vr9UHwVB9LICPBSXHXIUUdFB5eSUi8C5LSsxd+JnRIyhM9vOCcg== rakeshnarayanchilkunda@Rakeshs-MacBook-Pro-3.local

      - name: root
        ssh-authorized-keys:
          - ssh-rsa  ibm-storage-qe-ci-user-fips RSA key

    chpasswd:
      expire: false
      users:
        - name: cephuser
          password: $y$j9T$PxJ09a3yVNnPj0Veb8QDT.$bdWoyLq1IdGwlimyJC98P5OsSFE2w7.9ac68z4eoa01
        - name: root
          password: $y$j9T$L0/xJyxgqCPIezC0dp/0/0$KawKfTR2FhliH9YrG4/30wot90M3xtF03K1XwGnYz2A

    packages:
      - lvm2
      - chrony
      - yum-utils
      - podman
      - net-snmp-utils
      - net-snmp
      - python3-devel
      - wget

    package_upgrade: true
    # Reboot when a kernel (or other package) marks the system reboot-required
    package_reboot_if_required: true

    runcmd:
      - sed -i 's/gpgcheck=1/gpgcheck=0/' /etc/yum.conf
      - sed -i 's/gpgcheck=1/gpgcheck=0/' /etc/dnf/dnf.conf
      - touch /ceph-qa-ready
