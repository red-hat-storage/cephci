# Cluster for Baremetal environment.
# The below defined cluster has 7 nodes.
# Cluster configuration:
#      3 MONS, 2 MGR, 6 OSD, 3 MDS service daemon(s)
globals:
  - ceph-cluster:
      name: ceph
      networks:
        public:
          - 10.8.128.0/21
      nodes:
        - hostname: cali013.ceph.redhat.com
          id: node1
          ip: 10.8.130.13
          root_private_key: ~/.ssh/id_rsa
          role:
            - _admin
            - installer
            - mon
            - mgr
        - hostname: cali022.ceph.redhat.com
          id: node2
          ip: 10.8.130.22
          root_private_key: ~/.ssh/id_rsa
          role:
            - osd
            - mgr
            - mon
          volumes:
            - /dev/sda
            - /dev/sdb
            - /dev/sdc
            - /dev/sde
            - /dev/sdf
            - /dev/sdg
            - /dev/nvme0n1
        - hostname: cali023.ceph.redhat.com
          id: node3
          ip: 10.8.130.23
          root_private_key: ~/.ssh/id_rsa
          role:
            - osd
            - mon
          volumes:
            - /dev/sda
            - /dev/sdb
            - /dev/sdc
            - /dev/sde
            - /dev/sdf
            - /dev/sdg
            - /dev/nvme0n1
        - hostname: cali024.ceph.redhat.com
          id: node4
          ip: 10.8.130.24
          root_private_key: ~/.ssh/id_rsa
          role:
            - mds
            - nfs
        - hostname: cali025.ceph.redhat.com
          id: node5
          ip: 10.8.130.25
          root_private_key: ~/.ssh/id_rsa
          role:
            - osd
            - mds
          volumes:
            - /dev/sda
            - /dev/sdb
            - /dev/sdc
            - /dev/sde
            - /dev/sdf
            - /dev/sdg
            - /dev/nvme0n1
        - hostname: cali026.ceph.redhat.com
          id: node6
          ip: 10.8.130.26
          root_private_key: ~/.ssh/id_rsa
          role:
            - nfs
            - mds
        - hostname: cali027.ceph.redhat.com
          id: node7
          ip: 10.8.130.27
          root_private_key: ~/.ssh/id_rsa
          role:
            - client
