# ==================================================================================
# IBM Cloud (ibmc) cluster layout for the dedicated cephadm agent scale pipeline.
#
# Shape:
#   node1              — bootstrap (_admin/installer/mon/mgr), no OSD volumes
#   node2..node101     — TC1: 100 OSD hosts x 5 volumes = 500 OSDs
#   node102..node151   — TC3: 50 OSD hosts x 5 volumes = 250 OSDs
#   node152            — client
#
# Totals: 151 cluster nodes + 1 client = 152 VMs, 750 data volumes (15 GiB)
#
# DMFG regression uses the smaller conf:
#   conf/umbrella/cephadm/1admin-51node-1client-agent-scale-ibmc.yaml
#   suite: suites/umbrella/cephadm/tier3-cephadm-agent-scale-regression.yaml
#
# This file:
#   suites/umbrella/cephadm/tier3-cephadm-agent-scale-regression-151.yaml
#
# Guest image comes from --inventory (ibm-rhel-9.8.yaml or ibm-rhel-10.2.yaml).
# Per-node image-name is omitted so it cannot override that inventory image.
# ==================================================================================
globals:
  - ceph-cluster:
      name: ceph
      node1:
        role:
          - _admin
          - installer
          - mon
          - mgr
          - node-exporter
          - alertmanager
          - grafana
          - prometheus
          - crash
      node2:
        role:
          - osd
          - mon
          - mgr
          - rgw
          - nfs
          - node-exporter
          - crash
        no-of-volumes: 5
        disk-size: 15
      node3:
