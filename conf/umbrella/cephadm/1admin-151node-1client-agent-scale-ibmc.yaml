# ==================================================================================
# IBM Cloud (ibmc) cluster layout for cephadm agent scale regression
#
# Shape:
#   node1              — bootstrap only (_admin/installer/mon/mgr), no OSD volumes
#   node2..node101     — TC1: 100 OSD hosts × 5 volumes = 500 OSDs
#   node102..node151   — TC3: 50 OSD hosts × 5 volumes = 250 OSDs
#   node152            — client (RGW/NFS workloads)
#
# Totals: 151 cluster nodes + 1 client = 152 VMs
#         750 data volumes (15 GiB each)
#
# Suite:
#   suites/umbrella/cephadm/tier3-cephadm-agent-scale-regression.yaml
#
# Example run:
#   python run.py --rhbuild 9.1 \
#     --cloud ibmc \
#     --global-conf conf/umbrella/cephadm/1admin-151node-1client-agent-scale-ibmc.yaml \
#     --inventory conf/inventory/ibm-rhel-9.6-server-bx2-4x16.yaml \
#     --suite suites/umbrella/cephadm/tier3-cephadm-agent-scale-regression.yaml \
#     --osp-cred <ibmc-cred.yaml> \
#     --custom-config use_agent=true \
#     --platform rhel-9 \
#     --build <build> \
#     --log-level info
#
# Notes:
#   - Prefer bx2-4x16 (or larger) inventory profile; bx2-2x8 is tight for 5×OSD + agent.
#   - VPC/network/SG come from --osp-cred + inventory (e.g. ci-vpc-01 / vpc-dmfg).
#   - image-name.ibmc below matches common IBM VPC RHEL 9.6; override via inventory if needed.
# ==================================================================================
globals:
  - ceph-cluster:
      name: ceph
      node1:
        image-name:
          ibmc: rhel-96-server-amd64-kvm
        role:
          - _admin
          - installer
          - mon
          - mgr
          - node-exporter
          - alertmanager
          - grafana
          - prometheus
          - crash
      node2:
        image-name:
          ibmc: rhel-96-server-amd64-kvm
        role:
          - osd
          - mon
          - mgr
          - rgw
          - nfs
          - node-exporter
          - crash
        no-of-volumes: 5
        disk-size: 15
