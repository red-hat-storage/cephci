# ==================================================================================
# IBM Cloud (ibmc) cluster layout for cephadm agent scale regression
#
# Shape:
#   node1            — bootstrap (_admin/installer/mon/mgr), no OSD volumes
#   node2..node41    — TC1: 40 OSD hosts × 2 volumes = 80 OSDs
#   node42..node51   — TC3: 10 OSD hosts × 2 volumes = 20 OSDs
#   node52           — client (RGW/NFS/MDS workloads)
#
# Totals: 51 cluster nodes + 1 client = 52 VMs, ~100 data volumes (15 GiB)
# Protocol pressure (suite): 16 RGW, 8 NFS clusters, 8 MDS
# OSD host count stays near 50. See tests/cephadm/cephadm_agent/CONTEXT.md
#
# Guest image is taken from --inventory so the run matches the fleet
# (conf/inventory/ibm-rhel-9.8.yaml or ibm-rhel-10.2.yaml).
#
# Suite:
#   suites/umbrella/cephadm/tier3-cephadm-agent-scale-regression.yaml
#
# Example:
#   python run.py --cloud ibmc \
#     --global-conf conf/umbrella/cephadm/1admin-51node-1client-agent-scale-ibmc.yaml \
#     --inventory conf/inventory/ibm-rhel-9.8.yaml \
#     --suite suites/umbrella/cephadm/tier3-cephadm-agent-scale-regression.yaml \
#     --osp-cred <ibmc-cred.yaml> --custom-config use_agent=true
# ==================================================================================
globals:
  - ceph-cluster:
      name: ceph
      node1:
        role:
          - _admin
          - installer
          - mon
          - mgr
          - node-exporter
          - alertmanager
          - grafana
          - prometheus
          - crash
      node2:
        role:
          - osd
          - mon
          - mgr
          - node-exporter
          - crash
        no-of-volumes: 2
        disk-size: 15
