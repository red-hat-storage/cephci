---
# Disposable ceph-volume regression cluster:
# two DB and four data disks per OSD host.
globals:
  - ceph-cluster:
      name: ceph
      node1:
        role:
          - _admin
          - installer
          - mon
          - mgr
          - osd
        no-of-volumes: 6
        disk-size: 32
      node2:
        role:
          - _admin
          - mon
          - mgr
          - osd
        no-of-volumes: 6
        disk-size: 32
      node3:
        role:
          - _admin
          - mon
          - osd
        no-of-volumes: 6
        disk-size: 32
      node4:
        role:
          - client
