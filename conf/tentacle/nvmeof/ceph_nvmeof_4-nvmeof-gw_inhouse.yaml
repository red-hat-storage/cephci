# 4 NVMeoF GWs colocated on OSD nodes (node4–node7).
# Two initiator clients (node8, node9) so one namespace can be attached
# by more than one host (multi-attach / shared reservation tenant).
globals:
  - ceph-cluster:
      name: ceph
      vm-size: ci.standard.large
      node1:
        role:
          - _admin
          - installer
          - mon
          - mgr
      node2:
        role:
          - mon
          - mgr
      node3:
        role:
          - mon
          - osd
        no-of-volumes: 4
        disk-size: 20
      node4:
        role:
          - mds
          - osd
          - nvmeof-gw
        no-of-volumes: 4
        disk-size: 20
      node5:
        role:
          - mds
          - osd
          - rgw
          - nvmeof-gw
        no-of-volumes: 4
        disk-size: 20
      node6:
        role:
          - osd
          - nvmeof-gw
        no-of-volumes: 4
        disk-size: 20
      node7:
        role:
          - osd
          - nvmeof-gw
        no-of-volumes: 4
        disk-size: 20
      node8:
        role:
          - client
      node9:
        role:
          - client
