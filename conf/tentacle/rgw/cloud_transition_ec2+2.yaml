# Conf for 2+2 EC profile on 4 nodes for RGW cloud transition.
# Same roles as cloud_transition.yaml: one RGW per cluster.
# Clusters stay named local and cloud.
# crush-failure-domain=host requires k+m (4) OSD hosts per cluster.
---
globals:
  - ceph-cluster:
      name: local

      node1:
        disk-size: 15
        no-of-volumes: 3
        role:
          - _admin
          - installer
          - mgr
          - mon
          - osd

      node2:
        disk-size: 15
        no-of-volumes: 3
        role:
          - mgr
          - mon
          - osd

      node3:
        disk-size: 15
        no-of-volumes: 3
        role:
          - mon
          - osd
          - rgw

      node4:
        disk-size: 15
        no-of-volumes: 3
        role:
          - osd
          - rgw
          - client

  - ceph-cluster:
      name: cloud

      node1:
        disk-size: 15
        no-of-volumes: 3
        role:
          - _admin
          - installer
          - mgr
          - mon
          - osd

      node2:
        disk-size: 15
        no-of-volumes: 3
        role:
          - mgr
          - mon
          - osd

      node3:
        disk-size: 15
        no-of-volumes: 3
        role:
          - mon
          - osd
          - rgw

      node4:
        disk-size: 15
        no-of-volumes: 3
        role:
          - osd
          - rgw
          - client
