#Conf for 2+2 EC profile on 4 nodes for 3 way active-active-archive rgw-multisite
# node2 and node4 host RGW daemons. They carry the rgw role so ceph-common and the
# admin keyring are installed there. User create SSHes to the first zone endpoint (node2).
---
globals:
  - ceph-cluster:
      name: ceph-pri

      node1:
        disk-size: 15
        no-of-volumes: 3
        role:
          - _admin
          - installer
          - mgr
          - mon
          - osd

      node2:
        disk-size: 15
        no-of-volumes: 3
        role:
          - mgr
          - mon
          - osd
          - rgw

      node3:
        disk-size: 15
        no-of-volumes: 3
        role:
          - mon
          - osd
          - rgw

      node4:
        disk-size: 15
        no-of-volumes: 3
        role:
          - osd
          - rgw
          - client

  - ceph-cluster:
      name: ceph-sec

      node1:
        disk-size: 15
        no-of-volumes: 3
        role:
          - _admin
          - installer
          - mgr
          - mon
          - osd

      node2:
        disk-size: 15
        no-of-volumes: 3
        role:
          - mgr
          - mon
          - osd
          - rgw

      node3:
        disk-size: 15
        no-of-volumes: 3
        role:
          - mon
          - osd
          - rgw

      node4:
        disk-size: 15
        no-of-volumes: 3
        role:
          - osd
          - rgw
          - client

  - ceph-cluster:
      name: ceph-arc

      node1:
        disk-size: 15
        no-of-volumes: 3
        role:
          - _admin
          - installer
          - mgr
          - mon
          - osd

      node2:
        disk-size: 15
        no-of-volumes: 3
        role:
          - mgr
          - mon
          - osd
          - rgw

      node3:
        disk-size: 15
        no-of-volumes: 3
        role:
          - mon
          - osd
          - rgw

      node4:
        disk-size: 15
        no-of-volumes: 3
        role:
          - osd
          - rgw
          - client
