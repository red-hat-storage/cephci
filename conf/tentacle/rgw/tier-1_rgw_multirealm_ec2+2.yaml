# Conf for 2+2 EC profile on 4 nodes for multi-realm RGW + ingress.
# Derived from tier-1_rgw_multirealm.yaml shrunk to 4 VMs (all OSD hosts).
# Suite later: place both RGW services on node3+node4, client on node4,
# ingress HA on pairs among node1-4, and create rgwec22_4 data pool.
# crush-failure-domain=host requires k+m (4) OSD hosts.
---
globals:
  - ceph-cluster:
      name: ceph

      node1:
        disk-size: 15
        no-of-volumes: 3
        role:
          - _admin
          - installer
          - mgr
          - mon
          - osd
          - ingress

      node2:
        disk-size: 15
        no-of-volumes: 3
        role:
          - mgr
          - mon
          - osd
          - ingress

      node3:
        disk-size: 15
        no-of-volumes: 3
        role:
          - mon
          - osd
          - rgw
          - ingress

      node4:
        disk-size: 15
        no-of-volumes: 3
        role:
          - osd
          - rgw
          - client
          - ingress
