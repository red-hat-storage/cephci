# Kernel verification cluster: RHCS 7.x on RHEL 9, clients on RHEL 8.
#
# RHCS 7.1 supports RHEL 8 only as a client OS; bootstrap and all daemons
# must run on RHEL 9. Cluster nodes use the image from --inventory (RHEL 9).
# Client nodes (node4-node5) override to RHEL 8 below.
#
# Use with:
#   --platform rhel-9
#   --inventory conf/inventory/rhel-9.6-server-x86_64.yaml
#   --rhbuild 7.1
#   --global-conf conf/squid/cephfs/kernel_verification_rhel8_client.yaml
#   --suite suites/tentacle/cephfs/kernel_pre_verification_rhel8_client.yaml
globals:
  - ceph-cluster:
      name: ceph
      node1:
        role:
          - _admin
          - mon
          - mgr
          - installer
          - mds
          - osd
        no-of-volumes: 5
        disk-size: 20
      node2:
        role:
          - mon
          - mgr
          - osd
          - mds
        no-of-volumes: 5
        disk-size: 20
      node3:
        role:
          - osd
          - mon
          - mds
          - nfs
        no-of-volumes: 5
        disk-size: 20
      node4:
        role:
          - osd
          - mds
        no-of-volumes: 5
        disk-size: 20
      node5:
        image-name:
          openstack: RHEL-8.8.0-x86_64-ga-latest
        role:
          - client
      node6:
        image-name:
          openstack: RHEL-8.8.0-x86_64-ga-latest
        role:
          - client
