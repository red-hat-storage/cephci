[settings]
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
line_length = 88
skip =
    .tox,
    .venv,
    .venv-pr-check,
    ven,
    logs,
    scripts
skip_glob =
    */.venv*/*,
    */.tox/*,
    */.venv-pr-check/*
