#===============================================================================================
# Quincy BVT — deploy + client setup + RGW/RBD/FS checks
# Conf: conf/quincy/smoke/1admin-4node-1client-bvt.yaml
# Content from quincy compaction deploy + suites/quincy/common/smoke/bvt.yaml
#===============================================================================================
tests:
  - test:
      name: Setup pre-requisites
      desc: Setup packages and configuration for cluster deployment
      module: install_prereq.py
      abort-on-fail: true

  - test:
      name: Deploy cluster using cephadm
      desc: Bootstrap and deploy services
      polarion-id: CEPH-83573713
      module: test_cephadm.py
      config:
        steps:
          - config:
              service: cephadm
              command: bootstrap
              args:
                mon-ip: node1
          - config:
              service: host
              command: add_hosts
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              service: osd
              command: apply
              args:
                all-available-devices: true
          - config:
              service: rgw
              command: apply
              pos_args:
                - rgw.1
              args:
                placement:
                  label: rgw
          - config:
              command: shell
              args:
                - "ceph fs volume create cephfs"
          - config:
              service: mds
              command: apply
              args:
                placement:
                  label: mds
              base_cmd_args:
                verbose: true
              pos_args:
                - cephfs
          - config:
              command: shell
              args:
                - "ceph osd pool create rbd"
          - config:
              command: shell
              args:
                - "rbd pool init rbd"
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: Configure client
      desc: Configure the RGW & RBD clients
      module: test_client.py
      config:
        command: add
        id: client.1
        node: node4
        install_packages:
          - ceph-common
        copy_admin_keyring: true
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: Executes RGW, RBD and FS operations
      desc: Run object, block and filesystem basic operations parallelly.
      module: test_parallel.py
      parallel:
        - test:
            name: Test M buckets with N objects
            desc: test to create "M" no of buckets and "N" no of objects
            polarion-id: CEPH-9789
            module: sanity_rgw.py
            config:
              script-name: test_Mbuckets_with_Nobjects.py
              config-file-name: test_Mbuckets_with_Nobjects.yaml
              timeout: 300

        - test:
            name: Run RBD tier-0 operations
            desc: Run RBD tier-0 operations
            polarion-id: CEPH-83575401
            module: rbd_tier0.py
            config:
              ec-pool-k-m: 2,1
              ec-pool-only: False
              ec_pool_config:
                pool: rbd_pool
                data_pool: rbd_ec_pool
                ec_profile: rbd_ec_profile
                image: rbd_image
                image_thick_provision: rbd_thick_image
                snap_thick_provision: rbd_thick_snap
                clone_thick_provision: rbd_thick_clone
                thick_size: 2G
                size: 10G
                snap: rbd_ec_pool_snap
                clone: rbd_ec_pool_clone
              rep_pool_config:
                pool: rbd_rep_pool
                image: rbd_rep_image
                image_thick_provision: rbd_rep_thick_image
                snap_thick_provision: rbd_rep_thick_snap
                clone_thick_provision: rbd_rep_thick_clone
                thick_size: 2G
                size: 10G
                snap: rbd_rep_pool_snap
                clone: rbd_rep_pool_clone
              operations:
                map: true
                io: true
                nounmap: false

        - test:
            name: cephfs-basics
            desc: "cephfs basic operations"
            polarion-id: "CEPH-11293,CEPH-11296,CEPH-11297,CEPH-11295"
            module: cephfs_basic_tests.py
