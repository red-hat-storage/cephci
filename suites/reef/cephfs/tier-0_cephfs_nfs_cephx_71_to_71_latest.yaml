#===============================================================================================
# Cluster Configuration:
#    conf/reef/cephfs/tier-2_cephfs_9-node-cluster.yaml
#
# Combined CephFS + NFS CephX upgrade track (2-node NFS + 4 clients).
# 7.1z10 (non-CephX, NFS-capable) -> CephX target from Jenkins/CLI only (7.1 latest).
#
# Sequence: deploy -> parallel C1-C4 client add -> CephX FS+mount (C1-C3;
#   C4 NFS-dedicated) -> NFS 2-node mount C1-C4 -> parallel pre-IO NFS||CephFS
#   -> upgrade || CephFS IO -> NFS rotate-key (live C1) -> NFS IO C1-C4 no
#   remount (incl. C4) -> CephFS post path (C1 holdout, C2+C3 RPM/kernel/
#   aes256k) -> NFS IO C1-C4 again. Kernel gate remains CephFS C2+C3 only.
#===============================================================================================
---
tests:
  - test:
      abort-on-fail: true
      desc: "Setup phase to deploy the required pre-requisites for running the tests."
      module: install_prereq.py
      name: "Setup install prerequisites"
  - test:
      abort-on-fail: true
      config:
        steps:
          - config:
              args:
                rhcs-version: 7.1
                release: z10
                mon-ip: node1
                orphan-initial-daemons: true
                registry-url: registry.redhat.io
                skip-monitoring-stack: true
              base_cmd_args:
                verbose: true
              command: bootstrap
              service: cephadm
          - config:
              args:
                attach_ip_address: true
                labels: apply-all-labels
              command: add_hosts
              service: host
          - config:
              args:
                placement:
                  label: mgr
              command: apply
              service: mgr
          - config:
              args:
                placement:
                  label: mon
              command: apply
              service: mon
          - config:
              args:
                all-available-devices: true
              command: apply
              service: osd
          - config:
              args:
                - ceph
                - fs
                - volume
                - create
                - cephfs
              command: shell
          - config:
              args:
                placement:
                  label: mds
              base_cmd_args:
                verbose: true
              command: apply
              pos_args:
                - cephfs
              service: mds
          - config:
              args:
                - ceph
                - fs
                - set
                - cephfs
                - max_mds
                - "2"
              command: shell
          # cephfs2 created in cephfs_cephx_upgrade_setup.py
        verify_cluster_health: true
      desc: "bootstrap+cephfs max_mds=2; NFS roles from conf"
      destroy-cluster: false
      module: test_cephadm.py
      name: "Cluster deploy cephfs mds=2"
      polarion-id: CEPH-83573777

  - test:
      name: "C1-C4 client add"
      module: test_parallel.py
      desc: "In parallel: ceph-common/ceph-fuse + admin keyring"
      abort-on-fail: true
      parallel:
        - test:
            abort-on-fail: true
            config:
              command: add
              copy_admin_keyring: true
              id: client.1
              install_packages:
                - ceph-common
                - ceph-fuse
              nodes:
                - node8:
                    release: "7.1"
                    tag: z10
            desc: "Configure client.1 on node8"
            destroy-cluster: false
            module: test_client.py
            name: "C1 client add"
        - test:
            abort-on-fail: true
            config:
              command: add
              copy_admin_keyring: true
              id: client.2
              install_packages:
                - ceph-common
                - ceph-fuse
              nodes:
                - node9:
                    release: "7.1"
                    tag: z10
            desc: "Configure client.2 on node9"
            destroy-cluster: false
            module: test_client.py
            name: "C2 client add"
        - test:
            abort-on-fail: true
            config:
              command: add
              copy_admin_keyring: true
              id: client.3
              install_packages:
                - ceph-common
                - ceph-fuse
              nodes:
                - node10:
                    release: "7.1"
                    tag: z10
            desc: "Configure client.3 on node10"
            destroy-cluster: false
            module: test_client.py
            name: "C3 client add"
        - test:
            abort-on-fail: true
            config:
              command: add
              copy_admin_keyring: true
              id: client.4
              install_packages:
                - ceph-common
                - ceph-fuse
              nodes:
                - node11:
                    release: "7.1"
                    tag: z10
            desc: "Configure client.4 on node11; NFS-dedicated later (no CephFS recipes)"
            destroy-cluster: false
            module: test_client.py
            name: "C4 client add"


  - test:
      name: "Enable Ceph log-to-file"
      module: rados_prep.py
      config:
        log_to_file: true
      desc: "Change config options to enable logging to file"
      abort-on-fail: false

  - test:
      name: "CephX FS+mount setup"
      module: cephfs_upgrade.cephfs_cephx_upgrade_setup.py
      desc: "cephfs+cephfs2; C1/C2 live, C3 fstab; no C4 CephFS"
      abort-on-fail: true

  - test:
      name: "NFS 2-node + C1-C4 mounts"
      module: cephfs_upgrade.cephfs_cephx_nfs.py
      desc: "2-node NFS on cephfs; C4 NFS-dedicated"
      abort-on-fail: true
      config:
        action: setup
        clients: 4
        fs_name: cephfs
        nfs_name: cephfs-nfs-cephx
        nfs_mount: /mnt/nfs_cephx
        nfs_version: "4.1"

  - test:
      name: "Pre-upgrade IO NFS||CephFS"
      module: test_parallel.py
      desc: "parallel NFS + CephFS light IO"
      abort-on-fail: true
      parallel:
        - test:
            name: "Pre-upg NFS IO C1-C4"
            module: cephfs_upgrade.cephfs_cephx_nfs.py
            desc: "seed+probe; includes NFS-dedicated C4"
            abort-on-fail: true
            config:
              action: io
              clients: 4
              seed: true
              tag: nfs_pre_upgrade
        - test:
            name: "Pre-upgrade CephFS light IO"
            module: cephfs_upgrade.cephfs_cephx_client_ops.py
            desc: "CephX recipe mounts C1-C3"
            abort-on-fail: true
            config:
              action: pre_io

  - test:
      abort-on-fail: false
      desc: "Collect ceph versions and file stats on mounts before the cluster upgrade."
      module: cephfs_upgrade.metadata_version_validation.py
      name: "Metadata before upgrade"
      polarion-id: CEPH-83575313

  - test:
      abort-on-fail: false
      desc: "Enable ceph debug logs"
      module: cephfs_logs_util.py
      name: "Enable CephFS debug logs"
      config:
        ENABLE_LOGS: 1
        daemon_list: ['mds','client','osd','mgr','mon']
        daemon_dbg_level: {'mds':10,'client':10,'osd':5,'mgr':5,'mon':5}

  - test:
      abort-on-fail: false
      desc: "Set size limit for log rotation"
      name: "Set log-rotate size limit"
      module: cephfs_logs_util.py
      config:
        LOG_ROTATE_SIZE: 1
        log_size: '200M'

  - test:
      abort-on-fail: false
      desc: "Setup Crash configuration"
      module: cephfs_crash_util.py
      name: "Crash dump setup"
      config:
        crash_setup: 1
        daemon_list: ['mds','osd','mgr','mon']

  - test:
      name: "Upgrade || CephFS IO"
      module: test_parallel.py
      desc: "cluster upgrade || background CephFS IO"
      abort-on-fail: true
      parallel:
        - test:
            # Soft-fail: background IO may stop when MDS/mon bounce mid-upgrade;
            # cluster upgrade child remains abort-on-fail: true.
            abort-on-fail: false
            config:
              timeout: 1800
              # Do NOT set client_upgrade — Client2 RPM is post-upgrade only
            desc: "CephFS mounts only; no NFS"
            module: cephfs_upgrade.cephfs_io.py
            name: "CephFS IO during upgrade"
            polarion-id: CEPH-83575315
        - test:
            name: "Cluster upgrade CephX"
            desc: "Jenkins/CLI target; client RPM holdout"
            module: test_cephadm_upgrade.py
            polarion-id: CEPH-83574638
            abort-on-fail: true
            config:
              command: start
              service: upgrade
              # Target: Jenkins/CLI only (container_image / base_url). No in-suite pin.
              # Client1 RPM holdout; Client2/3 via cephfs_cephx_client_rpm.
              upgrade_client: false
              base_cmd_args:
                verbose: true
              benchmark:
                type: rados
                pool_per_client: true
                pg_num: 128
                duration: 10
              verify_cluster_health: true
            destroy-cluster: false

  - test:
      abort-on-fail: false
      desc: "Check for Crash"
      module: cephfs_crash_util.py
      name: "Crash dump check"
      config:
        crash_check: 1
        daemon_list: ['mds','osd','mgr','mon']

  - test:
      abort-on-fail: false
      desc: "Disable ceph debug logs"
      module: cephfs_logs_util.py
      name: "Disable CephFS debug logs"
      config:
        DISABLE_LOGS: 1
        daemon_list: ['mds','client','osd','mgr','mon']

  - test:
      abort-on-fail: false
      desc: "Validate ceph versions and file stats on mounts after the cluster upgrade."
      module: cephfs_upgrade.metadata_version_validation.py
      name: "Metadata after upgrade"
      polarion-id: CEPH-83575313


  - test:
      name: "NFS rotate-key (IO on C1)"
      module: test_nfs_cephx_key_rotation.py
      desc: "live mount; no umount/remount"
      abort-on-fail: true
      polarion-id: CEPH-83633001
      config:
        setup: false
        clients: 1
        nfs_name: cephfs-nfs-cephx
        nfs_mount: /mnt/nfs_cephx
        nfs_export: /export_cephx_0
        fs_name: cephfs
        nfs_version: "4.1"

  - test:
      name: "NFS IO C1-C4 no remount"
      module: cephfs_upgrade.cephfs_cephx_nfs.py
      desc: "post rotate-key; same mounts; C4 NFS-dedicated"
      abort-on-fail: true
      config:
        action: io
        clients: 4
        tag: nfs_post_rotate
        remount_if_missing: false

  - test:
      name: "Client1 CephX holdout"
      module: cephfs_upgrade.cephfs_cephx_client_ops.py
      desc: "no RPM/key rotate; old creds IO + new mounts"
      abort-on-fail: true
      config:
        action: holdout
        holdout_client: client.1

  - test:
      name: "Admin aes256k rotate"
      module: cephfs_upgrade.cephfs_cephx_rotate.py
      desc: "rewrite admin keyrings"
      abort-on-fail: true
      polarion-id: CEPH-xxxxx
      config:
        target: admin
        key_type: aes256k

  # --- Post-aes256k-rotate: C2 live remount; C3 reboot uses existing fstab (no rewrite) ---
  - test:
      name: "Client2+3 RPM upgrade"
      module: test_parallel.py
      desc: "parallel C2+C3"
      abort-on-fail: true
      parallel:
        - test:
            name: "C2 RPM align CephX"
            module: cephfs_upgrade.cephfs_cephx_client_rpm.py
            desc: "Install/align ceph-common and ceph-fuse on client.2"
            abort-on-fail: true
            polarion-id: CEPH-xxxxx
            config:
              client: client.2
        - test:
            name: "C3 RPM align CephX"
            module: cephfs_upgrade.cephfs_cephx_client_rpm.py
            desc: "Install/align ceph-common and ceph-fuse on client.3"
            abort-on-fail: true
            polarion-id: CEPH-xxxxx
            config:
              client: client.3

  - test:
      name: "Client2+3 kernel gate"
      module: cephfs_upgrade.cephfs_cephx_client_kernel_gate.py
      desc: "enable_rhel_rpms + latest/pin kernel; reboot if needed"
      abort-on-fail: true
      polarion-id: CEPH-xxxxx
      config:
        clients:
          - client.2
          - client.3
        kernel: latest
        reboot_timeout: 900
        update_kernel: true

  - test:
      name: "C2+C3 aes256k rotate"
      module: test_parallel.py
      desc: "parallel"
      abort-on-fail: true
      parallel:
        - test:
            name: "C2 aes256k rotate"
            module: cephfs_upgrade.cephfs_cephx_rotate.py
            desc: "redeploy keyring+secret"
            abort-on-fail: true
            polarion-id: CEPH-xxxxx
            config:
              target: client
              rotate_client: client.2
              key_type: aes256k
        - test:
            name: "C3 aes256k rotate"
            module: cephfs_upgrade.cephfs_cephx_rotate.py
            desc: "redeploy keyring+secret"
            abort-on-fail: true
            polarion-id: CEPH-xxxxx
            config:
              target: client
              rotate_client: client.3
              key_type: aes256k

  - test:
      name: "C2 umount+remount"
      module: cephfs_upgrade.cephfs_cephx_client_ops.py
      desc: "post rotate; live remount path"
      abort-on-fail: true
      polarion-id: CEPH-xxxxx
      config:
        action: remount
        client: client.2

  - test:
      name: "C2 remount IO||C3 reboot"
      module: test_parallel.py
      desc: "C3 fstab remount after reboot"
      abort-on-fail: true
      parallel:
        - test:
            name: "C2 IO on remounted paths"
            module: cephfs_upgrade.cephfs_cephx_client_ops.py
            desc: "Probe IO on client.2 mounts after live umount/remount with rotated credentials."
            abort-on-fail: true
            polarion-id: CEPH-xxxxx
            config:
              action: mount_io
              client: client.2
              mount_set: remounted
        - test:
            name: "C3 reboot+fstab remount"
            module: cephfs_upgrade.cephfs_cephx_client_ops.py
            desc: "wait SSH; verify fstab mounts"
            abort-on-fail: true
            polarion-id: CEPH-xxxxx
            config:
              action: reboot
              client: client.3
              reboot_timeout: 900
              verify_mounts: true

  - test:
      name: "C2 new mounts||C3 fstab IO"
      module: test_parallel.py
      desc: "After aes256k rotate: C2 creates new mounts while C3 probes IO on fstab-restored mounts"
      abort-on-fail: true
      parallel:
        - test:
            name: "C2 new kernel+fuse mounts"
            module: cephfs_upgrade.cephfs_cephx_client_ops.py
            desc: "Create additional kernel and fuse mounts on client.2 using rotated aes256k credentials."
            abort-on-fail: true
            polarion-id: CEPH-xxxxx
            config:
              action: new_mounts
              client: client.2
        - test:
            name: "C3 IO on fstab mounts"
            module: cephfs_upgrade.cephfs_cephx_client_ops.py
            desc: "Probe IO on client.3 mounts that came up from existing /etc/fstab after reboot (post aes256k rotate)."
            abort-on-fail: true
            polarion-id: CEPH-xxxxx
            config:
              action: mount_io
              client: client.3
              mount_set: remounted
              verify_mounted: true

  - test:
      name: "C2 new IO||C3 new mounts"
      module: test_parallel.py
      desc: "After aes256k rotate: probe C2 new-mount IO while C3 creates new mounts"
      abort-on-fail: true
      parallel:
        - test:
            name: "C2 IO on new mounts"
            module: cephfs_upgrade.cephfs_cephx_client_ops.py
            desc: "Probe IO on client.2 mounts created after aes256k key rotate."
            abort-on-fail: true
            polarion-id: CEPH-xxxxx
            config:
              action: mount_io
              client: client.2
              mount_set: new
        - test:
            name: "C3 new kernel+fuse mounts"
            module: cephfs_upgrade.cephfs_cephx_client_ops.py
            desc: "Create additional kernel and fuse mounts on client.3 using rotated aes256k credentials."
            abort-on-fail: true
            polarion-id: CEPH-xxxxx
            config:
              action: new_mounts
              client: client.3

  - test:
      name: "C3 IO on new mounts"
      module: cephfs_upgrade.cephfs_cephx_client_ops.py
      desc: "Probe IO on client.3 mounts created after aes256k key rotate."
      abort-on-fail: true
      polarion-id: CEPH-xxxxx
      config:
        action: mount_io
        client: client.3
        mount_set: new

  - test:
      name: "NFS IO C1-C4 post CephFS"
      module: cephfs_upgrade.cephfs_cephx_nfs.py
      desc: "after CephFS path; same mounts; fail if NFS not mounted"
      abort-on-fail: true
      config:
        action: io
        clients: 4
        tag: nfs_post_cephfs
        remount_if_missing: false
