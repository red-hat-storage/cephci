#============================================================
# Test-Case: Secure monitoring in FIPS mode (IBMCEPH-17891 / 8.1z10)
#
# Cluster Configuration:
#    conf/squid/cephadm/1admin-4node-1client-cluster.yaml
#
# Note: Requires FIPS-enabled hosts. Enables secure_monitoring_stack and
#       validates Prometheus/auth path without MD5/OpenSSL failures.
#============================================================

tests:
  - test:
      name: setup install pre-requisistes
      desc: Setup phase to deploy the required pre-requisites for running the tests.
      module: install_prereq.py
      abort-on-fail: true

  - test:
      abort-on-fail: true
      config:
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              command: apply
              service: prometheus
              args:
                placement:
                  nodes:
                    - node1
                  limit: 1
          - config:
              command: apply
              service: grafana
              args:
                placement:
                  nodes:
                    - node1
                  limit: 1
      desc: bootstrap and deploy monitoring stack.
      destroy-cluster: false
      polarion-id: CEPH-83573713
      module: test_cephadm.py
      name: Deploy cluster using cephadm

  - test:
      name: Enable secure monitoring stack
      desc: Set mgr/cephadm/secure_monitoring_stack and validate Prometheus auth
      module: test_mon_stack_auth.py
      polarion-id: CEPH-83575111
      abort-on-fail: true
      config:
        username: "admin"
        password: "admin@123"

  - test:
      name: Verify monitoring health after secure enablement
      desc: Confirm prometheus/grafana remain healthy under secure monitoring
      module: exec.py
      config:
        sudo: True
        check_status: True
        commands:
          - "ceph config get mgr mgr/cephadm/secure_monitoring_stack"
          - "ceph orch ps --daemon-type prometheus"
          - "ceph health detail"
