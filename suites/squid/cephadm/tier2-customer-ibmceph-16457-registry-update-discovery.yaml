#============================================================
# Test-Case: Registry update discovery backport (IBMCEPH-16457 / 8.1z10)
#
# Cluster Configuration:
#    conf/squid/upgrades/1admin-3node-1client-upgrade.yaml
#
# Note: Same symptom class as IBMCEPH-10767; keep separate squid evidence.
#============================================================

tests:
  - test:
      name: setup install pre-requisistes
      desc: Setup phase to deploy the required pre-requisites for running the tests.
      module: install_prereq.py
      abort-on-fail: true

  - test:
      name: Bootstrap cluster and deploy services with label placements.
      desc: Bootstrap cluster and deploy services with label placements.
      polarion-id: CEPH-83573777
      module: test_cephadm.py
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
                orphan-initial-daemons: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: Configure client1
      desc: Configure the RGW,RBD client system
      module: test_client.py
      polarion-id: CEPH-83573777
      config:
        command: add
        id: client.1
        node: node4
        install_packages:
          - ceph-common
        copy_admin_keyring: true
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: List available upgrades via orchestrator
      desc: Validate registry-authenticated upgrade discovery on 8.1z10 backport
      module: exec.py
      config:
        sudo: True
        check_status: True
        commands:
          - "ceph orch upgrade check"
          - "ceph versions"
          - "ceph health detail"
