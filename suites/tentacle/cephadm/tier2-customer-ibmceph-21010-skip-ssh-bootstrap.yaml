#============================================================
# Test-Case: Bootstrap with --skip-ssh (IBMCEPH-21010 / 9.2z1)
#
# Cluster Configuration:
#    conf/tentacle/cephadm/2admin-3node-1rgw-1client-sanity.yaml
#============================================================

tests:
  - test:
      name: setup install pre-requisistes
      desc: Setup phase to deploy the required pre-requisites for running the tests.
      module: install_prereq.py
      abort-on-fail: true

  - test:
      name: Cephadm Bootstrap with skip-ssh
      desc: Bootstrap cluster using --skip-ssh and automatic license acceptance
      module: test_bootstrap.py
      destroy-cluster: false
      abort-on-fail: true
      config:
        command: bootstrap
        base_cmd_args:
          verbose: true
        args:
          custom_image: true
          mon-ip: node1
          skip-ssh: true
          skip-dashboard: true
          skip-monitoring-stack: true

  - test:
      name: Add all hosts to ceph cluster
      desc: Add all host node with IP address and labels
      module: test_host.py
      config:
        service: host
        command: add_hosts
        args:
          nodes: []
          attach_ip_address: true
          labels: apply-all-labels
      destroy-cluster: false
      abort-on-fail: true
