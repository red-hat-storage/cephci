---
# ==================================================================================
# Tier-level: 3
# Test-Suite: tier3-cephadm-agent-scale-regression.yaml
#
# Cephadm agent scale regression (TC1–TC3)
#
# Prerequisites:
#   - use_agent is enabled in bootstrap args.config (mgr/cephadm/use_agent=true).
#     Optional once PR #6310 merges: also pass --custom-config use_agent=true.
#   - Lab conf with enough nodes (bootstrap + initial_hosts + expand_hosts).
#     DMFG regression target: 1 installer + 40 + 10 = 51 non-client nodes (~100 OSDs).
#     The 151-host run is tier3-cephadm-agent-scale-regression-151.yaml
#     (dedicated pipeline, not this DMFG regression suite).
#     Pressure is on RGW daemons, NFS clusters, and MDS, not OSD count.
#     Context: tests/cephadm/cephadm_agent/CONTEXT.md
#   - Smaller labs: keep allow_fewer_hosts=true (default) and/or override scale.*.
#   - Guest image comes from --inventory (RHEL 9.8 or 10.2).
#
# IBM Cloud conf (preferred):
#   conf/tentacle/cephadm/1admin-51node-1client-agent-scale-ibmc.yaml
#   inventory: conf/inventory/ibm-rhel-9.8.yaml
#              or conf/inventory/ibm-rhel-10.2.yaml
#
# Smoke / gate (IBM):
#   conf/tentacle/cephadm/1admin-9node-1client-agent-scale-ibmc-smoke.yaml
#   suite: tier3-cephadm-agent-scale-regression-smoke.yaml
#
# TC1  Bootstrap 1 host (use_agent) → add 40 hosts / ~80 OSDs
#      Measure: host-add+agent-UP, OSD-create+UP; deploy RGW/NFS/MDS
#      abort-on-fail: only TC1 aborts remaining TCs if bring-up fails
# TC2–TC6, TC8–TC9 run independently (no abort-on-fail)
# TC7 firewall omitted — covered by tier2 communication/network_partition
# TC2  Mgr failover → measure agent retarget to new mgr (+ health/RSS + IO)
# TC3  Expand +10 hosts / +20 OSDs → measure host+agent and OSD timings
#
# Monitors (TC2/TC3 for AGENT_DOWN; all cases for RSS):
#   - ceph health every 30s for CEPHADM_AGENT_DOWN (fail if seen)
#   - active mgr RSS sampling every 30s
#
# Each TC is a separate suite test + module for clear reporting / maintenance:
#   test_agent_scale_bringup.py | test_agent_scale_mgr_failover.py |
#   test_agent_scale_expansion.py  (+ scale_regression_ops.py shared helpers)
# Add future TCs as new modules + suite entries (do not grow a monolith).
# ==================================================================================
tests:
  - test:
      name: Install ceph pre-requisites
      desc: Installation of ceph pre-requisites
      module: install_prereq.py
      abort-on-fail: true

  - test:
      name: Cephadm Bootstrap (1 host, use_agent)
      desc: Bootstrap single-host cluster with mgr/cephadm/use_agent=true
      module: test_bootstrap.py
      config:
        command: bootstrap
        base_cmd_args:
          verbose: true
        args:
          custom_image: true
          mon-ip: "node1"
          orphan-initial-daemons: true
          # monitoring stack enabled (prometheus/grafana/alertmanager/node-exporter)
          # use_agent via bootstrap --config (independent of PR #6310 custom-config)
          config:
            mgr:
              mgr/cephadm/use_agent: true
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: Cephadm agent scale regression TC1 host OSD bring-up
      desc: >
        TC1: add ~40 hosts / ~80 OSDs with timings; ensure monitoring;
        deploy many RGW daemons, NFS clusters, and MDS.
        Fail here aborts remaining TCs.
      module: cephadm_agent.test_agent_scale_bringup.py
      abort-on-fail: true
      config:
        scale: &agent_scale_regression
          # ~50 OSD hosts total. Protocol daemons carry the scale pressure.
          initial_hosts: 40
          initial_osds: 80
          expand_hosts: 10
          expand_osds: 20
          allow_fewer_hosts: true
          host_add_mode: burst
          host_labels:
            - osd
            - mgr
            - node-exporter
            - crash
          ensure_monitoring: true
          host_timeout: 7200
          agent_timeout: 7200
          osd_timeout: 10800
          mgr_failover_timeout: 180
          retarget_timeout: 1800
          health_poll_sec: 30
          mgr_rss_poll_sec: 30
          fail_on_agent_down: true
          max_mgr_rss_growth_kb: 0
          deploy_rgw: true
          deploy_nfs: true
          deploy_mds: true
          rgw_count: 16
          nfs_clusters: 8
          mds_count: 8
          # Reuse an already-scaled cluster: set skip_tc1_bringup=true
          # TC3 auto-skips when no unused conf nodes remain (skip_tc3_if_no_hosts)
          skip_tc1_bringup: false
          skip_tc3_if_no_hosts: true
          mgr_failover_iterations: 3
          agent_restart_sample: 1
          auth_check_sample: 0
          cert_store_max_entry_bytes: 65536
          workloads:
            enable_rados: true
            enable_rgw: true
            enable_nfs: true
            rados_bench_sec: 30

  - test:
      name: Cephadm agent scale regression TC2 mgr failover retarget
      desc: >
        TC2: fail active mgr; measure agent retarget under RGW/NFS/rados IO;
        CEPHADM_AGENT_DOWN + mgr RSS monitors
      module: cephadm_agent.test_agent_scale_mgr_failover.py
      config:
        scale: *agent_scale_regression

  - test:
      name: Cephadm agent scale regression TC3 node expansion
      desc: >
        TC3: expand +10 hosts / +20 OSDs with timings under IO; health/RSS monitors.
        Skips cleanly when no unused conf nodes remain.
      module: cephadm_agent.test_agent_scale_expansion.py
      config:
        scale: *agent_scale_regression

  - test:
      name: Cephadm agent scale regression TC4 agent restart
      desc: Stop/start agent; CEPHADM_AGENT_DOWN raise and clear
      module: cephadm_agent.test_agent_scale_restart.py
      config:
        scale: *agent_scale_regression

  - test:
      name: Cephadm agent scale regression TC5 mgr failover loop
      desc: Repeated mgr failover + retarget under IO
      module: cephadm_agent.test_agent_scale_mgr_loop.py
      config:
        scale: *agent_scale_regression

  - test:
      name: Cephadm agent scale regression TC6 registry auth
      desc: podman-auth.json presence on agent hosts
      module: cephadm_agent.test_agent_scale_registry_auth.py
      config:
        scale: *agent_scale_regression

  - test:
      name: Cephadm agent scale regression TC8 monitoring
      desc: Monitoring stack running after scale
      module: cephadm_agent.test_agent_scale_monitoring.py
      config:
        scale: *agent_scale_regression

  - test:
      name: Cephadm agent scale regression TC9 cert store size
      desc: Cert-store related config-key size under limit
      module: cephadm_agent.test_agent_scale_cert_store.py
      config:
        scale: *agent_scale_regression
