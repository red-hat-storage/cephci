#===============================================================================================
# Tier-level: 2
# Test-Suite: tier2-validate-ceph-secrets-module.yaml
#
# Cluster Configuration:
#   conf/tentacle/cephadm/1admin-4node-1client-cluster.yaml
#
# Description:
#   Validates the full lifecycle of the ceph_secrets MGR module, including:
#     - Enable the ceph_secrets MGR module
#     - Set a secret via `ceph secret set`
#     - Get secret metadata without reveal
#     - Get secret metadata with --reveal
#     - Get raw secret value via `ceph secret get-value`
#     - List secrets filtered by namespace, scope, and target
#     - Remove a secret and verify idempotency (not_found on second rm)
#     - Disable the ceph_secrets MGR module
#===============================================================================================

tests:
  - test:
      abort-on-fail: true
      desc: Install software pre-requisites for cluster deployment.
      module: install_prereq.py
      name: setup pre-requisites

  - test:
      abort-on-fail: true
      config:
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              args:
                - "ceph osd pool create rbd"
              command: shell
          - config:
              args:
                - "rbd pool init rbd"
              command: shell
      desc: Bootstrap cluster and deploy core services.
      destroy-cluster: false
      polarion-id: CEPH-83573713
      module: test_cephadm.py
      name: Deploy cluster using cephadm

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.1
        node: node4
        install_packages:
          - ceph-common
        copy_admin_keyring: true
      desc: Configure the client node.
      destroy-cluster: false
      module: test_client.py
      name: configure client

  - test:
      name: Validate ceph_secrets module - lifecycle
      desc: >
        Enable the ceph_secrets MGR module and verify the full secret lifecycle
      polarion-id: CEPH-83632946
      module: test_ceph_secrets_module.py
      config:
        namespace: cephadm
        scope: service
        target: test-service
        secret_name: api_token
        secret_data: "test-secret-value-12345"
