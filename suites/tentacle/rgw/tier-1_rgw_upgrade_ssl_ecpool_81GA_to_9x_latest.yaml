  - test:
      name: checksum with go script pre upgrade
      desc: test checksum with go script pre upgrade. rgw ssl required for chunked upload with trailing checksum
      polarion-id: CEPH-83591699
      module: sanity_rgw.py
      config:
        script-name: ../go_scripts/test_rgw_using_go.py
        config-file-name: ../../go_scripts/configs/test_checksum_using_go.yaml

  - test:
      name: S3CMD tests, rgw log details pre upgrade
      desc: S3CMD tests, rgw log details pre upgrade
      polarion-id: CEPH-83575470
      module: sanity_rgw.py
      config:
        script-name: ../s3cmd/test_rgw_ops_log.py
        config-file-name: ../../s3cmd/configs/test_rgw_log_details.yaml
        run-on-haproxy: true

  - test:
      name: Ratelimit for versioned buckets pre upgrade
      desc: Test Ratelimit for versioned buckets pre upgrade
      polarion-id: CEPH-83574912
      module: sanity_rgw.py
      config:
        script-name: ../s3cmd/test_rate_limit.py
        config-file-name: ../../s3cmd/configs/test_ratelimit_versioned_bucket.yaml

  - test:
      name: LC expiration header with days pre upgrade
      desc: Test header validation bucket lifecycle expiration with days pre upgrade
      polarion-id: CEPH-83573254
      module: sanity_rgw.py
      config:
        script-name: test_bucket_lifecycle_object_expiration_transition.py
        config-file-name: test_lc_days_expire_header.yaml
        run-on-haproxy: true

  - test:
      name: swift object expire pre upgrade
      desc: test object expiration with swift pre upgrade
      polarion-id: CEPH-9718
      module: sanity_rgw.py
      config:
        script-name: test_swift_basic_ops.py
        config-file-name: test_swift_object_expire_op.yaml

  # upgrade cluster
  - test:
      name: Upgrade cluster to latest ceph version
      desc: Upgrade cluster to latest version
      module: test_cephadm_upgrade.py
      polarion-id: CEPH-83573791
      verify_cluster_health: true
      abort-on-fail: true
      config:
        command: start
        service: upgrade
        base_cmd_args:
          verbose: true

  - test:
