# Objective: P0 singlesite SSL upgrade from RHCS 8.1z(GA) to 9.x latest.
# Cluster: EC 2+2 @4 nodes + SSL + haproxy + min 3 RGW daemons (ss + ssl)
# platform: RHEL-9
# global-conf: conf/tentacle/rgw/ec-profile-2+2@4nodes.yaml

tests:
  - test:
      abort-on-fail: true
      desc: Install software pre-requisites for cluster deployment.
      module: install_prereq.py
      name: Setup pre-requisites

  - test:
      abort-on-fail: true
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                rhcs-version: 8.1
                release: released
                registry-url: registry.redhat.io
                mon-ip: node1
                orphan-initial-daemons: true
                skip-monitoring-stack: true
              base_cmd_args:
                verbose: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              args:
                - "ceph osd erasure-code-profile set rgwec22_4 k=2 m=2"
                - "crush-failure-domain=host crush-device-class=hdd"
              command: shell
          - config:
              args:
                - "ceph osd pool create default.rgw.buckets.data 32 32"
                - "erasure rgwec22_4"
              command: shell
          - config:
              args:
                - "ceph osd pool create default.rgw.buckets.index 32 32"
              command: shell
          - config:
              args:
                - "ceph osd pool application enable"
                - "default.rgw.buckets.data rgw"
              command: shell
          - config:
              args:
                - "ceph osd pool application enable"
                - "default.rgw.buckets.index rgw"
              command: shell
          - config:
              command: apply_spec
              service: orch
              specs:
                - service_type: rgw
                  service_id: rgw.ssl
                  placement:
                    nodes:
                      - node2
                      - node3
                      - node4
                  spec:
                    ssl: true
                    generate_cert: true
                    rgw_frontend_extra_args:
                      - "port=80"
      desc: bootstrap and deployment services with label placements.
      polarion-id: CEPH-83573777
      destroy-cluster: false
      module: test_cephadm.py
      name: Deploy RHCS-ssl cluster using cephadm

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.1
        node: node4
        install_packages:
          - ceph-common
        copy_admin_keyring: true
      desc: Configure the RGW client system
      destroy-cluster: false
      module: test_client.py
      name: Configure client
      polarion-id: CEPH-83573758

  - test:
      abort-on-fail: true
      config:
        haproxy_clients:
          - node4
        rgw_endpoints:
          - node2:80
          - node3:80
          - node4:80
      desc: Configure HAproxy
      module: haproxy.py
      name: Configure HAproxy

  - test:
      abort-on-fail: true
      config:
        roles:
          - rgw
          - client
      desc: Copy cephadm root CA cert to rgw and client nodes
      module: copy_cephadm_root_ca_cert.py
      name: copy cephadm root ca cert
      polarion-id: CEPH-10362

  # Pre upgrade P0 tests (Squid 8.1 introduced / different from 7.1 SS P0)
  - test:
      name: Mbuckets_with_Nobjects with etag verification pre upgrade
      desc: test etag verification pre upgrade
      polarion-id: CEPH-83574871
      module: sanity_rgw.py
      config:
        script-name: test_Mbuckets_with_Nobjects.py
        config-file-name: test_Mbuckets_with_Nobjects_etag.yaml
        run-on-haproxy: true

  - test:
      name: Test large omap creation pre upgrade
      desc: Test large omap creation pre upgrade
      polarion-id: CEPH-83591446
      module: sanity_rgw.py
      config:
        script-name: ../s3cmd/test_large_omap.py
        config-file-name: ../../s3cmd/configs/test_large_omap_clearance_brown_field_pre_upgrade.yaml
        run-on-haproxy: true

  - test:
      name: notify on multipart upload events with SASL_PLAINTEXT PLAIN pre upgrade
      desc: notify on multipart upload events with SASL_PLAINTEXT PLAIN pre upgrade
      polarion-id: CEPH-83575407
      module: sanity_rgw.py
      config:
        run-on-rgw: true
        extra-pkgs:
          - jdk
        git_clone_configs_repo: true
        install_start_kafka: true
        configure_kafka_security: true
        script-name: test_bucket_notifications.py
        config-file-name: test_bucket_notification_sasl_plaintext_plain_kafka_broker_persistent_multipart.yaml

  - test:
      name: notify put,copy,delete events with SASL_PLAINTEXT PLAIN pre upgrade
      desc: notify put,copy,delete events with SASL_PLAINTEXT PLAIN pre upgrade
      polarion-id: CEPH-83575407
      module: sanity_rgw.py
      config:
        run-on-rgw: true
        script-name: test_bucket_notifications.py
        config-file-name: test_bucket_notification_sasl_plaintext_plain_kafka_broker_persistent.yaml

  - test:
      name: GetObjectAttributes with checksum sha256 pre upgrade
      desc: Test GetObjectAttributes with checksum sha256 pre upgrade
      polarion-id: CEPH-83595849
      module: sanity_rgw.py
      config:
        script-name: test_Mbuckets_with_Nobjects.py
        config-file-name: test_Mbuckets_with_Nobjects_get_object_attributes_checksum_sha256.yaml
