# Crimson OSD (SeaStore) + RGW deployment suite (Tentacle)
#
# Backend: osd_type=crimson, objectstore=seastore (native Seastar backend)
# Doc: https://docs.ceph.com/en/umbrella/crimson/crimson/
# Note: SeaStore cephadm support is early-stage; prefer NVMe. Use lvm method (default).
#
# conf : conf/tentacle/rgw/tier-1_rgw_crimson.yaml
#   - 1 OSD volume per OSD host (disk-size 40G)
#   - (OSDs_per_host * crimson_seastar_num_threads) < nproc
#
# Runtime: --custom-config crimson=true
#
# Related: tier-1_rgw_crimson_bluestore.yaml (BlueStore / alien backend)

tests:

  - test:
      name: setup install pre-requisites
      desc: Setup phase to deploy the required pre-requisites for running the tests.
      module: install_prereq.py
      abort-on-fail: true

  - test:
      name: RHCS deploy cluster using cephadm
      desc: Bootstrap, add hosts, and deploy mgr/mon (OSDs applied after Crimson prep).
      module: test_cephadm.py
      abort-on-fail: true
      destroy-cluster: false
      polarion-id: CEPH-83573713
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              base_cmd_args:
                verbose: true
              args:
                registry-url: registry.redhat.io
                mon-ip: node1
                initial-dashboard-password: admin@123
                dashboard-password-noupdate: true
                orphan-initial-daemons: true
                skip-monitoring-stack: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon

  - test:
      name: Setup Crimson pre-requisites
      desc: Enable Crimson experimental features and default crimson pools before OSD deploy
      module: rados_prep.py
      abort-on-fail: true
      config:
        setup-crimson-pre-req: true

  - test:
      name: Deploy Crimson OSDs with SeaStore
      desc: apply_spec osd_type=crimson objectstore=seastore (1 disk/host, lvm method)
      module: test_cephadm.py
      polarion-id: CEPH-83573746
      abort-on-fail: true
      config:
        steps:
          - config:
              command: shell
              args:
                - ceph
                - orch
                - device
                - ls
                - --refresh
          - config:
              command: apply_spec
              service: orch
              validate-spec-services: true
              specs:
                - service_type: osd
                  service_id: crimson_seastore
                  placement:
                    label: osd
                  spec:
                    data_devices:
                      all: "true"
                    # osd_type: crimson
                    # objectstore: seastore --> not supported in tentacle
                    # supported in Umbrella 

  - test:
      name: RGW Service deployment
      desc: Deploy RGW service on nodes labeled rgw
      module: test_cephadm.py
      polarion-id: CEPH-83574728
      abort-on-fail: true
      config:
        steps:
          - config:
              command: apply
              service: rgw
              pos_args:
                - rgw.1
              args:
                placement:
                  label: rgw
                  nodes:
                    - node3
                    - node4
                    - node5

  - test:
      name: Configure client
      desc: Configure the RGW client system
      module: test_client.py
      polarion-id: CEPH-83573758
      destroy-cluster: false
      abort-on-fail: true
      config:
        command: add
        id: client.1
        node: node6
        install_packages:
          - ceph-common
        copy_admin_keyring: true
        git_clone: true
        git_node_role: rgw

  - test:
      name: Configure HAproxy
      desc: Configure HAproxy on the client node
      module: haproxy.py
      abort-on-fail: true
      config:
        haproxy_clients:
          - node6
        rgw_endpoints:
          - node3:80
          - node4:80
          - node5:80

  - test:
      name: Test M buckets with N objects
      desc: Basic RGW sanity on Crimson SeaStore OSDs
      module: sanity_rgw.py
      polarion-id: CEPH-9789
      config:
        script-name: test_Mbuckets_with_Nobjects.py
        config-file-name: test_Mbuckets_with_Nobjects.yaml

  - test:
      name: Test multipart upload of M buckets with N objects
      desc: Basic RGW multipart sanity on Crimson SeaStore OSDs
      module: sanity_rgw.py
      polarion-id: CEPH-9801
      config:
        script-name: test_Mbuckets_with_Nobjects.py
        config-file-name: test_Mbuckets_with_Nobjects_multipart.yaml
