# Tier-2: RGW HTTPS with certificate_source reference
#
# Deploy RGW over HTTPS using a certificate and key stored in the cephadm
# certificate manager and referenced by name. The material is registered
# before the RGW spec is applied, so the keys are not embedded in the spec.
#
# Supported from Tentacle.
# global-conf: conf/tentacle/rgw/tier-0_rgw.yaml

tests:
  - test:
      abort-on-fail: true
      desc: Install software pre-requisites for cluster deployment.
      module: install_prereq.py
      name: setup pre-requisites

  - test:
      abort-on-fail: true
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                registry-url: registry.redhat.io
                mon-ip: node1
                orphan-initial-daemons: true
                skip-monitoring-stack: true
                initial-dashboard-password: admin@123
                dashboard-password-noupdate: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
      desc: Deploy the cluster before registering the reference certificate.
      destroy-cluster: false
      module: test_cephadm.py
      name: deploy cluster

  - test:
      abort-on-fail: true
      config:
        cephadm: true
        commands:
          - "sleep 60"
          - "ceph orch ls"
      desc: Verify the cluster is up before creating the reference certificate.
      module: exec.py
      name: verify cluster status

  - test:
      abort-on-fail: true
      config:
        sudo: true
        role: installer
        commands:
          - "openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /tmp/rgw_key.pem -out /tmp/rgw_cert.pem -subj '/CN=rgw.example.com/O=Ceph Test/C=US'"
          - "openssl x509 -in /tmp/rgw_cert.pem -text -noout"
          - "openssl rsa -in /tmp/rgw_key.pem -check -noout"
          - "bash -c 'c=$(openssl x509 -noout -modulus -in /tmp/rgw_cert.pem | openssl md5); k=$(openssl rsa -noout -modulus -in /tmp/rgw_key.pem | openssl md5); echo \"$c\"; echo \"$k\"; test \"$c\" = \"$k\"'"
          - "cephadm shell -v /tmp/rgw_cert.pem:/etc/ceph/rgw_cert.pem -- bash -c 'ceph orch certmgr cert set --cert-name rgw_ssl_cert --service-name rgw.rgwreference -i /etc/ceph/rgw_cert.pem'"
          - "cephadm shell -v /tmp/rgw_key.pem:/etc/ceph/rgw_key.pem -- bash -c 'ceph orch certmgr key set --key-name rgw_ssl_key --service-name rgw.rgwreference -i /etc/ceph/rgw_key.pem'"
          - "cephadm shell -- bash -c 'ceph orch certmgr cert ls | grep -q rgw_ssl_cert && ceph orch certmgr cert ls | grep -q rgw.rgwreference'"
          - "cephadm shell -- bash -c 'ceph orch certmgr key ls | grep -q rgw_ssl_key && ceph orch certmgr key ls | grep -q rgw.rgwreference'"
      desc: Generate a certificate pair, confirm they match, and store them in certmgr.
      module: exec.py
      name: register reference certificate

  - test:
      abort-on-fail: true
      config:
        steps:
          - config:
              command: apply_spec
              service: orch
              validate-spec-services: true
              specs:
                - service_type: rgw
                  service_id: rgwreference
                  placement:
                    count: 2
                  spec:
                    ssl: true
                    certificate_source: reference
      desc: Deploy RGW HTTPS using the certificate referenced from certmgr.
      destroy-cluster: false
      module: test_cephadm.py
      name: deploy rgw with reference certificate

  - test:
      abort-on-fail: true
      config:
        sudo: true
        role: installer
        commands:
          - "cephadm shell -- bash -c 'ceph orch ls | grep rgw.rgwreference'"
      desc: Verify the reference RGW service is listed by the orchestrator.
      module: exec.py
      name: verify rgw reference deployment
