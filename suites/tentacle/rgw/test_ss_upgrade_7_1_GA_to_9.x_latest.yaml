        config-file-name: test_sse_s3_per_bucket_encryption_normal_object_upload.yaml

  - test:
      name: compression with zstd type pre upgrade
      desc: test compression with zstd type pre upgrade
      polarion-id: CEPH-11350
      module: sanity_rgw.py
      config:
        script-name: test_Mbuckets_with_Nobjects.py
        config-file-name: test_Mbuckets_with_Nobjects_compression_zstd.yaml
        run-on-haproxy: true

  - test:
      name: NFS cluster and export create pre upgrade
      desc: Test NFS cluster and export create pre upgrade
      polarion-id: CEPH-83574597
      module: sanity_rgw.py
      config:
        run-on-rgw: true
        script-name: ../nfs_ganesha/nfs_cluster.py
        config-file-name: ../../nfs_ganesha/config/nfs_cluster.yaml

  - test:
      name: STS rename large object pre upgrade
      desc: Test rename of large object using sts user through AWS pre upgrade
      polarion-id: CEPH-83575419
      module: sanity_rgw.py
      config:
        script-name: ../aws/test_sts_rename_large_object.py
        config-file-name: ../../aws/configs/test_sts_rename_large_object.yaml

  - test:
      name: swift basic operations pre upgrade
      desc: Test object operations with swift pre upgrade
      polarion-id: CEPH-11019
