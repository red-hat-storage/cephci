# P0 two-site multisite upgrade: Tentacle 9.1 GA to 9.x latest
# Topology: EC 2+2 on 4 OSD hosts, SSL, HAProxy, 6 RGW daemons per site
#   rgw_io  x3 on node2, node3, node4 port 443
#   rgw_sync x3 on node2, node3, node4 port 444
#   The dashboard keeps its own port, so sync uses 444.
# conf: conf/tentacle/rgw/2-site-ec-profile-2+2@4nodes.yaml
# node2 is used as an RGW host in addition to node3. node4 is client and RGW.

# Tier-2 two-site multisite, primary and secondary. Five feature tests before the upgrade and the same five after it.
# A config used here is not used in the other two-site suites. Swift is not required.

tests:

  - test:
      abort-on-fail: true
      desc: Install software pre-requisites for cluster deployment.
      module: install_prereq.py
      name: setup pre-requisites

  - test:
      abort-on-fail: true
      clusters:
        ceph-pri:
          config:
            verify_cluster_health: true
            steps:
              - config:
                  command: bootstrap
                  service: cephadm
                  args:
                    rhcs-version: 9.1
                    release: released
                    platform: rhel-9
                    registry-url: registry.redhat.io
                    mon-ip: node1
                    orphan-initial-daemons: true
                    initial-dashboard-password: admin@123
                    dashboard-password-noupdate: true
                    skip-monitoring-stack: true
                  base_cmd_args:
                    verbose: true
              - config:
                  command: add_hosts
                  service: host
                  args:
                    attach_ip_address: true
                    labels: apply-all-labels
              - config:
                  command: apply
                  service: mgr
                  args:
                    placement:
                      label: mgr
              - config:
                  command: apply
                  service: mon
                  args:
                    placement:
                      label: mon
              - config:
                  command: apply
                  service: osd
                  args:
                    all-available-devices: true
              - config:
                  args:
                    - "ceph osd erasure-code-profile set rgwec22_4 k=2 m=2"
                    - "crush-failure-domain=host crush-device-class=hdd"
                  command: shell
              - config:
                  args:
                    - "ceph osd pool create primary.rgw.buckets.data 32 32"
                    - "erasure rgwec22_4"
                  command: shell
              - config:
                  args:
                    - "ceph osd pool application enable"
                    - "primary.rgw.buckets.data rgw"
                  command: shell
              - config:
                  command: apply_spec
                  service: orch
                  specs:
                    - service_type: rgw
                      service_id: shared.pri.io
                      spec:
                        disable_multisite_sync_traffic: true
                        rgw_realm: india
                        rgw_zonegroup: shared
                        rgw_zone: primary
                        generate_cert: true
                        ssl: true
                        rgw_frontend_port: 443
                      placement:
                        nodes:
                          - node2
                          - node3
                          - node4
              - config:
                  command: apply_spec
                  service: orch
                  specs:
                    - service_type: rgw
                      service_id: shared.pri.sync
                      spec:
                        rgw_realm: india
                        rgw_zonegroup: shared
                        rgw_zone: primary
                        generate_cert: true
                        ssl: true
                        rgw_frontend_port: 444
                      placement:
                        nodes:
                          - node2
                          - node3
                          - node4
        ceph-sec:
          config:
            verify_cluster_health: true
            steps:
              - config:
                  command: bootstrap
                  service: cephadm
                  args:
                    rhcs-version: 9.1
                    release: released
                    platform: rhel-9
                    registry-url: registry.redhat.io
                    mon-ip: node1
                    orphan-initial-daemons: true
                    initial-dashboard-password: admin@123
                    dashboard-password-noupdate: true
                    skip-monitoring-stack: true
                  base_cmd_args:
                    verbose: true
              - config:
                  command: add_hosts
                  service: host
                  args:
                    attach_ip_address: true
                    labels: apply-all-labels
              - config:
                  command: apply
                  service: mgr
                  args:
                    placement:
                      label: mgr
              - config:
                  command: apply
                  service: mon
                  args:
                    placement:
                      label: mon
              - config:
                  command: apply
                  service: osd
                  args:
                    all-available-devices: true
              - config:
                  args:
                    - "ceph osd erasure-code-profile set rgwec22_4 k=2 m=2"
                    - "crush-failure-domain=host crush-device-class=hdd"
                  command: shell
              - config:
                  args:
                    - "ceph osd pool create secondary.rgw.buckets.data 32 32"
                    - "erasure rgwec22_4"
                  command: shell
              - config:
                  args:
                    - "ceph osd pool application enable"
                    - "secondary.rgw.buckets.data rgw"
                  command: shell
              - config:
                  command: apply_spec
                  service: orch
                  specs:
                    - service_type: rgw
                      service_id: shared.sec.io
                      spec:
                        disable_multisite_sync_traffic: true
                        rgw_realm: india
                        rgw_zonegroup: shared
                        rgw_zone: secondary
                        generate_cert: true
                        ssl: true
                        rgw_frontend_port: 443
                      placement:
                        nodes:
                          - node2
                          - node3
                          - node4
              - config:
                  command: apply_spec
                  service: orch
                  specs:
                    - service_type: rgw
                      service_id: shared.sec.sync
                      spec:
                        rgw_realm: india
                        rgw_zonegroup: shared
                        rgw_zone: secondary
                        generate_cert: true
                        ssl: true
                        rgw_frontend_port: 444
                      placement:
                        nodes:
                          - node2
                          - node3
                          - node4
      desc: Deploy RHCS 9.1 two-site multisite, EC 2+2, SSL, 6 RGW daemons per site.
      polarion-id: CEPH-83573386
      destroy-cluster: false
      module: test_cephadm.py
      name: deploy cluster

  - test:
      name: Monitoring Services deployment
      desc: Add monitoring services using spec file.
      module: test_cephadm.py
      polarion-id: CEPH-83574727
      clusters:
        ceph-pri:
          config:
            verify_cluster_health: true
            steps:
              - config:
                  command: apply_spec
                  service: orch
                  validate-spec-services: true
                  specs:
                    - service_type: prometheus
                      placement:
                        count: 1
                        nodes:
                          - node1
                    - service_type: grafana
                      placement:
                        nodes:
                          - node1
                    - service_type: alertmanager
                      placement:
                        count: 1
                    - service_type: node-exporter
                      placement:
                        host_pattern: "*"
                    - service_type: crash
                      placement:
                        host_pattern: "*"
        ceph-sec:
          config:
            verify_cluster_health: true
            steps:
              - config:
                  command: apply_spec
                  service: orch
                  validate-spec-services: true
                  specs:
                    - service_type: prometheus
                      placement:
                        count: 1
                        nodes:
                          - node1
                    - service_type: grafana
                      placement:
                        nodes:
                          - node1
                    - service_type: alertmanager
                      placement:
                        count: 1
                    - service_type: node-exporter
                      placement:
                        host_pattern: "*"
                    - service_type: crash
                      placement:
                        host_pattern: "*"

  - test:
      abort-on-fail: true
      clusters:
        ceph-pri:
          config:
            command: add
            id: client.1
            node: node4
            install_packages:
              - ceph-common
            copy_admin_keyring: true
        ceph-sec:
          config:
            command: add
            id: client.1
            node: node4
            install_packages:
              - ceph-common
            copy_admin_keyring: true
      desc: Configure the RGW client system
      polarion-id: CEPH-83573758
      destroy-cluster: false
      module: test_client.py
      name: configure client

  - test:
      abort-on-fail: true
      clusters:
        ceph-pri:
          config:
            roles:
              - rgw
              - client
        ceph-sec:
          config:
            roles:
              - rgw
              - client
      desc: Copy cephadm root CA cert to rgw and client nodes
      module: copy_cephadm_root_ca_cert.py
      name: copy cephadm root ca cert
      polarion-id: CEPH-10362

  - test:
      abort-on-fail: true
      clusters:
        ceph-pri:
          config:
            haproxy_clients:
              - node4
            rgw_endpoints:
              - node2:443
              - node3:443
              - node4:443
        ceph-sec:
          config:
            haproxy_clients:
              - node4
            rgw_endpoints:
              - node2:443
              - node3:443
              - node4:443
      desc: Configure HAproxy in front of the SSL rgw_io daemons
      module: haproxy.py
      name: Configure HAproxy

  - test:
      abort-on-fail: true
      clusters:
        ceph-pri:
          config:
            commands:
              - "radosgw-admin realm create --rgw-realm india --default"
              - "radosgw-admin zonegroup create --rgw-realm india --rgw-zonegroup shared --endpoints https://{node_ip:node2}:444,https://{node_ip:node3}:444,https://{node_ip:node4}:444 --master --default"
              - "radosgw-admin zone create --rgw-realm india --rgw-zonegroup shared --rgw-zone primary --endpoints https://{node_ip:node2}:444,https://{node_ip:node3}:444,https://{node_ip:node4}:444 --master --default"
              - "radosgw-admin period update --rgw-realm india --commit"
              - "radosgw-admin user create --uid=repuser --display_name='Replication user' --access-key 21e86bce636c3aa0 --secret cf764951f1fdde5d --rgw-realm india --system"
              - "radosgw-admin zone modify --rgw-realm india --rgw-zonegroup shared --rgw-zone primary --access-key 21e86bce636c3aa0 --secret cf764951f1fdde5d"
              - "radosgw-admin period update --rgw-realm india --commit"
              - "ceph config set client.rgw.shared.pri.io rgw_realm india"
              - "ceph config set client.rgw.shared.pri.io rgw_zonegroup shared"
              - "ceph config set client.rgw.shared.pri.io rgw_zone primary"
              - "ceph config set client.rgw.shared.pri.io rgw_verify_ssl False"
              - "ceph orch restart {service_name:shared.pri.io}"
              - "ceph config set client.rgw.shared.pri.sync rgw_realm india"
              - "ceph config set client.rgw.shared.pri.sync rgw_zonegroup shared"
              - "ceph config set client.rgw.shared.pri.sync rgw_zone primary"
              - "ceph config set client.rgw.shared.pri.sync rgw_verify_ssl False"
              - "ceph orch restart {service_name:shared.pri.sync}"
              - "sleep 120"
        ceph-sec:
          config:
            commands:
              - "ceph config set client.rgw.shared.sec.io rgw_verify_ssl False"
              - "ceph config set client.rgw.shared.sec.sync rgw_verify_ssl False"
              - "radosgw-admin --rgw_verify_ssl=false realm pull --rgw-realm india --url https://{node_ip:ceph-pri#node3}:444 --access-key 21e86bce636c3aa0 --secret cf764951f1fdde5d --default"
              - "radosgw-admin --rgw_verify_ssl=false period pull --url https://{node_ip:ceph-pri#node3}:444 --access-key 21e86bce636c3aa0 --secret cf764951f1fdde5d"
              - "radosgw-admin zone create --rgw-realm india --rgw-zonegroup shared --rgw-zone secondary --endpoints https://{node_ip:node2}:444,https://{node_ip:node3}:444,https://{node_ip:node4}:444 --access-key 21e86bce636c3aa0 --secret cf764951f1fdde5d"
              - "radosgw-admin --rgw_verify_ssl=false period update --rgw-realm india --commit"
              - "ceph config set client.rgw.shared.sec.io rgw_realm india"
              - "ceph config set client.rgw.shared.sec.io rgw_zonegroup shared"
              - "ceph config set client.rgw.shared.sec.io rgw_zone secondary"
              - "ceph config set client.rgw.shared.sec.io rgw_verify_ssl False"
              - "ceph orch restart {service_name:shared.sec.io}"
              - "ceph config set client.rgw.shared.sec.sync rgw_realm india"
              - "ceph config set client.rgw.shared.sec.sync rgw_zonegroup shared"
              - "ceph config set client.rgw.shared.sec.sync rgw_zone secondary"
              - "ceph config set client.rgw.shared.sec.sync rgw_verify_ssl False"
              - "ceph orch restart {service_name:shared.sec.sync}"
              - "sleep 120"
      desc: Setting up two-site RGW multisite replication
      module: exec.py
      name: setup multisite
      polarion-id: CEPH-10362

  - test:
      abort-on-fail: true
      clusters:
        ceph-pri:
          config:
            cephadm: true
            commands:
              - "ceph versions"
              - "radosgw-admin sync status"
              - "ceph -s"
              - "radosgw-admin realm list"
              - "radosgw-admin zonegroup list"
              - "radosgw-admin zone list"
      desc: Retrieve the configured environment details
      polarion-id: CEPH-83575227
      module: exec.py
      name: get shared realm info on primary

  - test:
      abort-on-fail: true
      clusters:
        ceph-sec:
          config:
            cephadm: true
            commands:
              - "ceph versions"
              - "radosgw-admin sync status"
              - "ceph -s"
              - "radosgw-admin realm list"
              - "radosgw-admin zonegroup list"
              - "radosgw-admin zone list"
      desc: Retrieve the configured environment details
      polarion-id: CEPH-83575227
      module: exec.py
      name: get shared realm info on secondary

  - test:
      clusters:
        ceph-pri:
          config:
            set-env: true
            script-name: user_create.py
            config-file-name: non_tenanted_user.yaml
            copy-user-info-to-site: ceph-sec
      desc: create non-tenanted user
      module: sanity_rgw_multisite.py
      name: create non-tenanted user
      polarion-id: CEPH-83575199
      abort-on-fail: true

  - test:
      name: ordered listing of pseudo directories pre upgrade
      desc: Ordered listing of buckets that contain pseudo directories
      polarion-id: CEPH-83573545
      module: sanity_rgw_multisite.py
      clusters:
        ceph-pri:
          config:
            script-name: test_bucket_listing.py
            config-file-name: test_bucket_listing_pseudo_ordered.yaml
            verify-io-on-site: ["ceph-sec"]

  - test:
      name: M buckets with N objects using AWS4 pre upgrade
      desc: Create M buckets and N objects with AWS4 signatures
      polarion-id: CEPH-9637
      module: sanity_rgw_multisite.py
      clusters:
        ceph-pri:
          config:
            script-name: test_Mbuckets_with_Nobjects.py
            config-file-name: test_Mbuckets_with_Nobjects_aws4.yaml
            verify-io-on-site: ["ceph-sec"]

  - test:
      name: copy an object to another version pre upgrade
      desc: Copy an object onto another version in a versioned bucket
      polarion-id: CEPH-9179
      module: sanity_rgw_multisite.py
      clusters:
        ceph-pri:
          config:
            script-name: test_versioning_with_objects.py
            config-file-name: test_versioning_objects_copy.yaml
            verify-io-on-site: ["ceph-sec"]

  - test:
      name: ordered listing of versioned buckets pre upgrade
      desc: Ordered listing of versioned buckets
      polarion-id: CEPH-83573545
      module: sanity_rgw_multisite.py
      clusters:
        ceph-pri:
          config:
            script-name: test_bucket_listing.py
            config-file-name: test_bucket_listing_flat_ordered_versionsing.yaml
            verify-io-on-site: ["ceph-sec"]

  - test:
      name: delete multiple buckets pre upgrade
      desc: Create buckets and delete them
      polarion-id: CEPH-14237
      module: sanity_rgw_multisite.py
      clusters:
        ceph-pri:
          config:
            script-name: test_Mbuckets_with_Nobjects.py
            config-file-name: test_delete_multiple_buckets.yaml
            verify-io-on-site: ["ceph-sec"]

  - test:
      abort-on-fail: true
      desc: Multisite upgrade of secondary, then primary
      module: test_cephadm_upgrade.py
      name: multisite ceph upgrade
      polarion-id: CEPH-83574647
      clusters:
        ceph-sec:
          config:
            command: start
            service: upgrade
            verify_cluster_health: true
        ceph-pri:
          config:
            command: start
            service: upgrade
            verify_cluster_health: true

  - test:
      abort-on-fail: true
      clusters:
        ceph-pri:
          config:
            roles:
              - rgw
              - client
        ceph-sec:
          config:
            roles:
              - rgw
              - client
      desc: Copy cephadm root CA cert to rgw and client nodes post upgrade
      module: copy_cephadm_root_ca_cert.py
      name: copy cephadm root ca cert post upgrade
      polarion-id: CEPH-10362

  - test:
      desc: Retrieve the versions of the cluster
      module: exec.py
      name: post upgrade gather version
      polarion-id: CEPH-83575200
      clusters:
        ceph-pri:
          config:
            cephadm: true
            commands:
              - "ceph mgr module enable orchestrator"
              - "sleep 200"
              - "ceph versions"
        ceph-sec:
          config:
            cephadm: true
            commands:
              - "ceph versions"

  - test:
      name: ordered listing of pseudo directories post upgrade
      desc: Ordered listing of buckets that contain pseudo directories
      polarion-id: CEPH-83573545
      module: sanity_rgw_multisite.py
      clusters:
        ceph-pri:
          config:
            script-name: test_bucket_listing.py
            config-file-name: test_bucket_listing_pseudo_ordered.yaml
            verify-io-on-site: ["ceph-sec"]

  - test:
      name: M buckets with N objects using AWS4 post upgrade
      desc: Create M buckets and N objects with AWS4 signatures
      polarion-id: CEPH-9637
      module: sanity_rgw_multisite.py
      clusters:
        ceph-pri:
          config:
            script-name: test_Mbuckets_with_Nobjects.py
            config-file-name: test_Mbuckets_with_Nobjects_aws4.yaml
            verify-io-on-site: ["ceph-sec"]

  - test:
      name: copy an object to another version post upgrade
      desc: Copy an object onto another version in a versioned bucket
      polarion-id: CEPH-9179
      module: sanity_rgw_multisite.py
      clusters:
        ceph-pri:
          config:
            script-name: test_versioning_with_objects.py
            config-file-name: test_versioning_objects_copy.yaml
            verify-io-on-site: ["ceph-sec"]

  - test:
      name: ordered listing of versioned buckets post upgrade
      desc: Ordered listing of versioned buckets
      polarion-id: CEPH-83573545
      module: sanity_rgw_multisite.py
      clusters:
        ceph-pri:
          config:
            script-name: test_bucket_listing.py
            config-file-name: test_bucket_listing_flat_ordered_versionsing.yaml
            verify-io-on-site: ["ceph-sec"]

  - test:
      name: delete multiple buckets post upgrade
      desc: Create buckets and delete them
      polarion-id: CEPH-14237
      module: sanity_rgw_multisite.py
      clusters:
        ceph-pri:
          config:
            script-name: test_Mbuckets_with_Nobjects.py
            config-file-name: test_delete_multiple_buckets.yaml
            verify-io-on-site: ["ceph-sec"]
