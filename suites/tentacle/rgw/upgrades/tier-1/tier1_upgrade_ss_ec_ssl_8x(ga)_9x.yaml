# P0 single-site upgrade: Squid 8.1 GA to 9.x latest
# Topology: EC 2+2 on 4 OSD hosts, SSL, HAProxy, 3 RGW daemons (node3, node4, node5)
# conf: conf/tentacle/rgw/tier-0_rgw.yaml

# Tier-1 single site. Steps: prereq, deploy, monitoring stack, client, upgrade, versions.
# Feature tests: 7 before the upgrade and the same 7 after it. No case is shared with the other single-site suites.

tests:
  - test:
      abort-on-fail: true
      desc: Install software pre-requisites for cluster deployment.
      module: install_prereq.py
      name: setup pre-requisites

  - test:
      abort-on-fail: true
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                rhcs-version: 8.1
                release: released
                platform: rhel-9
                registry-url: registry.redhat.io
                mon-ip: node1
                orphan-initial-daemons: true
                skip-monitoring-stack: true
              base_cmd_args:
                verbose: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              args:
                - "ceph osd erasure-code-profile set rgwec22_4 k=2 m=2"
                - "crush-failure-domain=host crush-device-class=hdd"
              command: shell
          - config:
              args:
                - "ceph osd pool create default.rgw.buckets.data 32 32"
                - "erasure rgwec22_4"
              command: shell
          - config:
              args:
                - "ceph osd pool create default.rgw.buckets.index 32 32"
              command: shell
          - config:
              args:
                - "ceph osd pool application enable"
                - "default.rgw.buckets.data rgw"
              command: shell
          - config:
              args:
                - "ceph osd pool application enable"
                - "default.rgw.buckets.index rgw"
              command: shell
          - config:
              command: apply_spec
              service: orch
              specs:
                - service_type: rgw
                  service_id: rgw.ssl
                  placement:
                    nodes:
                      - node3
                      - node4
                      - node5
                  spec:
                    ssl: true
                    generate_cert: true
                    rgw_frontend_port: 443
      desc: Deploy RHCS 8.1 single-site cluster, EC 2+2, SSL, 3 RGW daemons.
      polarion-id: CEPH-83573777
      destroy-cluster: false
      module: test_cephadm.py
      name: Deploy RHCS-ssl cluster using cephadm

  - test:
      name: Monitoring Services deployment
      desc: Add monitoring services using spec file.
      module: test_cephadm.py
      polarion-id: CEPH-83574727
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: apply_spec
              service: orch
              validate-spec-services: true
              specs:
                - service_type: prometheus
                  placement:
                    count: 1
                    nodes:
                      - node1
                - service_type: grafana
                  placement:
                    nodes:
                      - node1
                - service_type: alertmanager
                  placement:
                    count: 1
                - service_type: node-exporter
                  placement:
                    host_pattern: "*"
                - service_type: crash
                  placement:
                    host_pattern: "*"

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.1
        node: node6
        install_packages:
          - ceph-common
        copy_admin_keyring: true
      desc: Configure the RGW client system
      destroy-cluster: false
      module: test_client.py
      name: configure client
      polarion-id: CEPH-83573758

  - test:
      abort-on-fail: true
      config:
        roles:
          - rgw
          - client
      desc: Copy cephadm root CA cert to rgw and client nodes
      module: copy_cephadm_root_ca_cert.py
      name: copy cephadm root ca cert
      polarion-id: CEPH-10362

  - test:
      abort-on-fail: true
      config:
        haproxy_clients:
          - node6
        rgw_endpoints:
          - node3:443
          - node4:443
          - node5:443
      desc: Configure HAproxy in front of the three SSL RGW daemons
      module: haproxy.py
      name: Configure HAproxy

  # Pre upgrade feature tests

  - test:
      name: S3CMD rgw log details pre upgrade
      desc: S3CMD tests, rgw log details
      polarion-id: CEPH-83575470
      module: sanity_rgw.py
      config:
        script-name: ../s3cmd/test_rgw_ops_log.py
        config-file-name: ../../s3cmd/configs/test_rgw_log_details.yaml

  - test:
      name: Mbuckets with N objects download pre upgrade
      desc: download objects from M buckets with N objects
      polarion-id: CEPH-14237
      module: sanity_rgw.py
      config:
        script-name: test_Mbuckets_with_Nobjects.py
        config-file-name: test_Mbuckets_with_Nobjects_download.yaml

  - test:
      name: Delete objects from M buckets with N objects pre upgrade
      desc: delete objects from M buckets with N objects
      polarion-id: CEPH-14237
      module: sanity_rgw.py
      config:
        script-name: test_Mbuckets_with_Nobjects.py
        config-file-name: test_Mbuckets_with_Nobjects_delete.yaml

  - test:
      name: Swift basic operations pre upgrade
      desc: Test object operations with swift
      polarion-id: CEPH-11019
      module: sanity_rgw.py
      config:
        script-name: test_swift_basic_ops.py
        config-file-name: test_swift_basic_ops.yaml

  - test:
      abort-on-fail: true
      config:
        install:
          - agent
        run-on-rgw: true
      desc: Setup and configure vault agent
      destroy-cluster: false
      module: install_vault.py
      name: configure vault agent
      polarion-id: CEPH-83575226

  - test:
      name: sse-s3 per bucket encryption pre upgrade
      desc: sse-s3 per bucket encryption with vault
      polarion-id: CEPH-83574615
      module: sanity_rgw.py
      config:
        script-name: test_sse_s3_kms_with_vault.py
        config-file-name: test_sse_s3_per_bucket_encryption_normal_object_upload.yaml

  - test:
      name: compression with zstd pre upgrade
      desc: test compression with zstd type
      polarion-id: CEPH-11350
      module: sanity_rgw.py
      config:
        script-name: test_Mbuckets_with_Nobjects.py
        config-file-name: test_Mbuckets_with_Nobjects_compression_zstd.yaml

  - test:
      name: NFS cluster and export create pre upgrade
      desc: Test NFS cluster and export create
      polarion-id: CEPH-83574597
      module: sanity_rgw.py
      config:
        run-on-rgw: true
        script-name: ../nfs_ganesha/nfs_cluster.py
        config-file-name: ../../nfs_ganesha/config/nfs_cluster.yaml


  - test:
      abort-on-fail: true
      name: Upgrade cluster to latest ceph version
      desc: Upgrade cluster to latest version
      module: test_cephadm_upgrade.py
      polarion-id: CEPH-83573791
      verify_cluster_health: true
      config:
        command: start
        service: upgrade
        base_cmd_args:
          verbose: true

  - test:
      abort-on-fail: true
      config:
        roles:
          - rgw
          - client
      desc: Copy cephadm root CA cert to rgw and client nodes post upgrade
      module: copy_cephadm_root_ca_cert.py
      name: copy cephadm root ca cert post upgrade
      polarion-id: CEPH-10362

  - test:
      desc: Retrieve the versions of the cluster
      module: exec.py
      name: post upgrade gather version
      polarion-id: CEPH-83575200
      config:
        cephadm: true
        commands:
          - "ceph mgr module enable orchestrator"
          - "sleep 200"
          - "ceph versions"

  # Post upgrade feature tests

  - test:
      name: S3CMD rgw log details post upgrade
      desc: S3CMD tests, rgw log details
      polarion-id: CEPH-83575470
      module: sanity_rgw.py
      config:
        script-name: ../s3cmd/test_rgw_ops_log.py
        config-file-name: ../../s3cmd/configs/test_rgw_log_details.yaml

  - test:
      name: Mbuckets with N objects download post upgrade
      desc: download objects from M buckets with N objects
      polarion-id: CEPH-14237
      module: sanity_rgw.py
      config:
        script-name: test_Mbuckets_with_Nobjects.py
        config-file-name: test_Mbuckets_with_Nobjects_download.yaml

  - test:
      name: Delete objects from M buckets with N objects post upgrade
      desc: delete objects from M buckets with N objects
      polarion-id: CEPH-14237
      module: sanity_rgw.py
      config:
        script-name: test_Mbuckets_with_Nobjects.py
        config-file-name: test_Mbuckets_with_Nobjects_delete.yaml

  - test:
      name: Swift basic operations post upgrade
      desc: Test object operations with swift
      polarion-id: CEPH-11019
      module: sanity_rgw.py
      config:
        script-name: test_swift_basic_ops.py
        config-file-name: test_swift_basic_ops.yaml

  - test:
      abort-on-fail: true
      config:
        install:
          - agent
        run-on-rgw: true
      desc: Setup and configure vault agent
      destroy-cluster: false
      module: install_vault.py
      name: configure vault agent
      polarion-id: CEPH-83575226

  - test:
      name: sse-s3 per bucket encryption post upgrade
      desc: sse-s3 per bucket encryption with vault
      polarion-id: CEPH-83574615
      module: sanity_rgw.py
      config:
        script-name: test_sse_s3_kms_with_vault.py
        config-file-name: test_sse_s3_per_bucket_encryption_normal_object_upload.yaml

  - test:
      name: compression with zstd post upgrade
      desc: test compression with zstd type
      polarion-id: CEPH-11350
      module: sanity_rgw.py
      config:
        script-name: test_Mbuckets_with_Nobjects.py
        config-file-name: test_Mbuckets_with_Nobjects_compression_zstd.yaml

  - test:
      name: NFS cluster and export create post upgrade
      desc: Test NFS cluster and export create
      polarion-id: CEPH-83574597
      module: sanity_rgw.py
      config:
        run-on-rgw: true
        script-name: ../nfs_ganesha/nfs_cluster.py
        config-file-name: ../../nfs_ganesha/config/nfs_cluster.yaml

