# Tier - 2: Execute S3Tests over RGW HTTPS using a reference certificate.
#
# The certificate and key are stored in the cephadm certificate manager and
# the RGW spec sets certificate_source: reference. Beast does not read
# certmgr directly: it loads ssl_certificate from the monitor config-key
# named by rgw_frontends. That key is written before apply and rewritten
# afterwards, because apply can replace it. The certificate names the RGW
# node and its IP so clients can reach https://<node>:443.
#
# Requires the following keys in cephci.yaml
#
#   vault:
#        url: http://<vault-server>/
#        agent:
#          auth: agent
#          engine: transit
#          role-id: <role-id>
#          secret-id: <secret-id>
#          prefix: /v1/<path>
#
# global-conf: conf/tentacle/rgw/ec-profile-4+2-cluster.yaml
---
tests:
  - test:
      abort-on-fail: true
      desc: Install software pre-requisites for cluster deployment.
      module: install_prereq.py
      name: setup pre-requisites

  - test:
      abort-on-fail: true
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
                orphan-initial-daemons: true
                skip-monitoring-stack: true
                initial-dashboard-password: admin@123
                dashboard-password-noupdate: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              args:
                - "ceph osd erasure-code-profile set rgwecprofile01 k=4 m=2"
                - "crush-failure-domain=host crush-device-class=hdd"
              command: shell
          - config:
              args:
                - "ceph osd pool create default.rgw.buckets.data 32 32"
                - "erasure rgwecprofile01"
              command: shell
          - config:
              args:
                - "ceph osd pool create default.rgw.buckets.index 32 32"
              command: shell
          - config:
              args:
                - "ceph osd pool application enable"
                - "default.rgw.buckets.data rgw"
              command: shell
          - config:
              args:
                - "ceph osd pool application enable"
                - "default.rgw.buckets.index rgw"
              command: shell
      desc: RHCS cluster deployment using cephadm.
      polarion-id: CEPH-83573777
      destroy-cluster: false
      module: test_cephadm.py
      name: deploy cluster

  - test:
      abort-on-fail: true
      config:
        sudo: true
        role: installer
        commands:
          - "openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /tmp/rgw_key.pem -out /tmp/rgw_cert.pem -subj '/CN={node:node7}/O=Ceph Test/C=US' -addext 'subjectAltName=DNS:{node:node7},IP:{node_ip:node7}' -addext 'basicConstraints=CA:FALSE' -addext 'keyUsage=digitalSignature,keyEncipherment' -addext 'extendedKeyUsage=serverAuth'"
          - "openssl x509 -in /tmp/rgw_cert.pem -text -noout"
          - "openssl rsa -in /tmp/rgw_key.pem -check -noout"
          - "bash -c 'c=$(openssl x509 -noout -modulus -in /tmp/rgw_cert.pem | openssl md5); k=$(openssl rsa -noout -modulus -in /tmp/rgw_key.pem | openssl md5); echo \"$c\"; echo \"$k\"; test \"$c\" = \"$k\"'"
          - "openssl x509 -in /tmp/rgw_cert.pem -noout -ext subjectAltName | grep -q '{node:node7}'"
          - "openssl x509 -in /tmp/rgw_cert.pem -noout -ext subjectAltName | grep -q '{node_ip:node7}'"
          - "cephadm shell -v /tmp/rgw_cert.pem:/etc/ceph/rgw_cert.pem -- bash -c 'ceph orch certmgr cert set --cert-name rgw_ssl_cert --service-name rgw.rgw.ssl -i /etc/ceph/rgw_cert.pem'"
          - "cephadm shell -v /tmp/rgw_key.pem:/etc/ceph/rgw_key.pem -- bash -c 'ceph orch certmgr key set --key-name rgw_ssl_key --service-name rgw.rgw.ssl -i /etc/ceph/rgw_key.pem'"
          - "cephadm shell -- bash -c 'ceph orch certmgr cert ls | grep -q rgw_ssl_cert && ceph orch certmgr cert ls | grep -q rgw.rgw.ssl'"
          - "cephadm shell -- bash -c 'ceph orch certmgr key ls | grep -q rgw_ssl_key && ceph orch certmgr key ls | grep -q rgw.rgw.ssl'"
          - "cat /tmp/rgw_key.pem /tmp/rgw_cert.pem > /tmp/rgw_combined.pem"
          - "cephadm shell -v /tmp/rgw_combined.pem:/etc/ceph/rgw_combined.pem -- bash -c 'ceph config-key set rgw/cert/rgw.rgw.ssl -i /etc/ceph/rgw_combined.pem'"
          - "cephadm shell -- bash -c 'ceph config-key get rgw/cert/rgw.rgw.ssl | grep -q \"BEGIN PRIVATE KEY\" && ceph config-key get rgw/cert/rgw.rgw.ssl | grep -q \"BEGIN CERTIFICATE\"'"
      desc: Generate a certificate pair and store it in certmgr for the RGW service.
      module: exec.py
      name: register reference certificate
      polarion-id: CEPH-83573777

  - test:
      abort-on-fail: true
      config:
        steps:
          - config:
              command: apply_spec
              service: orch
              validate-spec-services: true
              specs:
                - service_type: rgw
                  service_id: rgw.ssl
                  placement:
                    nodes:
                      - node7
                  spec:
                    ssl: true
                    certificate_source: reference
      desc: Deploy RGW HTTPS using the certificate referenced from certmgr.
      destroy-cluster: false
      module: test_cephadm.py
      name: deploy rgw with reference certificate
      polarion-id: CEPH-83573777

  - test:
      abort-on-fail: true
      config:
        sudo: true
        role: installer
        commands:
          - |
            cat > /tmp/fix-rgw-cert.sh << 'EOS'
            set -eux
            python3 - << 'PY'
            import json, re, subprocess

            def ceph(*args):
                return subprocess.check_output(["ceph", *args], text=True)

            pem = "/etc/ceph/rgw_combined.pem"
            frontend = "beast ssl_port=443 ssl_certificate=config://rgw/cert/rgw.rgw.ssl"
            keys = {"rgw/cert/rgw.rgw.ssl"}
            sections = {"client.rgw"}
            dump = json.loads(ceph("config", "dump", "--format", "json"))
            for item in dump:
                if item.get("name") != "rgw_frontends":
                    continue
                print("FRONT", item.get("section"), item.get("value"), flush=True)
                if item.get("section"):
                    sections.add(item["section"])
                keys.update(re.findall(r"config://(\S+)", item.get("value") or ""))
            daemons = json.loads(ceph("orch", "ps", "--service_name", "rgw.rgw.ssl", "--format", "json"))
            print("PS", json.dumps(daemons), flush=True)
            for daemon in daemons:
                name = daemon.get("daemon_name")
                if not name:
                    continue
                sections.add("client." + name)
                keys.add("rgw/cert/" + name)
            for key in sorted(keys):
                print("SET", key, flush=True)
                subprocess.check_call(["ceph", "config-key", "set", key, "-i", pem])
            for section in sorted(sections):
                print("CONFIG", section, flush=True)
                subprocess.check_call(["ceph", "config", "set", section, "rgw_frontends", frontend])
            PY
            ceph orch restart rgw.rgw.ssl || true
            EOS
            cephadm shell -v /tmp/rgw_combined.pem:/etc/ceph/rgw_combined.pem -v /tmp/fix-rgw-cert.sh:/etc/ceph/fix-rgw-cert.sh -- bash /etc/ceph/fix-rgw-cert.sh
      desc: Rewrite the Beast certificate after RGW apply and restart the service.
      module: exec.py
      name: reload reference certificate
      polarion-id: CEPH-83573777

  - test:
      abort-on-fail: true
      config:
        sudo: true
        role: rgw
        commands:
          - "firewall-cmd --add-port=443/tcp --permanent"
          - "firewall-cmd --reload"
          # Split so exec.py does not treat this as a systemctl command.
          # That helper only lists active units, and this daemon is down.
          - |
            unit=$(sys''temctl list-units --all --no-legend | awk '/rgw\.rgw\.ssl/ { for (i = 1; i <= NF; i++) if ($i ~ /\.service$/) { print $i; exit } }')
            echo "rgw unit: ${unit:-missing}" >&2
            if [ -n "$unit" ]; then
              sys''temctl reset-failed "$unit" || true
              sys''temctl restart "$unit"
            fi
            for i in $(seq 1 24); do
              curl -k -sS --connect-timeout 5 -o /dev/null https://127.0.0.1:443 && curl -k -sS --connect-timeout 5 -o /dev/null https://{node_ip:node7}:443 && exit 0
              sleep 10
            done
            echo "=== listeners ===" >&2
            ss -lntp >&2 || true
            echo "=== rgw containers ===" >&2
            podman ps -a --filter name=rgw >&2 || true
            cid=$(podman ps -aq --filter name=rgw | head -1 || true)
            if [ -n "$cid" ]; then
              echo "=== podman logs $cid ===" >&2
              podman logs --tail 150 "$cid" >&2 || true
            fi
            echo "=== journal ===" >&2
            journalctl --no-pager -n 150 -t ceph-rgw >&2 || true
            journalctl --no-pager -n 150 | grep -E 'rgw|ssl_certificate|beast' >&2 || true
            exit 1
      desc: Open port 443 and confirm the RGW HTTPS endpoint accepts connections.
      module: exec.py
      name: verify rgw https endpoint
      polarion-id: CEPH-83573777

  - test:
      name: Monitoring Services deployment
      desc: Add monitoring services using spec file.
      module: test_cephadm.py
      polarion-id: CEPH-83574727
      config:
        steps:
          - config:
              command: apply_spec
              service: orch
              validate-spec-services: true
              specs:
                - service_type: prometheus
                  placement:
                    count: 1
                    nodes:
                      - node1
                - service_type: grafana
                  placement:
                    nodes:
                      - node1
                - service_type: alertmanager
                  placement:
                    count: 1
                - service_type: node-exporter
                  placement:
                    host_pattern: "*"
                - service_type: crash
                  placement:
                    host_pattern: "*"

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.1
        node: node8
        install_packages:
          - ceph-common
        copy_admin_keyring: true
      desc: Configure the RGW client system
      destroy-cluster: false
      module: test_client.py
      name: configure client
      polarion-id: CEPH-83573758


  - test:
      abort-on-fail: true
      config:
        roles:
          - rgw
          - client
      desc: Copy cephadm root CA cert to rgw and client nodes
      module: copy_cephadm_root_ca_cert.py
      name: copy cephadm root ca cert
      polarion-id: CEPH-10362

  - test:
      abort-on-fail: true
      config:
        sudo: true
        role: client
        commands:
          - "bash -c 'ceph config-key get rgw/cert/rgw.rgw.ssl | sed -n \"/BEGIN CERTIFICATE/,/END CERTIFICATE/p\" > /etc/pki/ca-trust/source/anchors/rgw-reference.crt'"
          - "test -s /etc/pki/ca-trust/source/anchors/rgw-reference.crt"
          - "update-ca-trust extract"
          - "bash -c 'for i in $(seq 1 6); do curl -sS --connect-timeout 10 -o /dev/null https://{node_ip:node7}:443 && exit 0; sleep 5; done; exit 1'"
      desc: Trust the reference certificate and confirm the client can reach RGW.
      module: exec.py
      name: trust reference certificate
      polarion-id: CEPH-83573777

  - test:
      abort-on-fail: true
      config:
        install:
          - agent
      desc: Setup and configure vault agent
      destroy-cluster: false
      module: install_vault.py
      name: configure vault agent
      polarion-id: CEPH-83575226

  - test:
      abort-on-fail: false
      config:
        suite:
          - JavaS3
        kms_keyid: testKey01
        ssl: true
      desc: Java S3tests
      destroy-cluster: false
      module: java_s3tests.py
      name: execute Java s3tests
      polarion-id: CEPH-83586289

  - test:
      abort-on-fail: false
      config:
        suite:
          - maven
        ssl: true
      desc: Java Maven Test suite
      destroy-cluster: false
      module: java_s3tests.py
      name: execute Java Maven test suite
      polarion-id: CEPH-83586289

  - test:
      name: object level retention test Governance mode
      desc: object level retention test Governance mode
      polarion-id: CEPH-83574058
      module: sanity_rgw.py
      config:
        script-name: test_object_level_retention.py
        config-file-name: test_object_level_governance.yaml

  - test:
      name: Test swift bulk upload with tar format
      desc: Test swift bulk upload with tar format
      polarion-id: CEPH-83607707
      module: sanity_rgw.py
      config:
        script-name: test_swift_bulk_upload.py
        config-file-name: test_swift_bulk_upload.yaml

  - test:
      name: Test RGW CORS multi-rule OPTIONS preflight
      desc: Test RGW CORS multi-rule OPTIONS preflight
      polarion-id: CEPH-83632921
      comments: known issue JIRA IBMCEPH-17318 targeted to 9.2
      module: sanity_rgw.py
      config:
        script-name:  ../aws/test_cors_options_preflight.py
        config-file-name: ../../aws/configs/test_aws_cors_options_multi_rule_preflight.yaml

  - test:
      name: test bucket logging info still lists deleted bucket
      desc: Test bucket logging info still lists deleted bucket
      polarion-id: CEPH-83632948
      module: sanity_rgw_multisite.py
      known-issue: IBMCEPH-17766, IBMCEPH-17767
      config:
        script-name: ../aws/test_aws_bucket_logging.py
        config-file-name: ../../aws/configs/test_aws_bucket_logging.yaml

  - test:
      name: test deletion of default realm clears realm id in default info
      desc: test deletion of default realm clears realm id in default info
      polarion-id: CEPH-83623614
      module: sanity_rgw.py
      config:
        script-name: test_check_sharding_enabled.py
        config-file-name: test_realm_deletion.yaml
