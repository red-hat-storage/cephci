# P0 MS + archive SSL upgrade from RHCS 7.1z(GA) to 9.x latest.
# Cluster: EC 2+2 @4 nodes + SSL + haproxy + min 6 [rgw_io, rgw_sync] daemons
# global-conf: conf/tentacle/rgw/3-way-archive-ec-profile-2+2@4nodes.yaml
tests:

  - test:
      abort-on-fail: true
      desc: Install software pre-requisites for cluster deployment.
      module: install_prereq.py
      name: install vm pre-requsites

  - test:
      abort-on-fail: true
      clusters:
        ceph-pri:
          config:
            verify_cluster_health: true
            steps:
              - config:
                  command: bootstrap
                  service: cephadm
                  args:
                    rhcs-version: 7.1
                    release: released
                    registry-url: registry.redhat.io
                    mon-ip: node1
                    orphan-initial-daemons: true
                    initial-dashboard-password: admin@123
                    dashboard-password-noupdate: true
                    skip-monitoring-stack: true
                  base_cmd_args:
                    verbose: true
              - config:
                  command: add_hosts
                  service: host
                  args:
                    attach_ip_address: true
                    labels: apply-all-labels
              - config:
                  command: apply
                  service: mgr
                  args:
                    placement:
                      label: mgr
              - config:
                  command: apply
                  service: mon
                  args:
                    placement:
                      label: mon
              - config:
                  command: apply
                  service: osd
                  args:
                    all-available-devices: true
              - config:
                  args:
                    - "ceph osd erasure-code-profile set rgwec22_4 k=2 m=2"
                    - "crush-failure-domain=host crush-device-class=hdd"
                  command: shell
              - config:
                  args:
                    - "ceph osd pool create primary.rgw.buckets.data 32 32"
                    - "erasure rgwec22_4"
                  command: shell
              - config:
                  args:
                    - "ceph osd pool application enable"
                    - "primary.rgw.buckets.data rgw"
                  command: shell
              - config:
                  command: apply_spec
                  service: orch
                  specs:
                    - service_type: rgw
                      service_id: shared.pri.io
                      placement:
                        nodes:
                          - node2
                          - node3
                          - node4
                      spec:
                        ssl: true
                        rgw_frontend_ssl_certificate: create-cert
                        rgw_frontend_extra_args:
                          - "port=80"
                    - service_type: rgw
                      service_id: shared.pri.sync
                      placement:
                        nodes:
                          - node2
                          - node3
                          - node4
                      spec:
                        ssl: true
                        rgw_frontend_port: 8443
                        rgw_frontend_ssl_certificate: create-cert
        ceph-sec:
          config:
            verify_cluster_health: true
            steps:
              - config:
                  command: bootstrap
                  service: cephadm
                  args:
                    rhcs-version: 7.1
                    release: released
                    registry-url: registry.redhat.io
                    mon-ip: node1
                    orphan-initial-daemons: true
                    initial-dashboard-password: admin@123
                    dashboard-password-noupdate: true
                    skip-monitoring-stack: true
                  base_cmd_args:
                    verbose: true
              - config:
                  command: add_hosts
                  service: host
                  args:
                    attach_ip_address: true
                    labels: apply-all-labels
              - config:
                  command: apply
                  service: mgr
                  args:
                    placement:
                      label: mgr
              - config:
                  command: apply
                  service: mon
                  args:
                    placement:
                      label: mon
              - config:
                  command: apply
                  service: osd
                  args:
                    all-available-devices: true
              - config:
                  args:
                    - "ceph osd erasure-code-profile set rgwec22_4 k=2 m=2"
                    - "crush-failure-domain=host crush-device-class=hdd"
                  command: shell
              - config:
                  args:
                    - "ceph osd pool create secondary.rgw.buckets.data 32 32"
                    - "erasure rgwec22_4"
                  command: shell
              - config:
                  args:
                    - "ceph osd pool application enable"
                    - "secondary.rgw.buckets.data rgw"
                  command: shell
              - config:
                  command: apply_spec
                  service: orch
                  specs:
                    - service_type: rgw
                      service_id: shared.sec.io
                      placement:
                        nodes:
                          - node2
                          - node3
                          - node4
                      spec:
                        ssl: true
                        rgw_frontend_ssl_certificate: create-cert
                        rgw_frontend_extra_args:
                          - "port=80"
                    - service_type: rgw
                      service_id: shared.sec.sync
                      placement:
                        nodes:
                          - node2
                          - node3
                          - node4
                      spec:
                        ssl: true
                        rgw_frontend_port: 8443
                        rgw_frontend_ssl_certificate: create-cert
        ceph-arc:
          config:
            verify_cluster_health: true
            steps:
              - config:
                  command: bootstrap
                  service: cephadm
                  args:
                    rhcs-version: 7.1
                    release: released
                    registry-url: registry.redhat.io
                    mon-ip: node1
                    orphan-initial-daemons: true
                    initial-dashboard-password: admin@123
                    dashboard-password-noupdate: true
                    skip-monitoring-stack: true
                  base_cmd_args:
                    verbose: true
              - config:
                  command: add_hosts
                  service: host
                  args:
                    attach_ip_address: true
                    labels: apply-all-labels
              - config:
                  command: apply
                  service: mgr
                  args:
                    placement:
                      label: mgr
              - config:
                  command: apply
                  service: mon
                  args:
                    placement:
                      label: mon
              - config:
                  command: apply
                  service: osd
                  args:
                    all-available-devices: true
              - config:
                  args:
                    - "ceph osd erasure-code-profile set rgwec22_4 k=2 m=2"
                    - "crush-failure-domain=host crush-device-class=hdd"
                  command: shell
              - config:
                  args:
                    - "ceph osd pool create archive.rgw.buckets.data 32 32"
                    - "erasure rgwec22_4"
                  command: shell
              - config:
                  args:
                    - "ceph osd pool application enable"
                    - "archive.rgw.buckets.data rgw"
                  command: shell
              - config:
                  command: apply_spec
                  service: orch
                  specs:
                    - service_type: rgw
                      service_id: shared.arc.io
                      placement:
                        nodes:
                          - node2
                          - node3
                          - node4
                      spec:
                        ssl: true
                        rgw_frontend_ssl_certificate: create-cert
                        rgw_frontend_extra_args:
                          - "port=80"
                    - service_type: rgw
                      service_id: shared.arc.sync
                      placement:
                        nodes:
                          - node2
                          - node3
                          - node4
                      spec:
                        ssl: true
                        rgw_frontend_port: 8443
                        rgw_frontend_ssl_certificate: create-cert
      desc: RHCS cluster deployment using cephadm.
      polarion-id: CEPH-83575222
      destroy-cluster: false
      module: test_cephadm.py
      name: deploy cluster

  - test:
      clusters:
        ceph-pri:
          config:
            verify_cluster_health: true
            steps:
              - config:
                  command: apply_spec
                  service: orch
                  validate-spec-services: true
                  specs:
                    - service_type: prometheus
                      placement:
                        count: 1
                        nodes:
                          - node1
                    - service_type: grafana
                      placement:
                        nodes:
                          - node1
                    - service_type: alertmanager
                      placement:
                        count: 1
                    - service_type: node-exporter
                      placement:
                        host_pattern: "*"
                    - service_type: crash
                      placement:
                        host_pattern: "*"
        ceph-sec:
          config:
            verify_cluster_health: true
            steps:
              - config:
                  command: apply_spec
                  service: orch
                  validate-spec-services: true
                  specs:
                    - service_type: prometheus
                      placement:
                        count: 1
                        nodes:
                          - node1
                    - service_type: grafana
                      placement:
                        nodes:
                          - node1
                    - service_type: alertmanager
                      placement:
                        count: 1
                    - service_type: node-exporter
                      placement:
                        host_pattern: "*"
                    - service_type: crash
                      placement:
                        host_pattern: "*"
        ceph-arc:
          config:
            verify_cluster_health: true
            steps:
              - config:
                  command: apply_spec
                  service: orch
                  validate-spec-services: true
                  specs:
                    - service_type: prometheus
                      placement:
                        count: 1
                        nodes:
                          - node1
                    - service_type: grafana
                      placement:
                        nodes:
                          - node1
                    - service_type: alertmanager
                      placement:
                        count: 1
                    - service_type: node-exporter
                      placement:
                        host_pattern: "*"
                    - service_type: crash
                      placement:
                        host_pattern: "*"
      name: Monitoring Services deployment
      desc: Add monitoring services using spec file.
      module: test_cephadm.py
      polarion-id: CEPH-83574727

  - test:
      abort-on-fail: true
      clusters:
        ceph-pri:
          config:
            command: add
            id: client.1
            node: node4
            install_packages:
              - ceph-common
            copy_admin_keyring: true
        ceph-sec:
          config:
            command: add
            id: client.1
            node: node4
            install_packages:
              - ceph-common
            copy_admin_keyring: true
        ceph-arc:
          config:
            command: add
            id: client.1
            node: node4
            install_packages:
              - ceph-common
            copy_admin_keyring: true
      desc: Configure the RGW client system
      destroy-cluster: false
      module: test_client.py
      name: configure client
      polarion-id: CEPH-83573758

  - test:
      abort-on-fail: true
      clusters:
        ceph-pri:
          config:
            haproxy_clients:
              - node4
            rgw_endpoints:
              - node2:80
              - node3:80
              - node4:80
        ceph-sec:
          config:
            haproxy_clients:
              - node4
            rgw_endpoints:
              - node2:80
              - node3:80
              - node4:80
        ceph-arc:
          config:
            haproxy_clients:
              - node4
            rgw_endpoints:
              - node2:80
              - node3:80
              - node4:80
      desc: Configure HAproxy in front of SSL RGW IO daemons
      module: haproxy.py
      name: Configure HAproxy

  - test:
      abort-on-fail: true
      clusters:
        ceph-pri:
          config:
            cephadm: true
            commands:
              - "radosgw-admin realm create --rgw-realm india --default"
              - "radosgw-admin zonegroup create --rgw-realm india --rgw-zonegroup shared --endpoints https://{node_ip:node2}:8443,https://{node_ip:node3}:8443,https://{node_ip:node4}:8443 --master --default"
              - "radosgw-admin zone create --rgw-realm india --rgw-zonegroup shared --rgw-zone primary --endpoints https://{node_ip:node2}:8443,https://{node_ip:node3}:8443,https://{node_ip:node4}:8443 --master --default"
              - "radosgw-admin period update --rgw-realm india --commit"
              - "radosgw-admin user create --uid=repuser --display_name='Replication user' --access-key 21e86bce636c3aa0 --secret cf764951f1fdde5d --rgw-realm india --system"
              - "radosgw-admin zone modify --rgw-realm india --rgw-zonegroup shared --rgw-zone primary --access-key 21e86bce636c3aa0 --secret cf764951f1fdde5d"
              - "radosgw-admin period update --rgw-realm india --commit"
              - "ceph config set client.rgw.shared.pri.io rgw_realm india"
              - "ceph config set client.rgw.shared.pri.io rgw_zonegroup shared"
              - "ceph config set client.rgw.shared.pri.io rgw_zone primary"
              - "ceph config set client.rgw.shared.pri.sync rgw_realm india"
              - "ceph config set client.rgw.shared.pri.sync rgw_zonegroup shared"
              - "ceph config set client.rgw.shared.pri.sync rgw_zone primary"
              - "ceph config set client.rgw.shared.pri.io rgw_run_sync_thread false"
              - "ceph config set client.rgw.shared.pri.io rgw_verify_ssl False"
              - "ceph config set client.rgw.shared.pri.sync rgw_verify_ssl False"
              - "ceph orch restart {service_name:shared.pri.io}"
              - "ceph orch restart {service_name:shared.pri.sync}"
              - "sleep 120"
        ceph-sec:
          config:
            cephadm: true
            commands:
              - "sleep 120"
              - "radosgw-admin realm pull --rgw-realm india --url https://{node_ip:ceph-pri#node2}:8443 --access-key 21e86bce636c3aa0 --secret cf764951f1fdde5d --default"
              - "radosgw-admin period pull --url https://{node_ip:ceph-pri#node2}:8443 --access-key 21e86bce636c3aa0 --secret cf764951f1fdde5d"
              - "radosgw-admin zone create --rgw-realm india --rgw-zonegroup shared --rgw-zone secondary --endpoints https://{node_ip:node2}:8443,https://{node_ip:node3}:8443,https://{node_ip:node4}:8443 --access-key 21e86bce636c3aa0 --secret cf764951f1fdde5d"
              - "radosgw-admin period update --rgw-realm india --commit"
              - "ceph config set client.rgw.shared.sec.io rgw_realm india"
              - "ceph config set client.rgw.shared.sec.io rgw_zonegroup shared"
              - "ceph config set client.rgw.shared.sec.io rgw_zone secondary"
              - "ceph config set client.rgw.shared.sec.sync rgw_realm india"
              - "ceph config set client.rgw.shared.sec.sync rgw_zonegroup shared"
              - "ceph config set client.rgw.shared.sec.sync rgw_zone secondary"
              - "ceph config set client.rgw.shared.sec.io rgw_run_sync_thread false"
              - "ceph config set client.rgw.shared.sec.io rgw_verify_ssl False"
              - "ceph config set client.rgw.shared.sec.sync rgw_verify_ssl False"
              - "ceph orch restart {service_name:shared.sec.io}"
              - "ceph orch restart {service_name:shared.sec.sync}"
              - "sleep 120"
        ceph-arc:
          config:
            cephadm: true
            commands:
              - "radosgw-admin realm pull --rgw-realm india --url https://{node_ip:ceph-pri#node2}:8443 --access-key 21e86bce636c3aa0 --secret cf764951f1fdde5d --default"
              - "radosgw-admin period pull --url https://{node_ip:ceph-pri#node2}:8443 --access-key 21e86bce636c3aa0 --secret cf764951f1fdde5d"
              - "radosgw-admin zone create --rgw-realm india --rgw-zonegroup shared --rgw-zone archive --endpoints https://{node_ip:node2}:8443,https://{node_ip:node3}:8443,https://{node_ip:node4}:8443 --access-key 21e86bce636c3aa0 --secret cf764951f1fdde5d --tier-type=archive"
              - "radosgw-admin zone modify --rgw-realm india --rgw-zonegroup shared --rgw-zone archive --sync-from-all false --sync-from-rm secondary --sync-from primary"
              - "radosgw-admin period update --rgw-realm india --commit"
              - "ceph config set client.rgw.shared.arc.io rgw_realm india"
              - "ceph config set client.rgw.shared.arc.io rgw_zonegroup shared"
              - "ceph config set client.rgw.shared.arc.io rgw_zone archive"
              - "ceph config set client.rgw.shared.arc.sync rgw_realm india"
              - "ceph config set client.rgw.shared.arc.sync rgw_zonegroup shared"
              - "ceph config set client.rgw.shared.arc.sync rgw_zone archive"
              - "ceph config set client.rgw.shared.arc.io rgw_run_sync_thread false"
              - "ceph config set client.rgw.shared.arc.io rgw_verify_ssl False"
              - "ceph config set client.rgw.shared.arc.sync rgw_verify_ssl False"
              - "ceph orch restart {service_name:shared.arc.io}"
              - "ceph orch restart {service_name:shared.arc.sync}"
              - "sleep 120"
      desc: Setting up RGW multisite replication environment with archive zone
      module: exec.py
      name: setup multisite
      polarion-id: CEPH-10362

  - test:
      abort-on-fail: true
      clusters:
        ceph-pri:
          config:
            cephadm: true
            commands:
              - "ceph versions"
              - "radosgw-admin sync status"
              - "ceph -s"
              - "radosgw-admin realm list"
              - "radosgw-admin zonegroup list"
              - "radosgw-admin zone list"
      desc: Retrieve the configured environment details
      polarion-id: CEPH-83575227
      module: exec.py
      name: get shared realm info on primary

  - test:
      abort-on-fail: true
      clusters:
        ceph-sec:
          config:
            cephadm: true
            commands:
              - "ceph versions"
              - "radosgw-admin sync status"
              - "ceph -s"
              - "radosgw-admin realm list"
              - "radosgw-admin zonegroup list"
              - "radosgw-admin zone list"
      desc: Retrieve the configured environment details
      polarion-id: CEPH-83575227
      module: exec.py
      name: get shared realm info on secondary

  - test:
      abort-on-fail: true
      clusters:
        ceph-arc:
          config:
            cephadm: true
            commands:
              - "ceph versions"
              - "radosgw-admin sync status"
              - "ceph -s"
              - "radosgw-admin realm list"
              - "radosgw-admin zonegroup list"
              - "radosgw-admin zone list"
      desc: Retrieve the configured environment details
      polarion-id: CEPH-83575227
      module: exec.py
      name: get shared realm info on archive zone

  - test:
      clusters:
        ceph-pri:
          config:
            set-env: true
            script-name: user_create.py
            config-file-name: non_tenanted_user.yaml
            copy-user-info-to-site: ceph-sec
      desc: create non-tenanted user
      module: sanity_rgw_multisite.py
      name: create non-tenanted user
      polarion-id: CEPH-83575199

  # Baseline tests before upgrade

  - test:
      clusters:
        ceph-pri:
          config:
            script-name: test_Mbuckets_with_Nobjects.py
            config-file-name: test_Mbuckets_with_Nobjects.yaml
            verify-io-on-site: ["ceph-sec"]
      desc: test to create "M" no of buckets and "N" no of objects
      module: sanity_rgw_multisite.py
      name: m buckets with n objects pre upgrade
      polarion-id: CEPH-83575435

  - test:
      name: Verify DBR feature enabled on pre-upgraded cluster
      desc: Check DBR feature enabled on pre-upgraded cluster
      abort-on-fail: true
      module: sanity_rgw_multisite.py
      polarion-id: CEPH-83573596
      clusters:
        ceph-pri:
          config:
            script-name: test_check_sharding_enabled.py
            config-file-name: test_check_sharding_enabled_brownfield.yaml
            verify-io-on-site: ["ceph-pri", "ceph-sec"]

  - test:
      abort-on-fail: true
      desc: rgw-MS mixed-mode, secondary site upgrade
      module: test_cephadm_upgrade.py
      name: rgw-MS mixed-mode, secondary site upgrade
      polarion-id: CEPH-83574647
      clusters:
        ceph-sec:
          config:
            command: start
            service: upgrade
            verify_cluster_health: true

  - test:
      clusters:
        ceph-pri:
          config:
            set-env: true
            script-name: user_create.py
            config-file-name: non_tenanted_user.yaml
            copy-user-info-to-site: ceph-sec
      desc: create non-tenanted user
      module: sanity_rgw_multisite.py
      name: create non-tenanted user
      polarion-id: CEPH-83575199

  - test:
      clusters:
        ceph-sec:
          config:
            script-name: test_bucket_listing.py
            config-file-name: test_bucket_listing_flat_ordered_versionsing.yaml
      desc: test the duration for ordered listing of versioned buckets
      module: sanity_rgw_multisite.py
      name: ordered listing of versioned buckets post upgrade
      polarion-id: CEPH-83573545

  - test:
      abort-on-fail: true
      desc: rgw-ms, upgrade next site(primary)
      module: test_cephadm_upgrade.py
      name: rgw-ms, upgrade next site(primary)
      polarion-id: CEPH-83582415
      clusters:
        ceph-pri:
          config:
            command: start
            service: upgrade
            verify_cluster_health: true

  - test:
      abort-on-fail: true
      desc: rgw-ms, upgrade archive site
      module: test_cephadm_upgrade.py
      name: rgw-ms, upgrade archive site
      polarion-id: CEPH-83582415
      clusters:
        ceph-arc:
          config:
            command: start
            service: upgrade
            verify_cluster_health: true

  - test:
      clusters:
        ceph-pri:
          config:
            script-name: test_Mbuckets_with_Nobjects.py
            config-file-name: test_multisite_dynamic_resharding_brownfield.yaml
            verify-io-on-site: ["ceph-pri", "ceph-sec"]
      desc: Test dynamic resharding brownfield scenario after upgrade
      module: sanity_rgw_multisite.py
      name: Test dynamic resharding brownfield scenario after upgrade
      polarion-id: CEPH-83574736
