# Test suite for evaluating RGW multi-site upgrade scenario.
# Objective: Testing multi-site upgrade from RHCS 9.x sanity latest to 9.x latest build
#
# This suite deploys a single realm (India) spanning across two RHCS clusters. It has a
# zonegroup (shared) which also spans across the clusters. There exists a master (pri)
# and secondary (sec) zones within this group. The master zone is part of the pri
# cluster whereas the sec zone is part of the sec datacenter (cluster).
# platform : RHEL-9
# The data bucket is configured to use EC 2+2 on a 4-node cluster.
# conf : conf/tentacle/rgw/rgw_multisite_ec2+2.yaml
tests:

  - test:
      abort-on-fail: true
      desc: Install software pre-requisites for cluster deployment.
      module: install_prereq.py
      name: install vm pre-requsites

  - test:
      abort-on-fail: true
      clusters:
        ceph-pri:
          config:
            verify_cluster_health: true
            steps:
              - config:
                  command: bootstrap
                  service: cephadm
                  args:
                    release: stable
                    registry-url: registry.redhat.io
                    mon-ip: node1
                    orphan-initial-daemons: true
                    initial-dashboard-password: admin@123
                    dashboard-password-noupdate: true
                    skip-monitoring-stack: true
                  base_cmd_args:
                    verbose: true
              - config:
                  command: add_hosts
                  service: host
                  args:
                    attach_ip_address: true
                    labels: apply-all-labels
              - config:
                  command: apply
                  service: mgr
                  args:
                    placement:
                      label: mgr
              - config:
                  command: apply
                  service: mon
                  args:
                    placement:
                      label: mon
              - config:
                  command: apply
                  service: osd
                  args:
                    all-available-devices: true
              - config:
                  args:
                    - "ceph osd erasure-code-profile set rgwec22_4 k=2 m=2"
                    - "crush-failure-domain=host crush-device-class=hdd"
                  command: shell
              - config:
                  args:
                    - "ceph osd pool create primary.rgw.buckets.data 32 32"
                    - "erasure rgwec22_4"
                  command: shell
              - config:
                  args:
                    - "ceph osd pool application enable"
                    - "primary.rgw.buckets.data rgw"
                  command: shell
              - config:
                  command: apply
                  service: rgw
                  pos_args:
                    - shared.pri
                  args:
                    placement:
                      nodes:
                        - node3
        ceph-sec:
          config:
            verify_cluster_health: true
            steps:
              - config:
                  command: bootstrap
                  service: cephadm
                  args:
                    release: stable
                    registry-url: registry.redhat.io
                    mon-ip: node1
                    orphan-initial-daemons: true
                    initial-dashboard-password: admin@123
                    dashboard-password-noupdate: true
                    skip-monitoring-stack: true
                  base_cmd_args:
                    verbose: true
              - config:
                  command: add_hosts
                  service: host
                  args:
                    attach_ip_address: true
                    labels: apply-all-labels
              - config:
                  command: apply
                  service: mgr
                  args:
                    placement:
                      label: mgr
              - config:
                  command: apply
                  service: mon
                  args:
                    placement:
                      label: mon
              - config:
                  command: apply
                  service: osd
                  args:
                    all-available-devices: true
              - config:
                  args:
                    - "ceph osd erasure-code-profile set rgwec22_4 k=2 m=2"
                    - "crush-failure-domain=host crush-device-class=hdd"
                  command: shell
              - config:
                  args:
                    - "ceph osd pool create secondary.rgw.buckets.data 32 32"
                    - "erasure rgwec22_4"
                  command: shell
              - config:
                  args:
                    - "ceph osd pool application enable"
                    - "secondary.rgw.buckets.data rgw"
                  command: shell
              - config:
                  command: apply
                  service: rgw
                  pos_args:
                    - shared.sec
                  args:
                    placement:
                      nodes:
                        - node3
      desc: RHCS cluster deployment using cephadm.
      polarion-id: CEPH-83575222
      destroy-cluster: false
      module: test_cephadm.py
      name: deploy cluster

  - test:
      abort-on-fail: true
      clusters:
        ceph-pri:
          config:
            command: add
            id: client.1
            node: node4
            install_packages:
              - ceph-common
            copy_admin_keyring: true
        ceph-sec:
          config:
            command: add
            id: client.1
            node: node4
            install_packages:
              - ceph-common
            copy_admin_keyring: true
      desc: Configure the RGW client system
      destroy-cluster: false
      module: test_client.py
      name: configure client
      polarion-id: CEPH-83573758

# configuring HAproxy on the client node 'node4' and port '5000'
  - test:
      abort-on-fail: true
      clusters:
        ceph-pri:
          config:
            haproxy_clients:
              - node4
            rgw_endpoints:
              - node3:80
        ceph-sec:
          config:
            haproxy_clients:
              - node4
            rgw_endpoints:
              - node3:80
      desc: "Configure HAproxy"
      module: haproxy.py
      name: "Configure HAproxy"

  - test:
      abort-on-fail: true
      clusters:
        ceph-pri:
          config:
            cephadm: true
            commands:
              - "radosgw-admin realm create --rgw-realm india --default"
              - "radosgw-admin zonegroup create --rgw-realm india --rgw-zonegroup shared --endpoints http://{node_ip:node3}:80 --master --default"
              - "radosgw-admin zone create --rgw-realm india --rgw-zonegroup shared --rgw-zone primary --endpoints http://{node_ip:node3}:80 --master --default"
              - "radosgw-admin period update --rgw-realm india --commit"
              - "radosgw-admin user create --uid=repuser --display_name='Replication user' --access-key 21e86bce636c3aa0 --secret cf764951f1fdde5d --rgw-realm india --system"
              - "radosgw-admin zone modify --rgw-realm india --rgw-zonegroup shared --rgw-zone primary --access-key 21e86bce636c3aa0 --secret cf764951f1fdde5d"
              - "radosgw-admin period update --rgw-realm india --commit"
              - "ceph config set client.rgw.{daemon_id:shared.pri} rgw_realm india"
              - "ceph config set client.rgw.{daemon_id:shared.pri} rgw_zonegroup shared"
              - "ceph config set client.rgw.{daemon_id:shared.pri} rgw_zone primary"
              - "ceph orch restart {service_name:shared.pri}"
        ceph-sec:
          config:
            cephadm: true
            commands:
              - "sleep 120"
              - "radosgw-admin realm pull --rgw-realm india --url http://{node_ip:ceph-pri#node3}:80 --access-key 21e86bce636c3aa0 --secret cf764951f1fdde5d --default"
              - "radosgw-admin zone create --rgw-realm india --rgw-zonegroup shared --rgw-zone secondary --endpoints http://{node_ip:node3}:80 --access-key 21e86bce636c3aa0 --secret cf764951f1fdde5d"
              - "radosgw-admin period update --rgw-realm india --commit"
              - "ceph config set client.rgw.{daemon_id:shared.sec} rgw_realm india"
              - "ceph config set client.rgw.{daemon_id:shared.sec} rgw_zonegroup shared"
              - "ceph config set client.rgw.{daemon_id:shared.sec} rgw_zone secondary"
              - "ceph orch restart {service_name:shared.sec}"
      desc: Setting up RGW multisite replication environment
      module: exec.py
      name: setup multisite
      polarion-id: CEPH-10362

  - test:
      abort-on-fail: true
      clusters:
        ceph-pri:
          config: {}
        ceph-sec:
          config: {}
      desc: Verify RGW multisite configuration
      polarion-id: CEPH-83575227
      module: verify_multisite_config.py
      name: verify multisite configuration

  - test:
      clusters:
        ceph-pri:
          config:
            set-env: true
            script-name: user_create.py
            config-file-name: non_tenanted_user.yaml
            copy-user-info-to-site: ceph-sec
      desc: create non-tenanted user
      module: sanity_rgw_multisite.py
      name: create non-tenanted user
      polarion-id: CEPH-83575199

  # Baseline tests before upgrade
  - test:
      abort-on-fail: true
      name: download objects pre upgrade
      desc: test to create "M" no of buckets and "N" no of objects with download pre upgrade
      module: sanity_rgw_multisite.py
      clusters:
        ceph-sec:
          config:
            script-name: test_Mbuckets_with_Nobjects.py
            config-file-name: test_Mbuckets_with_Nobjects_download.yaml
            verify-io-on-site: ["ceph-pri"]
      polarion-id: CEPH-14237

  - test:
      name: versioning objects enable pre upgrade
      desc: test_versioning_objects_enable on primary pre upgrade
      polarion-id: CEPH-14261
      module: sanity_rgw_multisite.py
      clusters:
        ceph-pri:
          config:
            script-name: test_versioning_with_objects.py
            config-file-name: test_versioning_objects_enable.yaml
            verify-io-on-site: ["ceph-sec"]

  # Performing cluster upgrade

  - test:
      abort-on-fail: true
      name: RGW MS upgrade
      desc: RGW MS upgrade
      module: test_cephadm_upgrade.py
      clusters:
        ceph-sec:
          config:
            command: start
            service: upgrade
            verify_cluster_health: true
        ceph-pri:
          config:
            command: start
            service: upgrade
            verify_cluster_health: true
      polarion-id: CEPH-83574647
      # Upgrade may fail if nightly and stable build paths are incorrect, identical, or if the nightly build version is lower than the stable build.

  - test:
      abort-on-fail: true
      name: download objects post upgrade
      desc: test to create "M" no of buckets and "N" no of objects with download post upgrade
      module: sanity_rgw_multisite.py
      clusters:
        ceph-sec:
          config:
            script-name: test_Mbuckets_with_Nobjects.py
            config-file-name: test_Mbuckets_with_Nobjects_download.yaml
            verify-io-on-site: ["ceph-pri"]
      polarion-id: CEPH-14237

  - test:
      name: versioning objects enable post upgrade
      desc: test_versioning_objects_enable on primary post upgrade
      polarion-id: CEPH-14261
      module: sanity_rgw_multisite.py
      clusters:
        ceph-pri:
          config:
            script-name: test_versioning_with_objects.py
            config-file-name: test_versioning_objects_enable.yaml
            verify-io-on-site: ["ceph-sec"]

  - test:
      name: Retrieve the versions of the cluster parallelly
      desc: Retrieve the versions of the cluster parallelly
      module: test_parallel.py
      parallel:
        - test:
            clusters:
              ceph-pri:
                config:
                  cephadm: true
                  commands:
                    - "ceph versions"
            desc: Retrieve the versions of the cluster in primary
            polarion-id: CEPH-83575200
            module: exec.py
            name: Retrieve the versions of the cluster in primary
        - test:
            clusters:
              ceph-sec:
                config:
                  cephadm: true
                  commands:
                    - "ceph versions"
            desc: Retrieve the versions of the cluster in secondary
            polarion-id: CEPH-83575200
            module: exec.py
            name: Retrieve the versions of the cluster in secondary
