# Conf: conf/tentacle/smb/1admin-4node-1client-cluster.yaml
#
# SMB deployment topology:
#   1 admin node, 4 Ceph nodes, and 1 SMB client.
#   Post-bootstrap deployment with host specs and service placement
#   configured for the SMB testing environment.
#
# Suite YAML remains vanilla, without Rook-specific bootstrap arguments.
# Rook/ODF Ceph configuration is opt-in at runtime.
#
# For Rook/ODF defaults:
#   python run.py --suite suites/tentacle/rook/sanity_dmfg_smb.yaml \
#     --conf conf/tentacle/smb/1admin-4node-1client-cluster.yaml \
#     -c apply-odf-defaults=true
#
# Omit -c apply-odf-defaults=true for topology-only deployment
# using stock Ceph configuration.
---
tests:
  - test:
      name: Install ceph pre-requisites
      desc: installation of ceph pre-requisites
      module: install_prereq.py
      abort-on-fail: true

  - test:
      name: Cephadm bootstrap
      desc: Bootstrap first mon/host only (no add_hosts, no OSDs)
      module: test_cephadm.py
      abort-on-fail: true
      destroy-cluster: false
      config:
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1

  - test:
      name: Deploy Rook-aligned cephadm cluster
      desc: Host racks, mon/mgr by label, OSDs class ssd, bind .mgr to rack+ssd
      module: deploy_rook_defaults_ceph.py
      abort-on-fail: true
      destroy-cluster: false
      config:
        verify_cluster_health: true

  - test:
      name: Configure client
      desc: Install ceph-common and copy admin keyring on the client node
      module: test_client.py
      abort-on-fail: true
      destroy-cluster: false
      config:
        command: add
        id: client.1
        node: node4
        install_packages:
          - ceph-common
          - samba-client
          - cifs-utils
        copy_admin_keyring: true
        caps:
          mon: "allow *"
          osd: "allow *"
          mds: "allow *"
          mgr: "allow *"

  - test:
      name: Deploy samba with auth_mode 'user' using imperative style(CLI Commands)
      desc: Deploy samba with auth_mode 'user' using imperative style(CLI Commands)
      module: smb_deployment_imperative_method
      polarion-id: CEPH-83593843
      config:
        cephfs_volume: cephfs
        smb_subvolume_group: smb
        smb_subvolumes: [sv1]
        smb_subvolume_mode: '0777'
        smb_cluster_id: smb1
        auth_mode: user
        smb_user_name: user1
        smb_user_password: passwd
        smb_shares: [share1]
        path: "/"

  - test:
      name: Deploy samba with auth_mode 'user' using declarative style(Spec File)
      desc: Deploy samba with auth_mode 'user' using declarative style(Spec File)
      module: smb_deployment_declarative_method.py
      polarion-id: CEPH-83593845
      config:
        file_type: yaml
        file_mount: /tmp
        spec:
          - resource_type: ceph.smb.cluster
            cluster_id: smb1
            auth_mode: user
            user_group_settings:
              - {source_type: resource, ref: ug1}
            placement:
              label: smb
          - resource_type: ceph.smb.usersgroups
            users_groups_id: ug1
            values:
              users:
                - {name: user1, password: passwd}
              groups: []
          - resource_type: ceph.smb.share
            cluster_id: smb1
            share_id: share1
            cephfs:
              volume: cephfs
              subvolumegroup: smb
              subvolume: sv1
              path: /
          - resource_type: ceph.smb.share
            cluster_id: smb1
            share_id: share2
            cephfs:
              volume: cephfs
              subvolumegroup: smb
              subvolume: sv2
              path: /
