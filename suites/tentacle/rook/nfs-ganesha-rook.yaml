      polarion-id: CEPH-83575983
      abort-on-fail: false
      config:
        nfs_version: 4.1
        clients: 1
        dir_depth: 10
        dirs_per_depth: 5

  - test:
      name: Nfs Verify default permissions
      module: nfs_verify_multi_depth_dir_and_permissions.py
