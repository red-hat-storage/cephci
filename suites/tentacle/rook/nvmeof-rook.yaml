# NVMe-oF suite for Rook default settings validation
#
# Cases are taken from:
#   suites/tentacle/nvmeof/tier-2_nvmeof_gateway_operations.yaml
#   suites/tentacle/nvmeof/tier-2_nvmeof_functional_Regression.yaml
#
# Cluster configuration:
#   conf/tentacle/nvmeof/ceph_nvmeof_functional.yaml
#
# Deploy follows suites/tentacle/rook/deploy_rook_defaults_ceph.yaml:
#   bootstrap first mon/host only, then deploy_rook_defaults_ceph.py
#   (host racks, mon/mgr by label, OSDs class ssd, bind .mgr to rack+ssd).
# NVMe-oF gateways are applied by the cases below, not by the Rook deploy.
# Suite YAML is vanilla (no Rook keys on bootstrap args).
# Rook/ODF Ceph config is opt-in on the run command:
#
#   python run.py --suite suites/tentacle/rook/nvmeof-rook.yaml \
#     --conf conf/tentacle/nvmeof/ceph_nvmeof_functional.yaml \
#     -c apply-odf-defaults=true
#
# Omit -c apply-odf-defaults for topology-only (stock Ceph config).
#
# Order: gateway CLI cases, then remove that gateway and the pools it created
# (rbd, rbd_ec_data, rbd_ec_meta), then the functional regression cases.
# Each functional case deploys and cleans up its own gateway.
---
tests:
  - test:
      name: Install ceph pre-requisites
      desc: installation of ceph pre-requisites
      module: install_prereq.py
      abort-on-fail: true

  - test:
      name: Cephadm bootstrap
      desc: Bootstrap first mon/host only (no add_hosts, no OSDs)
      module: test_cephadm.py
      abort-on-fail: true
      destroy-cluster: false
      config:
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1

  - test:
      name: Deploy Rook-aligned cephadm cluster
      desc: Host racks, mon/mgr by label, OSDs class ssd, bind .mgr to rack+ssd
      module: deploy_rook_defaults_ceph.py
      abort-on-fail: true
      destroy-cluster: false
      config:
        verify_cluster_health: true

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.1
        nodes:
          - node10
          - node11
        install_packages:
          - ceph-common
        copy_admin_keyring: true
      desc: Setup clients for NVMe-oF gateway and functional cases
      destroy-cluster: false
      module: test_client.py
      name: configure Ceph client for NVMe tests
      polarion-id: CEPH-83573758

  # ---------------------------------------------------------------------------
  # Gateway CLI operations
  # from suites/tentacle/nvmeof/tier-2_nvmeof_gateway_operations.yaml
  # ---------------------------------------------------------------------------
  #  Configure Ceph NVMeoF gateway
  #  Configure Initiators
  #  Run IO on NVMe Targets
  - test:
      abort-on-fail: true
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: shell
              args:
                - ceph osd pool create rbd
          - config:
              command: shell
              args:
                - ceph osd pool application enable rbd rbd
          - config:
              command: shell
              args:
                - rbd create -s 1G image1
          - config:
              command: shell
              args:
                - rbd namespace create rbd/nvme_rns
          - config:
              command: shell
              args:
                - rbd create -s 1G rbd/nvme_rns/rns_image1
          - config:
              command: shell
              args:
                - ceph osd pool create rbd_ec_data 12 12 erasure default
          - config:
              command: shell
              args:
                - ceph osd pool set rbd_ec_data allow_ec_overwrites true
          - config:
              command: shell
              args:
                - rbd pool init rbd_ec_data
          - config:
              command: shell
              args:
                - ceph osd pool create rbd_ec_meta 64 64
          - config:
              command: shell
              args:
                - rbd pool init rbd_ec_meta
          - config:
              command: apply
              service: nvmeof
              args:
                placement:
                  nodes:
                    - node5
                    - node6
              pos_args:
                - rbd
                - gw-group1
      desc: NVMeoF Gateway deployment using cephadm
      destroy-cluster: false
      do-not-skip-tc: true
      module: test_cephadm.py
      name: deploy nvmeof gateway

