#===============================================================================================
# Tier-level: 2
# Test-Suite: tier-2_nvmeof_9-2_holistic_smoke.yaml
# IBM Ceph: 9.2 — Holistic SMOKE (same conf as full suite, shorter wall-clock)
#
# Cluster configuration:
#   conf/tentacle/nvmeof/ceph_nvmeof_9-2_holistic.yaml
#
# Smoke vs full (tier-2_nvmeof_9-2_holistic_cross-feature.yaml):
#   - Skips multi-initiator reservation matrix (Phase 4b)
#   - fio_runtime: 300 (~5 min IO window)
#   - Single LB cycle (node6 down/up + listener assert); no node7→node8
#   - Keeps: tenants, masking, reservation lifecycle, readonly, DHCHAP auth FIO,
#     customer FIO personas (OLTP/VM/AI/backup), QoS validate, visibility, resize,
#     HA failover
#   - Personas use shorter run_time (300s); single LB cycle only
#
# Coverage map:
#   suites/tentacle/nvmeof/HOLISTIC_9-2_COVERAGE.md
#===============================================================================================
tests:
  # --------------------------------------------------------------------------------------------
  # Phase 0 — Deploy full Ceph stack + clients
  # --------------------------------------------------------------------------------------------
  - test:
      abort-on-fail: true
      module: install_prereq.py
      name: install ceph pre-requisites

  - test:
      abort-on-fail: true
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
                registry-url: registry.redhat.io
                allow-fqdn-hostname: true
                log-to-file: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              command: shell
              args:
                - ceph
                - fs
                - volume
                - create
                - cephfs
          - config:
              command: apply
              service: mds
              base_cmd_args:
                verbose: true
              pos_args:
                - cephfs
              args:
                placement:
                  label: mds
          - config:
              command: apply
              service: rgw
              pos_args:
                - rgw.1
              args:
                placement:
                  label: rgw
      desc: Deploy IBM Ceph with mon/mgr/osd plus MDS and RGW
      destroy-cluster: false
      module: test_cephadm.py
      name: deploy full Ceph cluster

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.1
        nodes:
          - node9
          - node10
          - node11
          - node12
        install_packages:
          - ceph-common
        copy_admin_keyring: true
      desc: Configure 4 NVMe initiator clients
      destroy-cluster: false
      module: test_client.py
      name: configure Ceph clients for NVMe tests
      polarion-id: CEPH-83573758

  # --------------------------------------------------------------------------------------------
  # Phase 1 — Pools + NVMeoF (nvmeof_metadata; 2 colocated + 2 dedicated GWs)
  # --------------------------------------------------------------------------------------------
  - test:
      abort-on-fail: true
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: shell
              args:
                - ceph osd pool create rbd
          - config:
              command: shell
              args:
                - rbd pool init rbd
          - config:
              command: shell
              args:
                - ceph osd pool create nvmeof_metadata
          - config:
              command: shell
              args:
                - rbd pool init nvmeof_metadata
          - config:
              command: shell
              args:
                - rbd namespace create rbd/rados_ns_1
          - config:
              command: shell
              args:
                - rbd namespace create rbd/rados_ns_2
          - config:
              command: apply
              service: nvmeof
              args:
                placement:
                  nodes:
                    - node4
                    - node5
                    - node6
                    - node7
              pos_args:
                - nvmeof_metadata
                - group1
      desc: Create rbd + nvmeof_metadata pools and deploy NVMeoF on 4 GWs
      destroy-cluster: false
      do-not-skip-tc: true
      module: test_cephadm.py
      name: deploy NVMeoF service group1 (nvmeof_metadata)
      polarion-id: CEPH-83595696

  # --------------------------------------------------------------------------------------------
  # Phase 2 — Tenant configuration (standing; no cleanup)
  # --------------------------------------------------------------------------------------------
  - test:
      abort-on-fail: true
      config:
        install: false
        gw_nodes:
          - node4
          - node5
          - node6
          - node7
        rbd_pool: rbd
        nvme_metadata_pool: nvmeof_metadata
        gw_group: group1
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        inband_auth_mode: bidirectional
        subsystems:
          # Masked tenant shells
          - nqn: nqn.2016-06.io.spdk:cnode1
            serial: 1
            max_ns: 128
            no-group-append: true
            listener_port: 4420
            listeners: [node4, node5, node6, node7]
            allow_host: "*"
          - nqn: nqn.2016-06.io.spdk:cnode2
            serial: 2
            max_ns: 128
            no-group-append: true
            listener_port: 4420
            listeners: [node4, node5, node6, node7]
            allow_host: "*"

          # Prod open + QoS / resize target
          - nqn: nqn.2016-06.io.spdk:cnode3
            serial: 3
            max_ns: 128
            no-group-append: true
            listener_port: 4420
            listeners: [node4, node5, node6, node7]
            allow_host: "*"
            bdevs:
              - count: 8
                size: 500G
                ns_create_image: true

          # NQN-ACL tenant
          - nqn: nqn.2016-06.io.spdk:cnode4
            serial: 4
            max_ns: 128
            no-group-append: true
            listener_port: 4420
            listeners: [node4, node5, node6, node7]
            hosts:
              - node9
              - node10
            bdevs:
              - count: 8
                size: 500G
                ns_create_image: true

          # Secure tenant — DHCHAP per host
          - nqn: nqn.2016-06.io.spdk:cnode5
            serial: 5
            max_ns: 128
            no-group-append: true
            inband_auth: true
            listener_port: 4420
            listeners: [node4, node5, node6, node7]
            hosts:
              - node: node11
                inband_auth: true
              - node: node12
                inband_auth: true
            bdevs:
              - count: 8
                size: 500G
                ns_create_image: true

          # Shared — reservations
          - nqn: nqn.2016-06.io.spdk:cnode6
            serial: 6
            max_ns: 128
            no-group-append: true
            listener_port: 4420
            listeners: [node4, node5, node6, node7]
            allow_host: "*"
            bdevs:
              - count: 4
                size: 500G
                ns_create_image: true

          # Shared — RADOS namespaces
          - nqn: nqn.2016-06.io.spdk:cnode7
            serial: 7
            max_ns: 128
            no-group-append: true
            listener_port: 4420
            listeners: [node4, node5, node6, node7]
            allow_host: "*"
            bdevs:
              - count: 4
                size: 500G
                ns_create_image: true
                rados_namespace: rados_ns_1
              - count: 4
                size: 500G
                ns_create_image: true
                rados_namespace: rados_ns_2

          # Prod open — HA/LB workload
          - nqn: nqn.2016-06.io.spdk:cnode8
            serial: 8
            max_ns: 128
            no-group-append: true
            listener_port: 4420
            listeners: [node4, node5, node6, node7]
            allow_host: "*"
            bdevs:
              - count: 8
                size: 500G
                ns_create_image: true
      desc: Configure tenant subsystems (listeners/hosts/NS/auth/RADOS) — persistent
      destroy-cluster: false
      module: test_ceph_nvmeof_gateway.py
      name: Configure tenant subsystems
      polarion-id: CEPH-83609777

  # --------------------------------------------------------------------------------------------
  # Phase 3 — Masking setup on masked tenant (leave visible for under-load churn)
  # --------------------------------------------------------------------------------------------
  - test:
      abort-on-fail: true
      config:
        install: false
        gw_nodes:
          - node4
          - node5
          - node6
          - node7
        rbd_pool: rbd
        nvme_metadata_pool: nvmeof_metadata
        gw_group: group1
        do_not_create_image: true
        rep-pool-only: true
        service: namespace
        steps:
          - config:
              command: add
              args:
                subsystems: 2
                namespaces: 16
                pool: rbd
                image_size: 500G
                no-auto-visible: true
                group: group1
                validate_ns_masking_initiators: true
          - config:
              command: add_host
              args:
                subsystems: 2
                namespaces: 16
                initiators:
                  - node9
                  - node10
                  - node11
                  - node12
                group: group1
                validate_ns_masking_initiators: true
          - config:
              command: change_visibility
              args:
                subsystems: 2
                namespaces: 16
                auto-visible: "yes"
                group: group1
                validate_ns_masking_initiators: true
        initiators:
          - node9
          - node10
          - node11
          - node12
      desc: Create masked namespaces then restore visibility for under-load churn
      destroy-cluster: false
      module: test_ceph_nvmeof_ns_masking.py
      name: Setup namespace masking tenant
      polarion-id: CEPH-83609777

  # --------------------------------------------------------------------------------------------
  # Phase 4 — Reservation lifecycle (release before continuous FIO)
  # --------------------------------------------------------------------------------------------
  - test:
      abort-on-fail: false
      config:
        install: false
        gw_nodes:
          - node4
          - node5
          - node6
          - node7
        rbd_pool: rbd
        nvme_metadata_pool: nvmeof_metadata
        gw_group: group1
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        reservation:
          - register_args:
              rrega: 0
          - acquire_args:
              racqa: 0
              rtype: 1
          - release_args:
              rrela: 0
              rtype: 1
          - unregister_args:
              rrega: 1
        initiators:
          - node: node9
            nqn: connect-all
            listener_port: 4420
          - node: node10
            nqn: connect-all
            listener_port: 4420
        cleanup:
          - disconnect_all
      desc: Validate reservation lifecycle then disconnect before under-load FIO
      destroy-cluster: false
      module: test_ceph_nvmeof_gateway_ns_reservation.py
      name: Validate namespace reservations
      polarion-id: CEPH-83626134

  # Phase 4b (multi-init reservation matrix) omitted in smoke — see full suite

  # --------------------------------------------------------------------------------------------
  # Phase 4c — Read-only namespaces (ISCE-2121)
  # --------------------------------------------------------------------------------------------
  - test:
      abort-on-fail: false
      config:
        install: false
        rbd_pool: rbd
        nvme_metadata_pool: nvmeof_metadata
        gw_group: group1
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        test_case: CEPH-83624617
        gw_nodes:
          - node4
          - node5
          - node6
          - node7
        subsystems:
          - nqn: nqn.2016-06.io.spdk:cnode_ro1
            listener_port: 4420
            listeners: [node4, node5, node6, node7]
            allow_host: "*"
          - nqn: nqn.2016-06.io.spdk:cnode_ro2
            listener_port: 4420
            listeners: [node4, node5, node6, node7]
            allow_host: "*"
        initiators:
          - nqn: connect-all
            listener_port: 4420
            node: node9
        cleanup:
          - disconnect_all
      desc: Validate read-only namespace create and write-fail behavior (ISCE-2121)
      destroy-cluster: false
      module: test_ceph_nvmeof_readonly_ns.py
      name: Validate read-only namespaces
      polarion-id: CEPH-83624617

  # --------------------------------------------------------------------------------------------
  # Phase 4d — DHCHAP per-host FIO in SAME phase as key create (ISCE-3542)
  # --------------------------------------------------------------------------------------------
  - test:
      abort-on-fail: false
      config:
        mode: auth_fio
        install: false
        gw_nodes:
          - node4
          - node5
          - node6
          - node7
        rbd_pool: rbd
        nvme_metadata_pool: nvmeof_metadata
        gw_group: group1
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        auth_fio:
          inband_auth_mode: bidirectional
          fio_runtime: 60
          subsystems:
            - nqn: nqn.2016-06.io.spdk:cnode_dhchap1
              serial: 85
              max_ns: 32
              no-group-append: true
              inband_auth: true
              listener_port: 4420
              listeners: [node4, node5, node6, node7]
              hosts:
                - node: node11
                  inband_auth: true
              bdevs:
                - count: 8
                  size: 500G
                  ns_create_image: true
            - nqn: nqn.2016-06.io.spdk:cnode_dhchap2
              serial: 86
              max_ns: 32
              no-group-append: true
              inband_auth: true
              listener_port: 4420
              listeners: [node4, node5, node6, node7]
              hosts:
                - node: node12
                  inband_auth: true
              bdevs:
                - count: 8
                  size: 500G
                  ns_create_image: true
          initiators:
            - nqn: nqn.2016-06.io.spdk:cnode_dhchap1
              listener_port: 4420
              node: node11
              io_args:
                io_type: randrw
                rwmixread: 70
                iodepth: 8
                run_time: 60
                size: 1G
                test_name: dhchap-host-c11
                execute_blkdiscard: false
            - nqn: nqn.2016-06.io.spdk:cnode_dhchap2
              listener_port: 4420
              node: node12
              io_args:
                io_type: randwrite
                iodepth: 8
                run_time: 60
                size: 1G
                test_name: dhchap-host-c12
                execute_blkdiscard: false
      desc: >
        ISCE-3542 — set controller/host DHCHAP keys and run authenticated FIO
        in the same phase (keys never leave this TC)
      destroy-cluster: false
      module: test_ceph_nvmeof_holistic_io.py
      name: DHCHAP per-host authenticated FIO
      polarion-id: CEPH-83632329


  # --------------------------------------------------------------------------------------------
  # Phase 4e — Real DB engines on NVMeoF (podman + FS on namespace)
  #   Feasible: PostgreSQL, MySQL, MariaDB, MongoDB, Redis, Cassandra
  #   Skip: Oracle (license). MSSQL optional via accept_eula (not enabled here).
  # --------------------------------------------------------------------------------------------
  - test:
      abort-on-fail: false
      config:
        install: false
        gw_nodes:
          - node4
          - node5
          - node6
          - node7
        rbd_pool: rbd
        nvme_metadata_pool: nvmeof_metadata
        gw_group: group1
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        subsystems:
          - nqn: nqn.2016-06.io.spdk:cnode_db
            serial: 90
            max_ns: 64
            no-group-append: true
            listener_port: 4420
            listeners: [node4, node5, node6, node7]
            allow_host: "*"
            bdevs:
              # 5 engines + spares
              - count: 8
                size: 500G
                ns_create_image: true
        initiators:
          - nqn: nqn.2016-06.io.spdk:cnode_db
            listener_port: 4420
            node: node9
        databases:
          - engine: postgresql
            duration: 30
            scale: 5
            clients: 8
            jobs: 4
          - engine: mysql
            duration: 30
            clients: 8
            rows: 5000
          - engine: mariadb
            duration: 30
            clients: 8
            rows: 5000
          - engine: mongodb
            duration: 30
            docs: 10000
          - engine: redis
            duration: 30
            clients: 50
          # cassandra omitted in smoke (slow start); oracle always skipped
        cleanup:
          - disconnect_all
      desc: >
        Real DB I/O on NVMeoF — PostgreSQL/MySQL/MariaDB/MongoDB/Redis
        with datadir on mounted namespaces (Oracle skipped; Cassandra smoke-omitted)
      destroy-cluster: false
      module: test_ceph_nvmeof_db_workloads.py
      name: Database workloads on NVMeoF namespaces
      polarion-id: CEPH-83575441

  # --------------------------------------------------------------------------------------------
  # Phase 4.5 — Initiator reboot + nvmf-autoconnect (shorter smoke timeouts)
  # --------------------------------------------------------------------------------------------
  - test:
      abort-on-fail: true
      config:
        install: false
        gw_nodes:
          - node4
          - node5
          - node6
          - node7
        rbd_pool: rbd
        nvme_metadata_pool: nvmeof_metadata
        gw_group: group1
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        autoconnect_timeout: 180
        post_reboot_settle: 10
        fio_smoke: true
        fio_runtime: 15
        initiators:
          - nqn: discover-all
            listener_port: 4420
            node: node10
            subsystems:
              - nqn.2016-06.io.spdk:cnode8
        cleanup: []
      desc: >
        Smoke: reboot initiator; namespaces return via nvmf-autoconnect
        without manual discover/connect
      destroy-cluster: false
      module: test_ceph_nvmeof_initiator_reboot_autoconnect.py
      name: Initiator reboot persistent autoconnect
      polarion-id: CEPH-83609777

  # --------------------------------------------------------------------------------------------
  # Phase 5 — UNDER LOAD (smoke): shorter FIO + single LB cycle
  # --------------------------------------------------------------------------------------------
  - test:
      abort-on-fail: true
      config:
        install: false
        gw_nodes:
          - node4
          - node5
          - node6
          - node7
        rbd_pool: rbd
        nvme_metadata_pool: nvmeof_metadata
        gw_group: group1
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        fio_runtime: 300
        fio_settle_seconds: 20
        op_settle_seconds: 15
        initiators:
          # Persona: OLTP database
          - nqn: discover-all
            listener_port: 4420
            node: node9
            subsystems:
              - nqn.2016-06.io.spdk:cnode3
              - nqn.2016-06.io.spdk:cnode8
            io_args:
              io_type: randrw
              rwmixread: 70
              bs: 4k
              iodepth: 32
              num_jobs: 4
              fsync: 32
              direct: 1
              run_time: 300
              size: 1G
              test_name: smoke-persona-oltp-db-c9
              execute_blkdiscard: false
          # Persona: VM boot + integrity
          - nqn: discover-all
            listener_port: 4420
            node: node10
            subsystems:
              - nqn.2016-06.io.spdk:cnode4
              - nqn.2016-06.io.spdk:cnode7
            io_args:
              io_type: randrw
              rwmixread: 85
              bs: 4k
              iodepth: 16
              num_jobs: 2
              direct: 1
              run_time: 300
              size: 1G
              verify: crc32c
              verify_fatal: 1
              test_name: smoke-persona-vm-boot-integrity-c10
              execute_blkdiscard: false
          # Persona: AI/ML + analytics scan
          - nqn: discover-all
            listener_port: 4420
            node: node11
            subsystems:
              - nqn.2016-06.io.spdk:cnode2
              - nqn.2016-06.io.spdk:cnode6
            io_args:
              io_type: randread
              bs: 1M
              iodepth: 32
              num_jobs: 2
              direct: 1
              run_time: 300
              size: 1G
              test_name: smoke-persona-ai-analytics-c11
              execute_blkdiscard: false
          # Persona: backup / media ingest
          - nqn: discover-all
            listener_port: 4420
            node: node12
            subsystems:
              - nqn.2016-06.io.spdk:cnode3
              - nqn.2016-06.io.spdk:cnode8
            io_args:
              io_type: write
              bs: 1M
              iodepth: 8
              direct: 1
              run_time: 300
              size: 1G
              test_name: smoke-persona-backup-media-c12
              execute_blkdiscard: false
        day2_ops:
          - op: qos_validate_io
            args:
              subsystem: nqn.2016-06.io.spdk:cnode3
              nsid: 1
              initiator_node: node9
              w-megabytes-per-second: 40
              r-megabytes-per-second: 40
              rw-megabytes-per-second: 60
              io_runtime: 30
            settle_seconds: 15
          - op: set_qos
            args:
              subsystem: nqn.2016-06.io.spdk:cnode3
              nsid: 1
              r-megabytes-per-second: 200
              w-megabytes-per-second: 200
              rw-megabytes-per-second: 300
            settle_seconds: 15
          - op: change_visibility
            args:
              subsystem: nqn.2016-06.io.spdk:cnode1
              nsid: 1
              auto-visible: "no"
              force: true
            settle_seconds: 10
          - op: change_visibility
            args:
              subsystem: nqn.2016-06.io.spdk:cnode1
              nsid: 1
              auto-visible: "yes"
              force: true
            settle_seconds: 10
          - op: resize
            args:
              subsystem: nqn.2016-06.io.spdk:cnode8
              nsid: 1
              size: 550G
            settle_seconds: 20
          - op: scale_down
            args:
              nodes: ["node6"]
            settle_seconds: 25
          - op: scale_up
            args:
              nodes: ["node6"]
              assert_listeners:
                subsystems:
                  - nqn.2016-06.io.spdk:cnode3
                  - nqn.2016-06.io.spdk:cnode8
                  - nqn.2016-06.io.spdk:cnode4
                  - nqn.2016-06.io.spdk:cnode7
                listener_port: 4420
            settle_seconds: 25
          - op: assert_listeners
            args:
              subsystems:
                - nqn.2016-06.io.spdk:cnode3
                - nqn.2016-06.io.spdk:cnode8
                - nqn.2016-06.io.spdk:cnode4
                - nqn.2016-06.io.spdk:cnode7
                - nqn.2016-06.io.spdk:cnode6
              listener_port: 4420
            settle_seconds: 5
          - op: ha_failover
            args:
              tool: systemctl
              nodes: ["node4"]
            settle_seconds: 25
      desc: >
        Smoke under-load — customer FIO personas with QoS, visibility, resize,
        single LB cycle + listener assert, and HA failover
      destroy-cluster: false
      module: test_ceph_nvmeof_holistic_io.py
      name: Smoke under-load day-2 ops with multi-tenant FIO
      polarion-id: CEPH-83575441
