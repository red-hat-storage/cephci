# IBMCEPH-19520: forced listener delete under live I/O — peer GW abort regression
# cluster configuration: conf/tentacle/nvmeof/ceph_nvmeof_2GW_1Client.yaml
#
# Standalone run for 9.0 repro (expect_gateway_abort: true) and 9.2z1 verify
# (expect_gateway_abort: false). Override expect_gateway_abort when switching builds.
---
tests:

  - test:
      abort-on-fail: true
      module: install_prereq.py
      name: install ceph pre-requisites

  - test:
      abort-on-fail: true
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
                registry-url: cp.icr.io
                allow-fqdn-hostname: true
                allow-overwrite: true
                log-to-file: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
      desc: IBM Ceph 9.0 cluster deployment using cephadm
      destroy-cluster: false
      module: test_cephadm.py
      name: deploy cluster

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.1
        nodes:
          - node10
        copy_admin_keyring: true
        install_packages:
          - ceph-common
          - nvme-cli
          - fio
      desc: Setup client for NVMe-oF TLS-PSK IBMCEPH-19520 tests
      destroy-cluster: false
      module: test_client.py
      name: configure Ceph client for NVMe TLS-PSK tests

  - test:
      abort-on-fail: false
      config:
        install: true
        spec_deployment: true
        rbd_pool: rbd
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        gw_group: group
        gw_nodes:
          - node5
          - node6
        listener_port: 4420
        initiator_node: node10
        tls_psk: true
        state_update_interval_sec: 30
        state_update_notify: false
        # 9.0 repro: true. 9.2z1 / fixed builds: false.
        expect_gateway_abort: false
        listener_abort_fio_runtime: 120
        peer_sync_wait_sec: 75
        subsystems:
          - nqn: nqn.2016-06.io.spdk:tlspsk-listener-abort
            no-group-append: true
            secure_listener: true
            bdevs:
              - count: 1
                size: 5G
                ns_create_image: true
        cleanup:
          - subsystems
          - pool
          - gateway
      desc: >
        IBMCEPH-19520: TLS-PSK connect, run FIO, force-delete the peer
        gateway listener, and assert peer abort (9.0) or no abort (fixed).
      destroy-cluster: false
      module: test_ceph_nvmeof_tlspsk_listener_delete_abort.py
      name: IBMCEPH-19520 TLS-PSK listener delete peer abort
      polarion-id: IBMCEPH-19520
