# NVMeoF alerts for extended tests
# Inventory: conf/inventory/rhel-9.6-server-x86_64-xlarge.yaml or later versions

tests:
  - test:
      abort-on-fail: true
      module: install_prereq.py
      name: install ceph pre-requisites
  - test:
      abort-on-fail: true
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
                registry-url: registry.redhat.io
                allow-fqdn-hostname: true
                log-to-file: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
      desc: RHCS cluster deployment using cephadm
      destroy-cluster: false
      module: test_cephadm.py
      name: deploy cluster

#  Test cases to be executed
  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.1
        nodes:
          - node10
          - node11
        install_packages:
          - ceph-common
        copy_admin_keyring: true
      desc: Setup client on NVMEoF gateway
      destroy-cluster: false
      module: test_client.py
      name: configure Ceph client for NVMe tests
      polarion-id: CEPH-83573758

  - test:
      abort-on-fail: false
      config:
        rbd_pool: rbd
        nvme_metadata_pool: rbd
        test_case: CEPH-83611097
        time_to_fire: 600
        interval: 60
        cleanup:
          - pool
          - gateway
        gw_group: group1
        gw_nodes:
          - node6
          - node7
      desc: NVMeoF Missing Listener warning alert
      destroy-cluster: false
      module: test_ceph_nvmeof_alerts_events.py
      name: Validate NVMeoFMissingListener alert
      polarion-id: CEPH-83611097

  - test:
      abort-on-fail: false
      config:
        gw_nodes:
          - node6
          - node7
        rbd_pool: rbd
        nvme_metadata_pool: rbd
        time_to_fire: 600
        interval: 120
        gw_group: gw_group1
        listener_port: 4420
        test_case: CEPH-83611098
        cleanup:
          - pool
          - gateway
      desc: Warning at Ceph cluster on zero listener in a subsystem
      destroy-cluster: false
      module: test_ceph_nvmeof_alerts_events.py
      name: Validate Warning at Ceph cluster on zero listener in a subsystem
      polarion-id: CEPH-83611098

  - test:
      abort-on-fail: false
      config:
        gw_nodes:
          - node6
          - node7
        rbd_pool: rbd
        nvme_metadata_pool: rbd
        time_to_fire: 300
        interval: 100
        gw_group: gw_group1
        subsystems:
          - nqn: nqn.2016-06.io.spdk:cnode1
            serial: 1
            listener_port: 4420
            listeners:
              - node6
              - node7
            allow_host: "*"
        test_case: CEPH-83616916
        host: node10
        cleanup:
          - pool
          - gateway
      desc: Warning at subsystem defined without host level security on cluster
      destroy-cluster: false
      module: test_ceph_nvmeof_alerts_events.py
      name: Validate NVMeoFGatewayOpenSecurity alert helps user to add host security to the subsystem
      polarion-id: CEPH-83616916

  - test:
      abort-on-fail: false
      config:
        gw_nodes:
          - node6
          - node7
        nvme_diff_version: cp.stg.icr.io/cp/ibm-ceph/nvmeof-rhel9:v9.0-8318.20251206033148.381cff9
        rbd_pool: nvme_of_pool
        nvme_metadata_pool: nvme_of_pool
        time_to_fire: 3600
        interval: 900
        gw_group: gw_group1
        subsystems:                             # Configure subsystems with all sub-entities
          - nqn: nqn.2016-06.io.spdk:cnode1
            max_ns: 1024
            bdevs:
              - count: 5
                size: 1G
                ns_create_image: true
            listener_port: 4420
            listeners:
              - node6
              - node7
            allow_host: "*"
        test_case: CEPH-83617640
        cleanup:
          - pool
          - gateway
      desc: Prometheus alert for having different nvme-of gateway releases active on cluster
      destroy-cluster: false
      module: test_ceph_nvmeof_alerts_events.py
      name: Validate NVMeoFVersionMismatch alert
      polarion-id: CEPH-83617640
