# Ceph NVMe-oF XCOPY/CNC orch-spec parameter tests
# Deploy CNC settings via nvmeof service spec (cnc_enable, rate, chunk, parallel)
# cluster configuration file: conf/tentacle/nvmeof/ceph_nvmeof_2GW_1Client.yaml
# inventory: conf/inventory/rhel-9.6-server-x86_64-xlarge.yaml
---
tests:

  - test:
      abort-on-fail: true
      module: install_prereq.py
      name: install ceph pre-requisites

  - test:
      abort-on-fail: true
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
                registry-url: registry.redhat.io
                allow-fqdn-hostname: true
                allow-overwrite: true
                log-to-file: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
      desc: RHCS cluster deployment using cephadm
      destroy-cluster: false
      module: test_cephadm.py
      name: deploy cluster

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.1
        nodes:
          - node6
        copy_admin_keyring: true
        install_packages:
          - ceph-common
      desc: Setup RHEL NVMe-oF initiator client
      destroy-cluster: false
      module: test_client.py
      name: configure Ceph client for NVMe tests

  # Orch-spec cnc_enable=true vs host R/W after cnc_enable=false
  - test:
      abort-on-fail: true
      config:
        gw_nodes:
          - node4
          - node5
        rbd_pool: rbd
        nvme_metadata_pool: rbd
        gw_group: gw_group1
        install: true
        spec_deployment: true
        skip_cnc_rpc_config: true
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        operation: spec_cnc_enable_perf
        copy_count: 500
        copy_blocks: 8192
        min_speedup: 1.0
        redeploy_wait_sec: 60
        enable_cnc_logging: true
        nvmeof_spec:
          cnc_enable: true
          cnc_rate_limiter_bytes: 400000000
          cnc_chunk_blocks: 512
          cnc_parallel_chunks: 8
        cleanup:
          - subsystems
          - initiators
          - disconnect_all
          - pool
          - gateway
        subsystems:
          - nqn: nqn.2016-06.io.spdk:cnode1
            serial: 1
            bdevs:
              - count: 2
                size: 10G
                ns_create_image: true
            listeners:
              - node4
              - node5
            listener_port: 4420
            allow_host: "*"
        initiators:
          - nqn: connect-all
            listener_port: 4420
            node: node6
      desc: >
        Deploy NVMe-oF with cnc_enable via orch spec, time CNC copies,
        re-apply with cnc_enable=false and compare against host R/W
      destroy-cluster: false
      module: test_nvmeof_xcopy_cnc_rhel.py
      name: orch-spec cnc_enable CNC vs host R/W performance

  # Orch-spec rate/chunk/parallel behavioral exercise (no RPC override)
  - test:
      abort-on-fail: true
      config:
        gw_nodes:
          - node4
          - node5
        rbd_pool: rbd
        nvme_metadata_pool: rbd
        gw_group: gw_group1
        install: true
        spec_deployment: true
        skip_cnc_rpc_config: true
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        operation: spec_cnc_params_exercise
        concurrent_copies: 4
        copy_blocks: 65536
        large_blocks: 50000
        max_limited_MBps: 3
        enable_cnc_logging: true
        nvmeof_spec:
          cnc_enable: true
          cnc_rate_limiter_bytes: 1048576
          cnc_chunk_blocks: 512
          cnc_parallel_chunks: 8
        cleanup:
          - subsystems
          - initiators
          - disconnect_all
          - pool
          - gateway
        subsystems:
          - nqn: nqn.2016-06.io.spdk:cnode1
            serial: 1
            bdevs:
              - count: 2
                size: 10G
                ns_create_image: true
            listeners:
              - node4
              - node5
            listener_port: 4420
            allow_host: "*"
        initiators:
          - nqn: connect-all
            listener_port: 4420
            node: node6
      desc: >
        Deploy NVMe-oF with custom cnc_rate_limiter_bytes, cnc_chunk_blocks
        and cnc_parallel_chunks via orch spec; assert rate-bound throughput
        and successful large chunked CNC copy
      destroy-cluster: false
      module: test_nvmeof_xcopy_cnc_rhel.py
      name: orch-spec CNC rate chunk parallel exercise
