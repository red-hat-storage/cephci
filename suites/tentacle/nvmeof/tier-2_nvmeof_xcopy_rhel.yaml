# Ceph NVMe-oF XCOPY/CNC RHEL functional tests (P0)
# Each CNC operation runs twice for result comparison:
#   - ana_affinity=same      (pick 2 NS from one ANA / lb_group)
#   - ana_affinity=different (pick NS across ANA / lb_groups)
# Namespace layout is always 2 NS on node4 + 2 NS on node5 so auto-LB
# cannot leave fewer than 2 NS on a single ANA group. rebalance_period_sec=0
# keeps the lb_group pins stable.
# After CNC copies, tests assert nvmeof podman logs contain XCOPY/CNC markers
# (XCOPY: ISSUE READ / WRITE OK / COMPLETE SUCCESS) from SPDK ctrlr_cnc.c.
# cluster configuration file: conf/tentacle/nvmeof/ceph_nvmeof_2GW_1Client.yaml
# inventory: conf/inventory/rhel-9.6-server-x86_64-xlarge.yaml
---
tests:

  - test:
      abort-on-fail: true
      module: install_prereq.py
      name: install ceph pre-requisites

  - test:
      abort-on-fail: true
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
                registry-url: registry.redhat.io
                allow-fqdn-hostname: true
                allow-overwrite: true
                log-to-file: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
      desc: RHCS cluster deployment using cephadm
      destroy-cluster: false
      module: test_cephadm.py
      name: deploy cluster

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.1
        nodes:
          - node6
        copy_admin_keyring: true
        install_packages:
          - ceph-common
      desc: Setup RHEL NVMe-oF initiator client
      destroy-cluster: false
      module: test_client.py
      name: configure Ceph client for NVMe tests

  # --- cross_ns_copy_verify: same ANA ---
  - test:
      abort-on-fail: true
      config:
        gw_nodes:
          - node4
          - node5
        rbd_pool: rbd
        nvme_metadata_pool: rbd
        gw_group: gw_group1
        install: true
        spec_deployment: true
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        operation: cross_ns_copy_verify
        rebalance_period: true
        rebalance_period_sec: 0
        ana_affinity: same
        enable_cnc_logging: true
        verify_xcopy_logs: true
        cnc_config:
          host_behav_support_cnc: true
          chunk_nlb: 512
          max_inflight: 8
          rate_limit_bytes: 400000000
        cleanup:
          - subsystems
          - initiators
          - disconnect_all
          - pool
          - gateway
        subsystems:
          - nqn: nqn.2016-06.io.spdk:cnode1
            serial: 1
            bdevs:
              - count: 2
                size: 10G
                ns_create_image: true
                lb_group: node4
              - count: 2
                size: 10G
                ns_create_image: true
                lb_group: node5
            listeners:
              - node4
              - node5
            listener_port: 4420
            allow_host: "*"
        initiators:
          - nqn: connect-all
            listener_port: 4420
            node: node6
      desc: >
        RHEL CNC same-NS/cross-NS/chunked copies with verification;
        src/dst chosen from the same ANA group (2 NS per GW)
      destroy-cluster: false
      module: test_nvmeof_xcopy_cnc_rhel.py
      name: RHEL CNC cross-NS verify (same ANA)

