          pool: rbd
        operation: full_volume_integrity
        rebalance_period: true
        rebalance_period_sec: 0
        verify_xcopy_logs: true
        ana_affinity: same
        io_size: 5G
        fio_bs: 1M
        fio_iodepth: 32
        stress_loop: true
        stress_count: 50
        cnc_config:
          host_behav_support_cnc: true
          chunk_nlb: 512
          max_inflight: 8
          rate_limit_bytes: 400000000
        cleanup:
          - subsystems
          - initiators
          - disconnect_all
          - pool
          - gateway
        subsystems:
          - nqn: nqn.2016-06.io.spdk:cnode1
            serial: 1
            bdevs:
              - count: 2
                size: 20G
                ns_create_image: true
                lb_group: node4
              - count: 2
                size: 20G
                ns_create_image: true
                lb_group: node5
            listeners:
              - node4
              - node5
            listener_port: 4420
            allow_host: "*"
        initiators:
          - nqn: connect-all
            listener_port: 4420
            node: node6
      desc: >
        fio crc32c fill, CNC full-region copy, fio verify;
        src/dst chosen from the same ANA group (2 NS per GW)
      destroy-cluster: false
      module: test_nvmeof_xcopy_cnc_rhel.py
      name: large-scale CNC data integrity (same ANA)

