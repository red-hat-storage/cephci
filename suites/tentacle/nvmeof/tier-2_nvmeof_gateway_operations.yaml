# Ceph NVMeoF CLI Operations Suite - v9.x
# cluster configuration file: conf/squid/nvmeof/ceph_nvmeof_sanity.yaml
# Inventory: conf/inventory/rhel-9.6-server-x86_64-xlarge.yaml

tests:
# Set up the cluster
  - test:
      abort-on-fail: true
      module: install_prereq.py
      name: install ceph pre-requisites
  - test:
      abort-on-fail: true
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
                registry-url: registry.redhat.io
                allow-fqdn-hostname: true
                log-to-file: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
      desc: RHCS cluster deployment using cephadm
      destroy-cluster: false
      module: test_cephadm.py
      name: deploy cluster

#  Test cases to be executed
  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.1
        nodes:
          - node10
        install_packages:
          - ceph-common
        copy_admin_keyring: true
      desc: Setup client on NVMEoF gateway
      destroy-cluster: false
      module: test_client.py
      name: configure Ceph client for NVMe tests
      polarion-id: CEPH-83573758

  #  Configure Ceph NVMeoF gateway
  #  Configure Initiators
  #  Run IO on NVMe Targets
  - test:
      abort-on-fail: true
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: shell
              args:
                - ceph osd pool create rbd
          - config:
              command: shell
              args:
                - ceph osd pool application enable rbd rbd
          - config:
              command: shell
              args:
                - rbd create -s 1G image1
          - config:
              command: shell
              args:
                - rbd namespace create rbd/nvme_rns
          - config:
              command: shell
              args:
                - rbd create -s 1G rbd/nvme_rns/rns_image1
          - config:
              command: apply
              service: nvmeof
              args:
                placement:
                  nodes:
                    - node5
                    - node6
              pos_args:
                - rbd
                - gw-group1
      desc: NVMeoF Gateway deployment using cephadm
      destroy-cluster: false
      do-not-skip-tc: true
      module: test_cephadm.py
      name: deploy nvmeof gateway

  - test:
      abort-on-fail: false
      config:
        node: node6
        pool: rbd
        port: 5500
        gw_group: gw-group1
        steps:
          - config:
              service: gateway
              command: version         # gateway Version
              base_cmd_args:
                format: json
          - config:
              service: gateway
              command: info             # gateway info
          - config:
              service: gateway
              command: get_log_level    # gateway get_log_level
              base_cmd_args:
                format: json
          - config:
              service: gateway
              command: set_log_level    # gateway set_log_level
              args:
                level: warning
          - config:
              service: gateway
              command: get_log_level    # verify gateway set_log_level
              base_cmd_args:
                format: json
          - config:
              service: gateway
              command: get_stats        # gateway get_stats
              base_cmd_args:
                format: json
          - config:
              service: gateway
              command: get_thread_stats # gateway get_thread_stats
              base_cmd_args:
                format: json
          - config:
