tests:
  - test:
      name: setup pre-requisites
      desc: Install software pre-requisites for cluster deployment
      module: install_prereq.py
      abort-on-fail: true

  - test:
      name: Deploy cluster using cephadm
      desc: Bootstrap and deploy services
      module: test_cephadm.py
      polarion-id: CEPH-83573713
      config:
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              command: apply
              service: rgw
              pos_args:
                - rgw.1
              args:
                placement:
                  label: rgw
          - config:
              args:
                - "ceph fs volume create cephfs"
              command: shell
          - config:
              args:
                placement:
                  label: mds
              base_cmd_args:
                verbose: true
              command: apply
              pos_args:
                - cephfs
              service: mds
          - config:
              args:
                - "ceph osd pool create rbd"
              command: shell
          - config:
              args:
                - "rbd pool init rbd"
              command: shell
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: configure client
      desc: Configure client system
      module: test_client.py
      config:
        command: add
        id: client.1
        node: node4
        install_packages:
          - ceph-common
          - samba-client
          - cifs-utils
          - ceph-fuse
        copy_admin_keyring: true
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: Deploy samba with byok and verify keybridge service
      desc: Deploy samba with byok and verify keybridge service.
      module: smb_byok_setup.py
      polarion-id: CEPH-83627654
      config:
        file_type: yaml
        file_mount: /tmp
        spec:
          - resource_type: ceph.smb.cluster
            cluster_id: smb1
            auth_mode: user
            user_group_settings:
              - { source_type: resource, ref: ug1 }
            placement:
              label: smb
          - resource_type: ceph.smb.usersgroups
            users_groups_id: ug1
            values:
              users:
                - { name: user1, password: passwd }
              groups: [ ]
          - resource_type: ceph.smb.share
            cluster_id: smb1
            share_id: sharebyok1
            intent: present
            readonly: false
            browseable: true
            cephfs:
              volume: cephfs
              path: /
              subvolumegroup: smb-byok-grp
              subvolume: svol1
              fscrypt_key:
                scope: kmip

  - test:
      name: Verify SMB is registered in certmgr bindings with all expected certs and keys.
      desc: >
        Run certmgr bindings ls and confirm the smb service block lists all 6 expected
        certificates and 3 expected keys.
      module: test_certmgr_cert.py
      polarion-id: CEPH-83632944
      config:
        action: bindings_ls
        entity: smb
        expected_certs:
          - smb_ssl_cert
          - smb_ssl_ca_cert
          - smb_remote_control_ssl_cert
          - smb_remote_control_ca_cert
          - smb_keybridge_ssl_cert
          - smb_keybridge_ca_cert
        expected_keys:
          - smb_ssl_key
          - smb_remote_control_ssl_key
          - smb_keybridge_ssl_key

  - test:
      name: Verify certmgr cert check reports no issues for valid SMB keybridge certificates.
      desc: >
        After deploying SMB with mTLS remote_control inline certs, run certmgr cert check
        and confirm no certificate issues are reported for the SMB service.
      module: test_certmgr_cert.py
      polarion-id: CEPH-83632944
      config:
        action: check

  - test:
      name: Verify certmgr cert get retrieves the SMB keybridge SSL certificate.
      desc: >
        Retrieve smb_keybridge_ssl_cert for the SMB service using the certmgr cert get
        command and confirm a valid certificate is returned.
      module: test_certmgr_cert.py
      polarion-id: CEPH-83632944
      config:
        action: get
        scope: service
        entity: smb
        cert_name: smb_keybridge_ssl_cert

  - test:
      name: Verify certmgr cert get retrieves the SMB keybridge CA certificate.
      desc: >
        Retrieve smb_keybridge_ca_cert for the SMB service using the certmgr cert get
        command and confirm a valid certificate is returned.
      module: test_certmgr_cert.py
      polarion-id: CEPH-83632944
      config:
        action: get
        scope: service
        entity: smb
        cert_name: smb_keybridge_ca_cert

  - test:
      name: Verify certmgr key get retrieves the SMB keybridge SSL private key.
      desc: >
        Retrieve smb_keybridge_ssl_key for the SMB service using the certmgr key get
        command and confirm a valid private key is returned.
      module: test_certmgr_key.py
      polarion-id: CEPH-83632944
      config:
        action: get
        scope: service
        entity: smb
        key_name: smb_keybridge_ssl_key

  - test:
      name: Cleanup SMB cluster after certmgr validations.
      desc: Remove the SMB cluster and shares deployed for certmgr validation tests.
      module: smb_byok_cifs_operations.py
      polarion-id: CEPH-83632944
      config:
        smb_cluster_id: smb1
        smb_shares: [sharebyok1]
        byok_operation: byok_cluster_cleanup
