# Suite to validate PG Durability metrics (IBMCEPH-13887 / IBMCEPHQE-25840)
# Full-solution successor to interim rebuild counters (IBMCEPH-16254).
# Source: Durability metrics test plan (uploaded PDF).
#
# Feature:
#   last_degraded timestamp + pg_vulnerability_duration (exposure window) +
#   pg_rebuild_duration (active recovery/backfill only). Persist across OSD
#   restarts and primary handovers. Exported via Prometheus/ceph-exporter.
#
# Counter schema (recoverystate_perf):
#   pg_vulnerability_duration: {avgcount, sum, avgtime[, max_inc]}
#   pg_vulnerability_duration_min
#   pg_rebuild_duration: {avgcount, sum, avgtime[, max_inc]}
#   pg_rebuild_duration_min
#   Note: max_inc exists only when avgcount > 1 (absent after reset / single sample)
#
# Known limitations (documented):
#   - CRUSH rebalance / add OSD / autoscaler counted like failure
#   - Per-OSD metrics, not per-PG
#
# conf: conf/tentacle/rados/16-node-cluster-1-client.yaml
# Estimated run duration: 600 mins
