  # # -------------------------------------------------------------------
  # # Probe: Which events raise MGR dispatch_queue.length
  # # -------------------------------------------------------------------
  - test:
      name: MGR dispatch queue trigger comparison
      module: test_mgr_dispatch_queue_triggers.py
      abort-on-fail: false
      config:
        test_mgr_dispatch_queue_triggers: true
      desc: >
        Sustain mass-peering waves (repeat concurrent OSD stop/out + high-PG
        create/bump) to keep mgr dispatch_queue.length above threshold 5

