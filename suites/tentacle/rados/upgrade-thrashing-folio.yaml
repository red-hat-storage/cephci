  # -----------------------------------------------------------------------
  # Hop 1: Upgrade 9.0 -> 9.1 released
  #
  # Full 7-phase workflow. Staggered Phase 4 with MDS cache drain cooldowns.
  # skip_client_cleanup / skip_cluster_cleanup preserve resources for Hop 2.
  # Features requiring 9.1+ (NFS delegations, export_default)
  # stay disabled here; enabled in Hop 2.
  # -----------------------------------------------------------------------
  - test:
      name: "Hop 1: upgrade thrashing 8.1 -> 9.1"
      desc: >
        Multi-hop step 1: full 7-phase upgrade from 8.1 to 9.1 released. Sets up services, enables 8.1-available features, fills cluster, upgrades with monitoring, verifies integrity. Preserves mounts/maps for Hop 2.
      module: upgrade_thrashing.test_upgrade_thrashing.py
      abort-on-fail: true
      config:
        # =================================================================
        # IO TIER
        # =================================================================
        io_tier: saturation

        # =================================================================
        # UPGRADE TARGET & STAGGERED UPGRADE ARGS
        # =================================================================
        args:
          rhcs-version: "9.1"
          release: released
          platform: rhel-9

        # =================================================================
        # UPGRADE PARAMS
        # =================================================================
        upgrade_params:
          # IBM registry/image signature lag; not because CDN is unsigned
          relax_signature_policy: true

        skip_client_cleanup: true
        skip_cluster_cleanup: true
        mon_max_pg_per_osd: 400

        mds_config:
          fail_fs: true
          mds_cache_memory_limit: "24G"

        upgrade_phases:
          - daemon_types: "mgr,mon,crash,osd"
            cooldown_sec: 120
            cooldown_actions:
              - type: set_config
                target: mds
                configs:
                  mds_heartbeat_grace: 300
                  mds_cache_reservation: 0.95
                  mds_cache_trim_threshold: 524288
                  mds_recall_global_max_decay_threshold: 1000000
                  mds_recall_max_decay_threshold: 420715
                  mds_session_cap_acquisition_throttle: 100
                  mds_max_caps_per_client: 10000
              - type: run_command
                command: "sleep 30"
              - type: run_command
                command: "ceph tell 'mds.*' flush"
                ignore_errors: true
          - daemon_types: "mds"
            cooldown_sec: 30
            cooldown_actions:
              - type: rm_config
                target: mds
                keys:
                  - mds_heartbeat_grace
                  - mds_cache_reservation
                  - mds_cache_trim_threshold
                  - mds_recall_global_max_decay_threshold
                  - mds_recall_max_decay_threshold
                  - mds_session_cap_acquisition_throttle
                  - mds_max_caps_per_client
          - {}  # upgrade all remaining (rgw, nfs, monitoring, etc.)

        # =================================================================
        # PHASE TIMING AND THRESHOLDS
        # =================================================================
        phase_timing:
          pre_upgrade_baseline_sec: 1800
          post_upgrade_baseline_sec: 1800
          upgrade_timeout_sec: 43200
          warmup_discard_sec: 60
          stabilization_timeout_sec: 1200
          post_upgrade_stabilization_sec: 1800
          io_quiesce_sec: 30
          upgrade_stall_threshold_sec: 5400
          max_pause_retries: 3
          auto_resume_on_pause: false
          disk_warning_percent: 60
          io_kill_timeout_sec: 30
          deep_scrub_timeout_sec: 600
          cold_read_test: false
          stats_log_max_mb: 50
          crash_detail_max_chars: 500

        cephx_key_rotation:
          enabled: true
          key_type: aes256k
          rotate_admin: true
          lock_down_ciphers: true
          wipe_rotating_service_keys: true
          io_recovery_sec: 300
          # Warn-only for now (dbench can die across NFS rotate); flip to true later.
          fail_on_io_continuity: false
          timeout_sec: 7200
          wait_upgrade_complete_sec: 1800

        # =================================================================
        # PERFORMANCE REGRESSION (WARN only, never fails the test)
        # =================================================================
        performance_regression:
          iops_drop_threshold_percent: 35
          latency_increase_threshold_percent: 75
          throughput_drop_threshold_percent: 35

        # =================================================================
        # MONITORING INTERVALS
        # =================================================================
        monitoring_intervals:
          stats_sec: 5
          health_sec: 15
          daemon_counters_sec: 10
          fs_status_mds_phase_sec: 5
          fs_status_other_sec: 60
          osd_tree_sec: 30
          versions_sec: 60
          system_metrics_sec: 30
          pg_stat_sec: 30
          pool_stats_sec: 30

        # =================================================================
        # IO DROP DETECTION
        # =================================================================
        io_monitoring:
          sliding_window_sec: 60
          drop_threshold_percent: 50
          sustained_drop_sec: 30
          continuous_loss_sec: 60

        # =================================================================
        # INTEGRITY BASELINE
        # =================================================================
        integrity:
          rados_objects_per_pool: 1000
          fio_baseline_size: 1G
          verify_timeout: 1800
          pool_clean_wait_timeout: 600
          heavy_ssh_parallel: 4

        # =================================================================
        # CLUSTER PRE-FILL (Phase 2.5)
        # =================================================================
        cluster_fill:
          enabled: true
          target_percent: 10
          abort_at_percent: 65
          bg_io_max_percent: 65
          bg_io_check_interval_sec: 120
          fill_timeout_sec: 0
          poll_interval_sec: 10
          precision_threshold_pct: 5
          safety_factor: 2

        # =================================================================
        # IO TOOLS (optional when io_tier is set)
        # =================================================================
        io_tools:
          rados:
            rados_bench: true
          rbd:
            fio: true
          cephfs:
            fio: true
            smallfile: true
            mdtest: true
            dd: true
            fsstress: true
            dbench: true
            vdbench: true
          rgw:
            boto3: true
            s3cmd: true
            warp: true
          nfs:
            fio: true
            smallfile: true
            bonnie: true
            dbench: true
            vdbench: true
            cthon: true
          smb:
            smbclient: false
          nvmeof:
            fio: false

        # =================================================================
        # IO PATTERNS
        # =================================================================
        io_patterns:
          rwmixread: 70
          include_sequential_read: true
          include_small_write: true
          tail_latency_percentiles: "50:90:95:99:99.9:99.99"

        # =================================================================
        # SCALE CONFIGURATION
        # =================================================================
        # Resource count defaults come from io_tier profile.
        # Only topology values are set here; override counts to customize.
        scale:
          rbd:
            image_count: 100
            image_size: "10G"

          rgw:
            daemons_per_service: 10
            versioned_buckets: 50
            non_versioned_buckets: 50
            data_pool_pg_num: 512

          cephfs:
            filesystems:
              - cephfs1
              - cephfs2
            active_mds: 6
            mds_count_per_host: 3
            pin_policy: distributed

          nfs:
            cluster_count: 20
            daemons_per_cluster: 1
            base_port: 2049               # cluster 1=2049, then 2050+; no other NFS on these hosts
            nfs_versions:
              # - "3"
              - "4.1"
              - "4.2"
            # mounts_per_version: 2       # code default; retains root_squash coverage
            # Result: 20 clusters, 20 daemons, 80 exports, ~48 mounts/client

        # =================================================================
        # SERVICES
        # =================================================================
        disable_smb: true
        services:
          rgw: true
          rbd: true
          cephfs: true
          nfs: true
          smb: false
          nvmeof: false

        # =================================================================
        # FEATURE TOGGLES
        # =================================================================
        features:
          rados:
            ec_optimizations: true
            compression_snappy: true
            compression_zstd: true
            mclock_balanced: true
            scrub_auto_repair: true
            pool_quotas: true
            crush_device_classes: false

          cephfs:
            max_mds: true
            standby_replay: true
            subvolume_pinning: true
            quotas: true
            snapshots: true
            snap_schedule: true
            charmap: true
            dir_fragmentation: true

          rbd:
            all_image_features: true
            qos: true
            snap_clone_tree: true
            ec_data_pool: true
            luks2_encryption: true
            persistent_write_log_cache: true
            trash_purge_schedule: true
            group_snapshots: true
            namespace: true

          rgw:
            versioning: true
            lifecycle: true
            sse_s3: true
            object_lock: true
            dynamic_resharding: true
            multipart: true
            user_bucket_quotas: true
            sts_iam: true
            rate_limiting: true
            bucket_notifications: true
            bucket_policy: true

          nfs:
            qos_bandwidth: false  # IBMCEPH-18028: Cqos_Port conflict crashes co-located daemons
            qos_iops: false       # IBMCEPH-18028
            multiple_exports: true
            root_squash: true
            delegations: false
            nfsv3: false
            export_default: false
            ingress_ha: false
            ingress_virtual_ip: ""
            kerberos: false
            ldap_identity: false

          smb:
            multiple_shares: false
            readonly_share: false
            login_control_acls: false
            clustering_ctdb: false

          nvmeof:
            qos: false
            namespace_masking: false
            multi_gateway_ha: false
            discovery_controller: false
            auto_resize: false

          mgr_modules:
            verify_prometheus: true
            verify_crash: true
            verify_telemetry: true
            verify_balancer: true
            verify_pg_autoscaler: true
            verify_dashboard: true

        # =================================================================
        # NFS GRACE VALIDATION (IBMCEPH-17685 prep; baseline=WARN, strict=FAIL)
        # =================================================================
        nfs_grace_validation:
          enabled: true
          mode: baseline
          max_observed_grace_sec: 120

        # =================================================================
        # BUG VALIDATION TOGGLES
        # =================================================================
        bug_validations:
          a1_mds_clientreplay: true
          a1_threshold_sec: 240
          a2_mds_stopping: true
          a2_threshold_sec: 600
          a3_health_err: true
          a4_nfs_crash: true
          a5_require_osd_release: true
          a6_cephadm_refresh_failed: true
          a7_daemon_old_version: true
          a8_upgrade_stuck: true
          a8_stall_threshold_sec: 5400
          a9_cephfs_client_crash: true
          a10_osd_activation: true
          a11_mgr_crash: true
          a12_ec_scrub_errors: true
          a13_nvmeof_gateway_failure: true
          a14_mgr_snaprealm_crash: true
          a15_mgr_module_import: true
          a16_nfs_redeploy_failure: true
          a17_smb_all_down: false
          a18_nvmeof_gw_startup: true
          a19_cephadm_grace_tool: true
          a20_osd_markdown_shutdown: true
          a21_upgrade_health_err: true
          a24_grace_metrics: true
