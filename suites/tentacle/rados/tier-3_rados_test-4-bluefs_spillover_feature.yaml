# Suite is to be used to verify the Bluefs spillover feature on 4 nodes
# to be run in regression conf: 4-node-ec-cluster-1-client.yaml
tests:
  - test:
      name: setup install pre-requisistes
      desc: Setup phase to deploy the required pre-requisites for running the tests.
      module: install_prereq.py
      abort-on-fail: true

  - test:
      name: cluster deployment
      desc: Execute the cluster deployment workflow.
      module: test_cephadm.py
      abort-on-fail: true
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              base_cmd_args:
                verbose: true
              args:
                mon-ip: node1
  - test:
      name: Add host
      desc: Add new host node with IP address
      module: test_host.py
      config:
        command: add_hosts
        service: host
        args:
          nodes:
            - node1
            - node2
            - node3
            - node4
          attach_ip_address: true
          labels: apply-all-labels
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: Mgr and Mon deployment
      desc: Add Mgr and Mon daemons
      module: test_cephadm.py
      polarion-id: CEPH-83573746
      abort-on-fail: true
      config:
        steps:
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon

  - test:
      name: OSD deployment
      desc: Add OSD services using spec file.
      module: test_cephadm.py
      polarion-id: CEPH-83573746
      abort-on-fail: true
      config:
        steps:
          - config:
              command: apply_spec
              service: orch
              validate-spec-services: true
              specs:
                - service_type: osd
                  service_id: osd_spec_non_collocated
                  placement:
                    host_pattern: '*'
                  spec:
                    data_devices:
                      paths:
                        - /dev/vdb
                        - /dev/vdc
                        - /dev/vdd
                        - /dev/vde
                        - /dev/vdf
                    db_devices:
                      paths:
                         - /dev/vdg
                    block_db_size: '2G'

  - test:
      name: MDS Service deployment with spec
      desc: Add MDS services using spec file
      module: test_cephadm.py
      polarion-id: CEPH-83574728
      config:
        steps:
          - config:
              command: shell
              args:               # arguments to ceph orch
                - ceph
                - fs
                - volume
                - create
                - cephfs
          - config:
              command: apply_spec
              service: orch
              validate-spec-services: true
              specs:
                - service_type: mds
                  service_id: cephfs
                  placement:
                    label: mds
          # Adding below WA to set bulk flag to false until bug fix : 2308623
          - config:
              command: shell
              args: # arguments to ceph orch
                - "ceph osd pool set cephfs.cephfs.data bulk false"

  - test:
      name: RGW Service deployment
      desc: RGW Service deployment
      module: test_cephadm.py
      polarion-id: CEPH-83574728
      config:
        steps:
          - config:
              command: apply
              service: rgw
              pos_args:
                - rgw.1
              args:
                placement:
                  label: rgw

  - test:
      name: Configure client admin
      desc: Configures client admin node on cluster
      module: test_client.py
      polarion-id:  CEPH-83573758
      abort-on-fail: true
      config:
        command: add
        id: client.1                      # client Id (<type>.<Id>)
        node: node6                     # client node
        install_packages:
          - ceph-common
        copy_admin_keyring: true          # Copy admin keyring to node
        caps:                             # authorize client capabilities
          mon: "allow *"
          osd: "allow *"
          mds: "allow *"
          mgr: "allow *"

  - test:
      name: Enable logging to file
      module: rados_prep.py
      config:
        log_to_file: true
      desc: Change config options to enable logging to file

  - test:
      name: Case 1 - BlueFS spillover feature validation
      desc: Verify BlueFS spillover warning and spillover cleaner behavior
      module: test_bluefs_spillover_feature.py
      config:
        case_to_run:
          - case1
        pool_name: test_pool
        pool_config:
          pg_num: 128
        rados_write_duration: 600
        byte_size: 4096
        spillover_timeout: 900
        cleaner_timeout: 900
        poll_interval: 10
        bluefs_spillover_idle_time: 3

  - test:
      name: Case 2 - BlueFS spillover idle time validation
      desc: Verify bluefs_spillover_idle_time using migrated OSD log timestamps
      module: test_bluefs_spillover_feature.py
      config:
        case_to_run:
          - case2
        pool_name: test_pool_case2
        pool_config:
          pg_num: 128
        rados_write_duration: 600
        byte_size: 4096
        spillover_timeout: 900
        cleaner_timeout: 900
        health_ok_timeout: 900
        poll_interval: 10
        post_action_wait: 10
        bluefs_spillover_idle_time: 15
        debug_bluefs: 10/10

  - test:
      name: Case 3 - BlueFS spillover idle time validation (100s)
      desc: Verify bluefs_spillover_idle_time=100 using migrated OSD log timestamps
      module: test_bluefs_spillover_feature.py
      config:
        case_to_run:
          - case3
        pool_name: test_pool_case3
        pool_config:
          pg_num: 128
        rados_write_duration: 600
        byte_size: 4096
        spillover_timeout: 900
        cleaner_timeout: 900
        health_ok_timeout: 900
        poll_interval: 10
        post_action_wait: 10
        bluefs_spillover_idle_time: 100
        debug_bluefs: 10/10

  - test:
      name: Case 4 - BlueFS spillover cleaner work ratio validation
      desc: >
        Create single-PG pool, verify default work_ratio=0.1, then collect
        work_ratio/runtime_ms/sleep_ms from acting OSD logs for default 0.1
        and 0.9 phases
      module: test_bluefs_spillover_feature.py
      config:
        case_to_run:
          - case4
        pool_name: test_pool_case4
        pool_config:
          pg_num: 1
          pg_num_min: 1
          disable_pg_autoscale: true
        rados_write_duration: 600
        byte_size: 4096
        spillover_timeout: 900
        cleaner_timeout: 900
        health_ok_timeout: 900
        poll_interval: 10
        post_action_wait: 10
        pool_settle_wait: 15
        debug_osd: 20/20
        debug_bluefs: 20/20
        bluefs_spillover_idle_time: 10
        work_ratio_phases:
          - 0.9

  - test:
      name: Case 5 - BlueFS spillover idle time cleaner stats validation
      desc: Verify cleaner stats remain unchanged when idle_time is modified with no migrations
      module: test_bluefs_spillover_feature.py
      config:
        case_to_run:
          - case5
        pool_name: test_pool_case5
        pool_config:
          pg_num: 128
        rados_write_duration: 600
        byte_size: 4096
        spillover_timeout: 900
        cleaner_timeout: 900
        poll_interval: 10
        idle_time_phase1: 20
        idle_time_phase2: 10

  - test:
      name: Case 6 - BlueFS spillover on pool acting set only
      desc: >
        Create single-PG pool, apply force_slow/cleaner only on acting OSDs,
        verify spillover is acting-set scoped, persists across one OSD restart,
        then clears after enabling cleaner and restarting an acting OSD
      module: test_bluefs_spillover_feature.py
      config:
        case_to_run:
          - case6
        pool_name: test_pool_case6
        pool_config:
          pg_num: 1
          pg_num_min: 1
          disable_pg_autoscale: true
        rados_write_duration: 600
        byte_size: 4096
        spillover_timeout: 900
        cleaner_timeout: 900
        poll_interval: 10
        pool_settle_wait: 15
        osd_restart_timeout: 300

  - test:
      name: Case 7 - BlueFS spillover cleaner slow entry validation
      desc: >
        Generate spillover, enable cleaner, wait for HEALTH_OK, verify cleaner
        stats have no slow entries (spillover must remain reported if any do),
        disable cleaner, and verify slow cleaner-stat files are absent from
        bluefs files list
      module: test_bluefs_spillover_feature.py
      config:
        case_to_run:
          - case7
        pool_name: test_pool_case7
        case7_iterations: 3
        pool_config:
          pg_num: 128
        rados_write_duration: 600
        byte_size: 4096
        spillover_timeout: 900
        cleaner_timeout: 900
        health_ok_timeout: 900
        poll_interval: 10

