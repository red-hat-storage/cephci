#===============================================================================================
# Regional File Mount / Virtual Server — Multi Share Export (OCP Virt)
# Conf: conf/tentacle/nfs/virtual-server-ocpvirt.yaml
#
# Requires Ceph build with: ceph nfs cluster create ... --enable-virtual-server
# Dual Multus: --custom-config ocpvirt_networks=ceph-public,bridge-504
# Lean root:   --custom-config ocpvirt_root_disk_size=40Gi
#
# Manual run:
#   python run.py --cloud ocpvirt \
#     --suite suites/tentacle/nfs/tier-1-nfs-virtual-server-multi-share-export-ocpvirt.yaml \
#     --global-conf conf/tentacle/nfs/virtual-server-ocpvirt.yaml \
#     --custom-config ocpvirt_namespace=rdu3_ceph_sys_test \
#     --custom-config ocpvirt_networks=ceph-public,bridge-504 \
#     --custom-config ocpvirt_root_disk_size=40Gi \
#     --rhbuild 9.2 --build stable --platform rhel-10
#===============================================================================================
tests:
  - test:
      abort-on-fail: true
      desc: Install software pre-requisites for cluster deployment.
      module: install_prereq.py
      name: setup pre-requisites

  - test:
      abort-on-fail: true
      config:
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              args:
                - "ceph fs volume create cephfs"
              command: shell
          - config:
              args:
                placement:
                  label: mds
              base_cmd_args:
                verbose: true
              command: apply
              pos_args:
                - cephfs
              service: mds
      desc: Bootstrap cluster and deploy CephFS for virtual-server NFS tests.
      destroy-cluster: false
      module: test_cephadm.py
      name: Deploy cluster using cephadm

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.1
        node: node4
        install_packages:
          - ceph-common
          - nfs-utils
        copy_admin_keyring: true
      desc: Configure NFS client node4
      destroy-cluster: false
      module: test_client.py
      name: configure client 1

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.2
        node: node5
        install_packages:
          - ceph-common
          - nfs-utils
        copy_admin_keyring: true
      desc: Configure NFS client node5
      destroy-cluster: false
      module: test_client.py
      name: configure client 2

  - test:
      name: Virtual Server single export single client multi-route
      module: regional_mount.nfs_virtual_server_single_export_single_client.py
      desc: Scenario 1 — one export, one client, mount and IO on each network route
      polarion-id: CEPH-83632430
      abort-on-fail: false
      config:
        nfs_version: 4.2
        port: 2049
        clients: 1
        min_routes: 2
        sudo: false

  - test:
      name: Virtual Server single export multi client
      module: regional_mount.nfs_virtual_server_single_export_multi_client.py
      desc: Scenario 2 — one export, each client mounts via a different route
      polarion-id: CEPH-83632431
      abort-on-fail: false
      config:
        nfs_version: 4.2
        port: 2049
        clients: 2
        min_routes: 2
        sudo: false

  - test:
      name: Virtual Server multi export multi client
      module: regional_mount.nfs_virtual_server_multi_export_multi_client.py
      desc: Scenario 3 — multiple exports, each client uses a distinct route
      polarion-id: CEPH-83632432
      abort-on-fail: false
      config:
        nfs_version: 4.2
        port: 2049
        clients: 2
        export_num: 2
        min_routes: 2
        sudo: false

  - test:
      name: Virtual Server export fencing single client
      module: regional_mount.nfs_virtual_server_export_fencing_single_client.py
      desc: Scenario 4 — Server_Addrs and CLIENT fencing on single client
      polarion-id: CEPH-83632433
      abort-on-fail: false
      config:
        nfs_version: 4.2
        port: 2049
        clients: 1
        min_routes: 2
        sudo: false
        comments: fails due to IBMCEPH-13896

  - test:
      name: Virtual Server export fencing multi client
      module: regional_mount.nfs_virtual_server_export_fencing_multi_client.py
      desc: Scenario 5 — fence one export; other export remains multi-route
      polarion-id: CEPH-83632434
      abort-on-fail: false
      config:
        nfs_version: 4.2
        port: 2049
        clients: 2
        export_num: 2
        min_routes: 2
        sudo: false
        comments: fails due to IBMCEPH-13896

  - test:
      name: Virtual Server disable and re-enable toggle
      module: regional_mount.nfs_virtual_server_toggle.py
      desc: Scenario 6 — IBMCEPH-11530 orch apply + reconfig toggle (VS8–VS11)
      abort-on-fail: false
      config:
        nfs_version: 4.2
        port: 2049
        clients: 1
        min_routes: 2
        sudo: false
        run_vs11: true
        comments: IBMCEPH-11530

  - test:
      name: Virtual Server second toggle cycle
      module: regional_mount.nfs_virtual_server_lifecycle.py
      desc: Scenario 7 / TC-VS12 — two disable/re-enable cycles; daemon count stable
      polarion-id: CEPH-83633234
      abort-on-fail: false
      config:
        nfs_version: 4.2
        port: 2049
        clients: 1
        min_routes: 2
        sudo: false
        tc: VS12
        comments: IBMCEPH-11530

  - test:
      name: Virtual Server multi-daemon conf agrees
      module: regional_mount.nfs_virtual_server_lifecycle.py
      desc: Scenario 7 / TC-VS13 — Virtual_Server value agrees on all NFS daemons
      polarion-id: CEPH-83633235
      abort-on-fail: false
      config:
        nfs_version: 4.2
        port: 2049
        clients: 1
        min_routes: 2
        sudo: false
        tc: VS13
        comments: IBMCEPH-11530

  - test:
      name: Virtual Server invalid enable_virtual_server recovers
      module: regional_mount.nfs_virtual_server_lifecycle.py
      desc: Scenario 7 / TC-VS14 — orch accepts bad value; restore recovers mount
      polarion-id: CEPH-83633236
      abort-on-fail: false
      config:
        nfs_version: 4.2
        port: 2049
        clients: 1
        min_routes: 2
        sudo: false
        tc: VS14
        comments: IBMCEPH-11530

  - test:
      name: Virtual Server redeploy preserves disable
      module: regional_mount.nfs_virtual_server_lifecycle.py
      desc: Scenario 7 / TC-VS15 — orch redeploy keeps Virtual_Server=false
      polarion-id: CEPH-83633237
      abort-on-fail: false
      config:
        nfs_version: 4.2
        port: 2049
        clients: 1
        min_routes: 2
        sudo: false
        tc: VS15
        comments: IBMCEPH-11530
