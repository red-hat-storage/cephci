#===============================================================================================
#---    Test Suite for NFS-Ganesha CephX Key Rotation   ---
#---    IBMCEPH-16471 / IBMCEPH-16399                    ---
#---    Polarion: CEPH-83632951                          ---
#----------------------------------------------------------
# Conf: conf/tentacle/nfs/1admin-3node-1client.yaml
#
# What this suite tests:
#   ceph nfs cluster rotate-key (9.1z2 fix verification):
#     Run the one-shot rotate-key command while the client stays mounted.
#     Assert JSON (rotated, service_redeployed=true, updated_exports),
#     that CephX key values change, Ganesha logs stay clean, and IO on
#     the existing mount still works without unmount/remount or
#     ceph nfs export apply.
#
#===============================================================================================
tests:
  - test:
      abort-on-fail: true
      desc: Install software pre-requisites for cluster deployment.
      module: install_prereq.py
      name: setup pre-requisites

  - test:
      abort-on-fail: true
      config:
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              args:
                - "ceph fs volume create cephfs"
              command: shell
          - config:
              args:
                placement:
                  label: mds
              base_cmd_args:
                verbose: true
              command: apply
              pos_args:
                - cephfs
              service: mds
      desc: Bootstrap and deploy services.
      destroy-cluster: false
      module: test_cephadm.py
      name: Deploy cluster using cephadm

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.1
        node: node4
        install_packages:
          - ceph-common
          - nfs-utils
        copy_admin_keyring: true
      desc: Configure the NFS client node
      destroy-cluster: false
      module: test_client.py
      name: configure client

  - test:
      name: NFS CephX key rotation (ceph nfs cluster rotate-key)
      module: test_nfs_cephx_key_rotation.py
      desc: >
        Verify IBMCEPH-16471 / 9.1z2: run ceph nfs cluster rotate-key while
        the NFS export stays mounted. Assert keys change, JSON shows
        service_redeployed=true and updated_exports, Ganesha logs stay
        clean, and the same mount can still read/write without remount
        or ceph nfs export apply.
      polarion-id: CEPH-83632951
      abort-on-fail: false
      config:
        nfs_version: "4.1"
        clients: 1
