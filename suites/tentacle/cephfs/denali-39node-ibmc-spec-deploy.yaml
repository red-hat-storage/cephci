- test:
    name: Verify labels and deploy control plane
    desc: Verify labels and deploy control plane
    module: test_denali_10node_specs.py
    abort-on-fail: true
    destroy-cluster: false
    config:
      action: control
      expected_hosts: *id001
      specs:
      - service_type: mgr
        placement:
          count_per_label: 1
          labels:
          - mgr_z1
          - mgr_z2
          - mgr_z3
      - service_type: mon
        placement:
          count_per_label: 1
          labels:
          - mon_z1
          - mon_z2
          - mon_z3
- test:
    name: Apply OSD drive group spec
    desc: Apply OSD drive group spec
    module: test_denali_10node_specs.py
    abort-on-fail: true
    destroy-cluster: false
    config:
      action: osd
      expected_hosts: *id001
      specs:
      - service_type: osd
        service_id: nvme
        placement:
          label: osds
        spec:
          data_devices:
            all: true
          filter_logic: AND
          method: raw
          objectstore: bluestore
          termination_grace_period_seconds: 30
          crush_device_class: ssd
- test:
    name: Create and validate zone CRUSH rule
    desc: Create and validate zone CRUSH rule
    module: test_denali_10node_specs.py
    abort-on-fail: true
    destroy-cluster: false
    config:
      action: crush
      crush_rule: &id003
        name: replicated_zone
        root: default
        failure_domain: zone
- test:
    name: Apply cluster tunables
    desc: Apply cluster tunables
    module: test_denali_10node_specs.py
    abort-on-fail: true
    destroy-cluster: false
    config:
      action: settings
      settings:
        global:
          log_to_file: true
          log_to_stderr: false
          mon_cluster_log_to_file: true
          mon_cluster_log_to_stderr: false
        mds:
          mds_cache_memory_limit: 34359738368
        osd:
          osd_memory_target_autotune: true
        mgr:
          mgr/cephadm/cephadm_log_destination: file
          mgr/cephadm/container_init: true
          mgr/dashboard/ssl_server_port: 8443
- test:
    name: Create pools and apply zone CRUSH rule
    desc: Create pools and apply zone CRUSH rule
    module: test_denali_10node_specs.py
    abort-on-fail: true
    destroy-cluster: false
    config:
      action: pools
      pools: &id002
      - name: .mgr
        type: replicated
        size: 3
        min_size: 2
        crush_rule: replicated_zone
        pg_num: 1
        pg_autoscale_mode: 'on'
        flags: hashpspool
        options:
          pg_num_max: 32
          pg_num_min: 1
        application_metadata:
          mgr: {}
      - name: denalifs-meta
        type: replicated
        size: 3
        min_size: 2
        crush_rule: replicated_zone
        pg_num: 2048
        pg_autoscale_mode: 'on'
        flags: hashpspool,bulk
        options:
          pg_autoscale_bias: 4
          pg_num_min: 16
          recovery_priority: 5
        application_metadata:
          cephfs:
            metadata: denalifs
      - name: denalifs-data
        type: replicated
        size: 3
        min_size: 2
        crush_rule: replicated_zone
        pg_num: 1024
        pg_autoscale_mode: 'on'
        flags: hashpspool,selfmanaged_snaps,bulk
        options: {}
        application_metadata:
          cephfs:
            data: denalifs
      - name: .nfs
        type: replicated
        size: 3
        min_size: 2
        crush_rule: replicated_zone
        pg_num: 32
        pg_autoscale_mode: 'on'
        flags: hashpspool
        options: {}
        application_metadata:
          nfs: {}
- test:
    name: Validate pool rules and PG zone distribution
    desc: Validate pool rules and PG zone distribution
    module: test_denali_10node_specs.py
    abort-on-fail: true
    destroy-cluster: false
    config:
      action: pg_zones
      pools: *id002
      expected_hosts: *id001
- test:
    name: Create CephFS with explicit pools
    desc: Create CephFS with explicit pools
    module: test_denali_10node_specs.py
    abort-on-fail: true
    destroy-cluster: false
    config:
      action: filesystem
      filesystem:
        name: denalifs
        metadata_pool: denalifs-meta
        data_pools:
        - denalifs-data
        max_mds: 24
        standby_count_wanted: 1
        allow_standby_replay: true
        balance_automate: false
        max_file_size: 1099511627776
- test:
    name: Apply MDS spec and filesystem rank settings
    desc: Apply MDS spec and filesystem rank settings
    module: test_denali_10node_specs.py
    abort-on-fail: true
    destroy-cluster: false
    config:
      action: mds
      specs:
      - service_type: mds
        service_id: denalifs
        placement:
          count_per_host: 4
          label: mds
      filesystem:
        name: denalifs
        metadata_pool: denalifs-meta
        data_pools:
        - denalifs-data
        max_mds: 24
        standby_count_wanted: 1
        allow_standby_replay: true
        balance_automate: false
        max_file_size: 1099511627776
      expected_mds: 48
