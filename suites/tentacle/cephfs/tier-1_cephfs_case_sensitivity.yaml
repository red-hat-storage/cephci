---
#===============================================================================================
# Tier-level: 1
# Test-Suite: tier-1_cephfs_case_sensitivity
# Conf file : conf/squid/cephfs/tier-1_cephfs_smb_nfs.yaml
# Test-Case Covered:
# CEPH-83606639 Verify Case Sensitivity Functionality
# CEPH-83632953 Casefold subvolume multi-MDS failover (IBMCEPH-16942 / #72399)
#===============================================================================================
tests:
  - test:
      abort-on-fail: true
      desc: "Setup phase to deploy the required pre-requisites for running the tests."
      module: install_prereq.py
      name: "setup install pre-requisistes"
  - test:
      name: cluster deployment
      desc: Execute the cluster deployment workflow.
      module: test_cephadm.py
      polarion-id:
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              base_cmd_args:
                verbose: true
              args:
                mon-ip: node1
                orphan-initial-daemons: true
                skip-monitoring-stack: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
      destroy-cluster: false
      abort-on-fail: true
  - test:
      abort-on-fail: true
      config:
        command: add
        copy_admin_keyring: true
        id: client.1
        install_packages:
          - ceph-common
          - ceph-fuse
          - samba-client
          - cifs-utils
        node: node8
      desc: "Configure the Cephfs client system 1"
      destroy-cluster: false
      module: test_client.py
      name: "configure client"
  - test:
      abort-on-fail: true
      config:
        command: add
        copy_admin_keyring: true
        id: client.2
        install_packages:
          - ceph-common
          - ceph-fuse
          - samba-client
          - cifs-utils
        node: node9
      desc: "Configure the Cephfs client system 2"
      destroy-cluster: false
      module: test_client.py
      name: "configure client"
  - test:
      abort-on-fail: true
      config:
        command: add
        copy_admin_keyring: true
        id: client.3
        install_packages:
          - ceph-common
          - ceph-fuse
          - samba-client
          - cifs-utils
        node: node10
      desc: "Configure the Cephfs client system 3"
      destroy-cluster: false
      module: test_client.py
      name: "configure client"
  - test:
      abort-on-fail: true
      config:
        command: add
        copy_admin_keyring: true
        id: client.4
        install_packages:
          - ceph-common
          - ceph-fuse
          - samba-client
          - cifs-utils
        node: node11
      desc: "Configure the Cephfs client system 4"
      destroy-cluster: false
      module: test_client.py
      name: "configure client"
  - test:
      name: test cephfs attributes - functional
      module: cephfs_case_sensitivity.case_sensitivity_functional.py
      polarion-id: CEPH-83606639
      desc: Test fs attributes for functional use case
      abort-on-fail: false
  - test:
      name: test cephfs attributes - negative
      module: cephfs_case_sensitivity.case_sensitivity_negative.py
      polarion-id: CEPH-83611927
      desc: Test fs attributes for negative use case
      abort-on-fail: false
  - test:
      name: test cephfs attributes - disruptive
      module: cephfs_case_sensitivity.case_sensitivity_disruptive.py
      polarion-id: CEPH-83611928
      desc: Test fs attributes for disruptive use case
      abort-on-fail: false
  - test:
      name: test cephfs attributes - subvolume
      module: cephfs_case_sensitivity.case_sensitivity_subvolume.py
      polarion-id: CEPH-83617010
      desc: Test fs attributes for functional use case
      abort-on-fail: false
  - test:
      name: casefold subvolume multi-mds failover journal replay
      module: cephfs_case_sensitivity.case_sensitivity_multimds_failover.py
      polarion-id: CEPH-83632953
      desc: >
        Case-insensitive subvolume under max_mds>=4 with rename-heavy FUSE metadata
        I/O; rotate mds fail across ranks mid-IO; verify no alternate_name journal
        replay or rejoin auth crashes; max_mds scale-up under load (IBMCEPH-16942).
      abort-on-fail: true
      config:
        max_mds: 4
        fail_iterations: 10
        fail_ranks: [0, 1, 2, 3]
        storm_warmup_sec: 180
        post_fail_sleep_sec: 5
        health_wait: 300
        mds_placement_count: 4
        subvol_group: cs_mm_repro
        subvol_name: casefold_sv
        run_max_mds_scaleup: true
