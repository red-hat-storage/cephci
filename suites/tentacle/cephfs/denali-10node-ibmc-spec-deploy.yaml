- test:
    name: Create and validate zone CRUSH rule
    desc: Create and validate zone CRUSH rule
    module: test_denali_10node_specs.py
    abort-on-fail: true
    destroy-cluster: false
    config:
      action: crush
      crush_rule: &id002
        name: replicated_zone
        root: default
        failure_domain: zone
- test:
    name: Create pools and apply zone CRUSH rule
    desc: Create pools and apply zone CRUSH rule
    module: test_denali_10node_specs.py
    abort-on-fail: true
    destroy-cluster: false
    config:
      action: pools
      pools: &id001
      - name: .mgr
        type: replicated
        size: 3
        min_size: 2
        crush_rule: replicated_zone
        pg_num: 1
        pg_autoscale_mode: 'off'
        flags: hashpspool
        options:
          pg_num_max: 32
          pg_num_min: 1
        application_metadata:
          mgr: {}
      - name: denalifs-meta
        type: replicated
        size: 3
        min_size: 2
        crush_rule: replicated_zone
        pg_num: 64
        pg_autoscale_mode: 'off'
        flags: hashpspool,bulk
        options:
          pg_autoscale_bias: 4
          pg_num_min: 16
          recovery_priority: 5
        application_metadata:
          cephfs:
            metadata: denalifs
      - name: denalifs-data
        type: replicated
        size: 3
        min_size: 2
        crush_rule: replicated_zone
        pg_num: 64
        pg_autoscale_mode: 'off'
        flags: hashpspool,selfmanaged_snaps,bulk
        options: {}
        application_metadata:
          cephfs:
            data: denalifs
      - name: .nfs
        type: replicated
        size: 3
        min_size: 2
        crush_rule: replicated_zone
        pg_num: 8
        pg_autoscale_mode: 'off'
        flags: hashpspool
        options: {}
        application_metadata:
          nfs: {}
