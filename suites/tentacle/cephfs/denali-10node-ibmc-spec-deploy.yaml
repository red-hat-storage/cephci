- test:
    name: Apply monitoring service specs
    desc: Apply monitoring service specs
    module: test_denali_10node_specs.py
    abort-on-fail: true
    destroy-cluster: false
    config:
      action: services
      specs:
      - service_type: alertmanager
        placement:
          count: 1
        spec:
          certificate_source: cephadm-signed
          ssl: true
      - service_type: alloy
        placement:
          host_pattern: '*'
      - service_type: ceph-exporter
        placement:
          host_pattern: '*'
        spec:
          certificate_source: cephadm-signed
          prio_limit: 5
          ssl: true
          stats_period: 5
      - service_type: crash
        placement:
          host_pattern: '*'
      - service_type: grafana
        placement:
          count: 1
          label: mgr
        spec:
          anonymous_access: true
          certificate_source: cephadm-signed
          protocol: https
          ssl: true
      - service_type: loki
        placement:
          count: 1
      - service_type: node-exporter
        placement:
          host_pattern: '*'
        spec:
          certificate_source: cephadm-signed
          ssl: true
      - service_type: prometheus
        placement:
          count: 1
        spec:
          certificate_source: cephadm-signed
          ssl: true
