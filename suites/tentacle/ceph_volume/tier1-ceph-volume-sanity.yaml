#===============================================================================================
# Test Suite: Test ceph-volume sanity
#
# Conf: conf/tentacle/ceph_volume/1admin-4node-1client-ceph-volume.yaml
#
# Setup:
#   - Bootstrap
#   - Host management
#   - Ceph role service deployment
#
# Test cases:
#   - Test validate ceph-volume sanity
#===============================================================================================
tests:
  - test:
      name: setup install pre-requisistes
      desc: Setup phase to deploy the required pre-requisites for running the tests.
      module: install_prereq.py
      abort-on-fail: true

  - test:
      abort-on-fail: true
      config:
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
      desc: bootstrap without OSDs
      destroy-cluster: false
      polarion-id: CEPH-83573713
      module: test_cephadm.py
      name: Deploy cluster using cephadm

  - test:
      name: Validate ceph-volume sanity
      desc: Verify OSD creation using ceph-volume utility
      polarion-id: CEPH-11378
      module: test_ceph_volume_sanity.py

  - test:
      name: Validate successful ceph-volume create
      desc: Create an OSD, verify its device mapping and I/O, and reclaim the disk
      module: test_ceph_volume_sanity.py
      abort-on-fail: true
      config:
        operation: create
        reboot: false

  - test:
      name: Validate inventory metadata and device filtering
      desc: Check plain and JSON inventory on bootstrap and non-bootstrap hosts
      module: test_ceph_volume_get_inventory_list.py
      polarion-id: CEPH-83591998
      config: {}
