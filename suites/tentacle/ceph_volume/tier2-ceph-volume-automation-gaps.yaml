---
# Conf: conf/tentacle/ceph_volume/1admin-3osd-1client-ceph-volume-gaps.yaml
# Select a release from the official IBM stable manifest, for example:
# --product ibm --release 9.0 --build stable --custom-config ibm-build=True
# For 9.0 or 9.2, provide access to the manifest-selected image registry and
# matching Tools repository through the runner's normal configuration.
# Supply bootstrap-ssh-private-key and bootstrap-ssh-public-key via
# --custom-config
# for the installer key files generated by cluster setup for root SSH access.
# Use a fresh disposable cluster and an 8 GB VM flavor.
# CLI validation precedes disk preparation. DB allocation precedes redeployment.
tests:
  - test:
      name: Install prerequisites
      desc: Prepare the disposable ceph-volume cluster
      module: install_prereq.py
      abort-on-fail: true

  - test:
      name: Bootstrap ceph-volume regression cluster
      desc: Deploy monitors and managers without consuming OSD devices
      module: test_cephadm_bootstrap.py
      abort-on-fail: true
      destroy-cluster: false
      config:
        bootstrap:
          mon-ip: node1
          ssh-user: root
          skip-dashboard: true
          skip-monitoring-stack: true
          config:
            file_type: ini
            osd: osd_memory_target=1073741824 osd_memory_target_autotune=false
          apply-spec:
            file_type: yaml
            spec:
              - service_type: host
                hostname: node1
                addr: node1
                labels:
                  - osd
                  - _admin
              - service_type: host
                hostname: node2
                addr: node2
                labels:
                  - osd
                  - _admin
              - service_type: host
                hostname: node3
                addr: node3
                labels:
                  - osd
                  - _admin
              - service_type: mon
                placement:
                  hosts:
                    - node1
                    - node2
                    - node3
              - service_type: mgr
                placement:
                  hosts:
                    - node1
                    - node2

  - test:
      name: Install local cephadm on the second OSD host
      desc: Provide the CLI used by checked local inventory and LVM queries
      module: exec.py
      abort-on-fail: true
      config: &local_cephadm
        role: osd
        idx: 1
        sudo: true
        long_running: true
        check_status: true
        commands:
          - dnf install -y --nogpgcheck cephadm

  - test:
      name: Install local cephadm on the third OSD host
      desc: Provide the CLI used by checked local inventory and LVM queries
      module: exec.py
      abort-on-fail: true
      config:
        <<: *local_cephadm
        idx: 2

  - test:
      name: Reject invalid ceph-volume LVM arguments
      desc: >-
        Require failed commands with actionable device and OSD validation errors
      module: test_ceph_volume_lvm_cli_validations.py
      polarion-id: CEPH-11764
      config:
        device_path: /dev/cephci-nonexistent-device
        osd_id: "2147483647"
        osd_fsid: 00000000-0000-0000-0000-000000000000

  - test:
      name: Validate ceph-volume lifecycle across reboot
      desc: Prepare, activate, deactivate, and zap a disposable disk
      module: test_ceph_volume_sanity.py
      polarion-id: CEPH-11378
      abort-on-fail: true

  - test:
      name: Validate requested DB LV sizes on every data device
      desc: Reproduce BZ 2185588 and verify actual LV bytes for all new OSDs
      module: test_ceph_volume_wrong_db_size_compute.py
      polarion-id: CEPH-83575599
      abort-on-fail: true
      config:
        create_volumes: false
        timeout: 600
        service_ids:
          node0: ceph-volume-db-node1
          node1: ceph-volume-db-node2
          node2: ceph-volume-db-node3
        specs:
          service_type: osd
          service_id: ceph-volume-db
          placement:
            hosts:
              - node0
              - node1
              - node2
          block_db_size: 12G

  - test:
      name: Validate dedicated DB devices after single OSD replacement
      desc: Reproduce BZ 2119715 and reject colocated replacement OSDs
      module: test_ceph_volume_non_collocated.py
      polarion-id: CEPH-83575597
      abort-on-fail: true
      config:
        reuse_existing_devices: true
        spec: &db_service
          service_type: osd
          service_id: ceph-volume-db-node1
          placement:
            hosts:
              - node0
          spec:
            block_db_size: 12G

  - test:
      name: Validate dedicated DB devices after full host OSD replacement
      desc: >-
        Reproduce BZ 2187348 and verify every replacement data and DB mapping
      module: test_ceph_volume_redeploy.py
      polarion-id: CEPH-83575600
      config:
        create_volumes: false
        reuse_existing_devices: true
        osd_count: 4
        spec: *db_service

  - test:
      name: Validate plain and JSON inventory using the tested build
      desc: Reproduce BZ 1977888 on bootstrap and non-bootstrap hosts
      module: test_ceph_volume_get_inventory_list.py
      polarion-id: CEPH-83591998

  - test:
      name: Validate inventory with hidden thin-pool LVs
      desc: Reproduce IBMCEPH-13408 with a verified disposable thin-pool fixture
      module: test_ceph_volume_inventory_thin_lvm.py
      config:
        fixture_type: thin-pool

  - test:
      name: Validate inventory with hidden RAID1 mirror LVs
      desc: >-
        Reproduce IBMCEPH-16294 with verified internal RAID metadata and image
        LVs
      module: test_ceph_volume_inventory_thin_lvm.py
      config:
        fixture_type: raid1
