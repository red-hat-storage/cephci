  # Orch-spec cnc_enable — same ANA
  - test:
      abort-on-fail: true
      config:
        gw_nodes:
          - node4
          - node5
        rbd_pool: rbd
        nvme_metadata_pool: rbd
        gw_group: gw_group1
        install: true
        spec_deployment: true
        skip_cnc_rpc_config: true
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        operation: spec_cnc_enable_perf
        rebalance_period: true
        rebalance_period_sec: 0
        ana_affinity: same
        copy_count: 500
        copy_blocks: 8192
        min_speedup: 1.0
        redeploy_wait_sec: 60
        enable_cnc_logging: true
        verify_xcopy_logs: true
        nvmeof_spec:
          cnc_enable: true
          cnc_rate_limiter_bytes: 400000000
          cnc_chunk_blocks: 512
          cnc_parallel_chunks: 8
        cleanup:
          - subsystems
          - initiators
          - disconnect_all
          - pool
          - gateway
        subsystems:
          - nqn: nqn.2016-06.io.spdk:cnode1
            serial: 1
            bdevs:
              - count: 2
                size: 10G
                ns_create_image: true
                lb_group: node4
              - count: 2
                size: 10G
                ns_create_image: true
                lb_group: node5
            listeners:
              - node4
              - node5
            listener_port: 4420
            allow_host: "*"
        initiators:
          - nqn: connect-all
            listener_port: 4420
            node: node7
      desc: >
        Orch-spec cnc_enable CNC vs host R_W; src/dst from same ANA (2 NS per GW)
      destroy-cluster: false
      module: test_nvmeof_xcopy_cnc_rhel.py
      name: orch-spec cnc_enable CNC vs host R_W (same ANA)

