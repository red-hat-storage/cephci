# Ceph NVMe-oF XCOPY/CNC orch-spec parameter tests
# Deploy CNC settings via nvmeof service spec (cnc_enable, rate, chunk, parallel)
# Each orch-spec operation runs twice for result comparison:
#   - ana_affinity=same      (both namespaces on one GW ANA / lb_group)
#   - ana_affinity=different (src/dst namespaces on distinct ANA / lb_groups)
# Namespace layout is always 2 NS on node4 + 2 NS on node5; rebalance_period_sec=0.
# Look for CNC_RESULT log lines to compare same-ANA vs different-ANA timings.
# cluster configuration file: conf/tentacle/nvmeof/ceph_nvmeof_2GW_1Client.yaml
# inventory: conf/inventory/rhel-9.6-server-x86_64-xlarge.yaml
