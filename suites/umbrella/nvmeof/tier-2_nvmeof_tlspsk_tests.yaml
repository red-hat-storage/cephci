# NVMe-oF TLS-PSK Test Suite — Tier 2
# cluster configuration: conf/tentacle/nvmeof/ceph_nvmeof_2GW_1Client.yaml
#
# Two suite rows. Each row deploys NVMe-oF once and tears it down once.
#
#   1. Single gateway group lifecycle (one TLS-PSK service on node5 + node6):
#        connect, host-PSK rotation, keep_connections rotation, ALB paths,
#        DHCHAP, namespace masking, daemon restart, service redeploy,
#        HA failover, IBMCEPH-19520 listener delete abort, then
#        TLS-PSK → plaintext → TLS-PSK.
#   2. Three gateway groups, one gateway service per node:
#        Group-A on node5, Group-B on node6, Group-C on node4.
#        Group-A and Group-B each have their own TLS-PSK. Group-C starts
#        plaintext, then Group-C is switched to TLS-PSK.
#
# TLS-PSK spec:
#   enable_auth: false
#   enable_encryption: true
#   encryption_key_path: /root/encryption.key
# Initiator connects with: nvme connect ... --tls
---
tests:

  # - test:
  #     abort-on-fail: true
  #     module: install_prereq.py
  #     name: install ceph pre-requisites

  # - test:
  #     abort-on-fail: true
