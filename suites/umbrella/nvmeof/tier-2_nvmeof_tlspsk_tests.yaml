  # - test:
  #     abort-on-fail: false
  #     config:
  #       command: add
  #       id: client.1
  #       nodes:
  #         - node10
  #       copy_admin_keyring: true
  #       install_packages:
  #         - ceph-common
  #         - nvme-cli
  #         - fio
  #     desc: Setup client for NVMe-oF TLS-PSK tests
  #     destroy-cluster: false
  #     module: test_client.py
  #     name: configure Ceph client for NVMe TLS-PSK tests

  - test:
      abort-on-fail: false
      config:
        install: true
        spec_deployment: true
        rbd_pool: rbd
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        gw_group: group
        gw_nodes:
          - node5
          - node6
        listener_port: 4420
        initiator_node: node10
        tls_psk: true
        # IBMCEPH-18527 keep_connections: del+add inside one OMAP poll window
        state_update_interval_sec: 60
        state_update_notify: false
        ts03b_del_add_wait: 10
        ts03b_fio_runtime: 360
        ha_fio_runtime: 90
        # IBMCEPH-19520: lifecycle asserts the fixed path (no peer abort).
        expect_gateway_abort: false
        listener_abort_fio_runtime: 120
        peer_sync_wait_sec: 75
        phase_subsystems:
          connect:
            nqn: nqn.2016-06.io.spdk:tlspsk-basic
            no-group-append: true
            secure_listener: true
            bdevs:
              - count: 1
                size: 2G
                ns_create_image: true
          keep_connections:
            nqn: nqn.2016-06.io.spdk:tlspsk-kc
            no-group-append: true
            secure_listener: true
            bdevs:
              - count: 1
                size: 20G
                ns_create_image: true
          alb:
            nqn: nqn.2016-06.io.spdk:tlspsk-alb
            no-group-append: true
            secure_listener: true
            bdevs:
              - count: 4
                size: 2G
                ns_create_image: true
          dhchap:
            nqn: nqn.2016-06.io.spdk:tlspsk-dhchap
            no-group-append: true
            secure_listener: true
            bdevs:
              - count: 1
                size: 2G
                ns_create_image: true
          masking:
            nqn: nqn.2016-06.io.spdk:tlspsk-mask
            no-group-append: true
            secure_listener: true
            bdevs:
              - count: 2
                size: 2G
                ns_create_image: true
          ha:
            nqn: nqn.2016-06.io.spdk:tlspsk-ha
            no-group-append: true
            secure_listener: true
            bdevs:
              - count: 2
                size: 2G
                ns_create_image: true
          listener_abort:
            nqn: nqn.2016-06.io.spdk:tlspsk-listener-abort
            no-group-append: true
            secure_listener: true
            bdevs:
              - count: 1
                size: 5G
                ns_create_image: true
          mode_switch:
            nqn: nqn.2016-06.io.spdk:tlspsk-mtlsswitch
            no-group-append: true
            allow_host: "*"
            secure_listener: true
            bdevs:
              - count: 1
                size: 2G
                ns_create_image: true
        cleanup:
          - subsystems
          - pool
          - gateway
      desc: >
        Single gateway group TLS-PSK lifecycle. Deploy the service once, then
        connect and refuse a plain connect, rotate the host PSK, rotate again
        with keep_connections while FIO is running, check ALB paths are TLS,
        stack DHCHAP, enforce namespace masking, restart a daemon and redeploy
        the service, fail one gateway over and back, force-delete a peer
        listener under FIO (IBMCEPH-19520 must not abort), then switch the
        service to plaintext and back to TLS-PSK. Tear down once at the end.
      destroy-cluster: false
      module: test_ceph_nvmeof_tlspsk_lifecycle.py
      name: NVMe-oF TLS-PSK single gateway group lifecycle
      polarion-id: CEPH-XXXXX

  - test:
      abort-on-fail: false
      config:
        install: true
        spec_deployment: true
        rbd_pool: rbd
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        listener_port: 4420
        initiator_node: node10
        groups:
          - gw_group: group-a
            tls_psk: true
            gw_nodes:
              - node5
            subsystems:
              - nqn: nqn.2016-06.io.spdk:tlspsk-gwgrp-a
                no-group-append: true
                secure_listener: true
                bdevs:
                  - count: 1
                    size: 2G
                    ns_create_image: true
          - gw_group: group-b
            tls_psk: true
            gw_nodes:
              - node6
            subsystems:
              - nqn: nqn.2016-06.io.spdk:tlspsk-gwgrp-b
                no-group-append: true
                secure_listener: true
                bdevs:
                  - count: 1
                    size: 2G
                    ns_create_image: true
          - gw_group: group-c
            tls_psk: false
            gw_nodes:
              - node4
            subsystems:
              - nqn: nqn.2016-06.io.spdk:tlspsk-gwgrp-c
                no-group-append: true
                bdevs:
                  - count: 1
                    size: 2G
                    ns_create_image: true
        cleanup:
          - subsystems
          - pool
          - gateway
      desc: >
        Three gateway groups, one service per node: Group-A on node5, Group-B
        on node6, Group-C on node4. Group-A and Group-B each have their own
        TLS-PSK. A plain connect to either is refused, and FIO runs on both
        groups together. Rotating Group-A's host PSK leaves Group-B working.
        Group-C starts plaintext, then TLS-PSK is enabled on it and a plain
        connect is refused.
      destroy-cluster: false
      module: test_ceph_nvmeof_tlspsk_gwgroup.py
      name: NVMe-oF TLS-PSK gateway group isolation
      polarion-id: CEPH-XXXXX
