# NVMe-oF TLS-PSK validation — two-gateway cluster
# cluster configuration: conf/tentacle/nvmeof/ceph_nvmeof_2GW_1Client.yaml
#
# Each row deploys its own NVMe-oF service and tears it down.
#
#   1. Single gateway group lifecycle (node5 + node6):
#        connect, host-PSK rotation, IBMCEPH-18527 keep_connections,
#        ALB, DHCHAP, namespace masking, daemon restart, service redeploy,
#        HA failover, IBMCEPH-19520 listener delete (peer must stay up),
#        then TLS-PSK → plaintext → TLS-PSK.
#   2. Three gateway groups, one service per node (node5, node6, node4).
#   3. mTLS and TLS-PSK together.
#   4. TLS-PSK plus a KMIP LUKS namespace.
#
# RBD mirror is suites/tentacle/nvmeof/tier-3_nvmeof_tlspsk_rbd_mirror.yaml.
# That run needs two clusters (conf/tentacle/nvmeof/ceph_nvmeof_rbd_mirror.yaml).
#
# TLS-PSK spec for rows 1 and 2:
#   enable_auth: false
#   enable_encryption: true
#   encryption_key_path: /root/encryption.key
# Initiator connects with: nvme connect ... --tls
---
tests:

  - test:
      abort-on-fail: true
      module: install_prereq.py
      name: install ceph pre-requisites

  - test:
      abort-on-fail: true
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
                registry-url: registry.redhat.io
                allow-fqdn-hostname: true
                allow-overwrite: true
                log-to-file: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
      desc: RHCS cluster deployment using cephadm
      destroy-cluster: false
      module: test_cephadm.py
      name: deploy cluster

  - test:
      abort-on-fail: false
      config:
        command: add
        id: client.1
        nodes:
          - node10
        copy_admin_keyring: true
        install_packages:
          - ceph-common
          - nvme-cli
          - fio
      desc: Setup client for NVMe-oF TLS-PSK tests
      destroy-cluster: false
      module: test_client.py
      name: configure Ceph client for NVMe TLS-PSK tests

  - test:
      abort-on-fail: false
      config:
        install: true
        spec_deployment: true
        rbd_pool: rbd
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        gw_group: group
        gw_nodes:
          - node5
          - node6
        listener_port: 4420
        initiator_node: node10
        tls_psk: true
        # IBMCEPH-18527 keep_connections: del+add inside one OMAP poll window
        state_update_interval_sec: 60
        state_update_notify: false
        ts03b_del_add_wait: 10
        ts03b_fio_runtime: 360
        ha_fio_runtime: 90
        listener_abort_fio_runtime: 120
        peer_sync_wait_sec: 75
        phase_subsystems:
          connect:
            nqn: nqn.2016-06.io.spdk:tlspsk-basic
            no-group-append: true
            secure_listener: true
            bdevs:
              - count: 1
                size: 2G
                ns_create_image: true
          keep_connections:
            nqn: nqn.2016-06.io.spdk:tlspsk-kc
            no-group-append: true
            secure_listener: true
            bdevs:
              - count: 1
                size: 20G
                ns_create_image: true
          alb:
            nqn: nqn.2016-06.io.spdk:tlspsk-alb
            no-group-append: true
            secure_listener: true
            bdevs:
              - count: 4
                size: 2G
                ns_create_image: true
          dhchap:
            nqn: nqn.2016-06.io.spdk:tlspsk-dhchap
            no-group-append: true
            secure_listener: true
            bdevs:
              - count: 1
                size: 2G
                ns_create_image: true
          masking:
            nqn: nqn.2016-06.io.spdk:tlspsk-mask
            no-group-append: true
            secure_listener: true
            bdevs:
              - count: 2
                size: 2G
                ns_create_image: true
          ha:
            nqn: nqn.2016-06.io.spdk:tlspsk-ha
            no-group-append: true
            secure_listener: true
            bdevs:
              - count: 2
                size: 2G
                ns_create_image: true
          listener_abort:
            nqn: nqn.2016-06.io.spdk:tlspsk-listener-abort
            no-group-append: true
            secure_listener: true
            bdevs:
              - count: 1
                size: 5G
                ns_create_image: true
          mode_switch:
            nqn: nqn.2016-06.io.spdk:tlspsk-mtlsswitch
            no-group-append: true
            allow_host: "*"
            secure_listener: true
            bdevs:
              - count: 1
                size: 2G
                ns_create_image: true
        cleanup:
          - subsystems
          - pool
          - gateway
      desc: >
        Single gateway group TLS-PSK lifecycle. Deploy the service once, then
        connect and refuse a plain connect, rotate the host PSK, rotate again
        with keep_connections while FIO is running, check ALB paths are TLS,
        stack DHCHAP, enforce namespace masking, restart a daemon and redeploy
        the service, fail one gateway over and back, force-delete a peer
        listener under FIO (IBMCEPH-19520 must not abort), then switch the
        service to plaintext and back to TLS-PSK. Tear down once at the end.
      destroy-cluster: false
      module: test_ceph_nvmeof_tlspsk_lifecycle.py
      name: NVMe-oF TLS-PSK single gateway group lifecycle
      polarion-id: CEPH-83633044

  - test:
      abort-on-fail: false
      config:
        install: true
        spec_deployment: true
        rbd_pool: rbd
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        listener_port: 4420
        initiator_node: node10
        groups:
          - gw_group: group-a
            tls_psk: true
            gw_nodes:
              - node5
            subsystems:
              - nqn: nqn.2016-06.io.spdk:tlspsk-gwgrp-a
                no-group-append: true
                secure_listener: true
                bdevs:
                  - count: 1
                    size: 2G
                    ns_create_image: true
          - gw_group: group-b
            tls_psk: true
            gw_nodes:
              - node6
            subsystems:
              - nqn: nqn.2016-06.io.spdk:tlspsk-gwgrp-b
                no-group-append: true
                secure_listener: true
                bdevs:
                  - count: 1
                    size: 2G
                    ns_create_image: true
          - gw_group: group-c
            tls_psk: false
            gw_nodes:
              - node4
            subsystems:
              - nqn: nqn.2016-06.io.spdk:tlspsk-gwgrp-c
                no-group-append: true
                bdevs:
                  - count: 1
                    size: 2G
                    ns_create_image: true
        cleanup:
          - subsystems
          - pool
          - gateway
      desc: >
        Three gateway groups, one service per node: Group-A on node5, Group-B
        on node6, Group-C on node4. Group-A and Group-B each have their own
        TLS-PSK. A plain connect to either is refused, and FIO runs on both
        groups together. Rotating Group-A's host PSK leaves Group-B working.
        Group-C starts plaintext, then TLS-PSK is enabled on it and a plain
        connect is refused.
      destroy-cluster: false
      module: test_ceph_nvmeof_tlspsk_gwgroup.py
      name: NVMe-oF TLS-PSK gateway group isolation
      polarion-id: CEPH-83633046

  - test:
      abort-on-fail: false
      config:
        install: true
        spec_deployment: true
        rbd_pool: rbd
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        gw_group: group
        gw_nodes:
          - node5
          - node6
        listener_port: 4420
        initiator_node: node10
        mtls: true
        tls_psk: true
        run_ts06b: true
        subsystems:
          - nqn: nqn.2016-06.io.spdk:tlspsk-mtls
            no-group-append: true
            allow_host: "*"
            secure_listener: true
            bdevs:
              - count: 1
                size: 2G
                ns_create_image: true
        cleanup:
          - subsystems
          - pool
          - gateway
      desc: >
        Deploy the gateway with mTLS and TLS-PSK together. enable_auth
        authenticates nvme CLI commands to the gateway. enable_encryption
        encrypts initiator IO in transit. Create a secure subsystem through
        the CLI, connect with --tls, run FIO, and confirm a plain connect is
        refused. Both spec fields are still set afterwards.
      destroy-cluster: false
      module: test_ceph_nvmeof_tlspsk_mtls_switch.py
      name: NVMe-oF TLS-PSK with mTLS on the CLI path
      polarion-id: CEPH-83633047

  - test:
      abort-on-fail: false
      config:
        install: true
        spec_deployment: true
        rbd_pool: rbd
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        gw_group: group
        gw_nodes:
          - node5
          - node6
        listener_port: 4420
        initiator_node: node10
        tls_psk: true
        use_dummy_kmip: true
        kmip:
          server_node: node10
          port: 5696
        luks_combos:
          - key_id: key-id-tlspsk-luks2-aes256
            format: luks2
            algo: aes256
        subsystems:
          - nqn: nqn.2016-06.io.spdk:tlspsk-byok
            no-group-append: true
            secure_listener: true
            bdevs:
              - count: 1
                size: 4G
                ns_create_image: true
        cleanup:
          - subsystems
          - pool
          - gateway
      desc: >
        TLS-PSK transport plus a KMIP LUKS2/AES-256 namespace. Connect with
        --tls and run FIO on the encrypted namespace. Restart a gateway and
        confirm the passphrase is fetched again and the namespace is still
        accessible.
      destroy-cluster: false
      module: test_ceph_nvmeof_tlspsk_byok.py
      name: NVMe-oF TLS-PSK + BYOK KMIP double-layer encryption
      polarion-id: CEPH-83633048
