          - subsystems
          - pool
          - gateway
      desc: >
        IBMCEPH-19520 verify on 9.2z1: TLS-PSK connect, FIO, force-delete
        peer listener, assert no gateway abort.
      destroy-cluster: false
      module: test_ceph_nvmeof_tlspsk_listener_delete_abort.py
