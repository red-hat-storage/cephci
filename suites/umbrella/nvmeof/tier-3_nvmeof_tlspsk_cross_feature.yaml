# NVMe-oF TLS-PSK Cross-Feature Test Suite — Tier 3
# cluster configuration: conf/tentacle/nvmeof/ceph_nvmeof_2GW_1Client.yaml
#
# These cases need a different starting spec or extra services, so they stay
# out of the single-group lifecycle:
#   mTLS and TLS-PSK together
#   BYOK / KMIP namespace encryption
#
# RBD mirroring between two clusters is
# suites/tentacle/nvmeof/tier-3_nvmeof_tlspsk_rbd_mirror.yaml
# with conf/tentacle/nvmeof/ceph_nvmeof_rbd_mirror.yaml.
#
# HA, ALB, DHCHAP, and namespace masking run inside
# suites/tentacle/nvmeof/tier-2_nvmeof_tlspsk_tests.yaml.
