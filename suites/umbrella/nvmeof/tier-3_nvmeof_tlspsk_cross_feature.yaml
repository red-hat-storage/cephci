  - test:
      abort-on-fail: false
      config:
        install: true
        spec_deployment: true
        rbd_pool: rbd
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        gw_group: group
        gw_nodes:
          - node5
          - node6
        listener_port: 4420
        initiator_node: node10
        mtls: true
        tls_psk: true
        run_ts06b: true
        subsystems:
          - nqn: nqn.2016-06.io.spdk:tlspsk-mtls
            no-group-append: true
            allow_host: "*"
            secure_listener: true
            bdevs:
              - count: 1
                size: 2G
                ns_create_image: true
        cleanup:
          - subsystems
          - pool
          - gateway
      desc: >
        Deploy the gateway with mTLS and TLS-PSK together. enable_auth
        authenticates nvme CLI commands to the gateway. enable_encryption
        encrypts initiator IO in transit. Create a secure subsystem through
        the CLI, connect with --tls, run FIO, and confirm a plain connect is
        refused. Both spec fields are still set afterwards.
      destroy-cluster: false
      module: test_ceph_nvmeof_tlspsk_mtls_switch.py
      name: NVMe-oF TLS-PSK with mTLS on the CLI path
      polarion-id: CEPH-XXXXX

  - test:
      abort-on-fail: false
      config:
        install: true
        spec_deployment: true
        rbd_pool: rbd
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        gw_group: group
        gw_nodes:
          - node5
          - node6
        listener_port: 4420
        initiator_node: node10
        tls_psk: true
        use_dummy_kmip: true
        kmip:
          server_node: node10
          port: 5696
        luks_combos:
          - key_id: key-id-tlspsk-luks2-aes256
            format: luks2
            algo: aes256
        subsystems:
          - nqn: nqn.2016-06.io.spdk:tlspsk-byok
            no-group-append: true
            secure_listener: true
            bdevs:
              - count: 1
                size: 4G
                ns_create_image: true
        cleanup:
          - subsystems
          - pool
          - gateway
      desc: >
        TLS-PSK transport plus a KMIP LUKS2/AES-256 namespace. Connect with
        --tls and run FIO on the encrypted namespace. Restart a gateway and
        confirm the passphrase is fetched again and the namespace is still
        accessible.
      destroy-cluster: false
      module: test_ceph_nvmeof_tlspsk_byok.py
      name: NVMe-oF TLS-PSK + BYOK KMIP double-layer encryption
      polarion-id: CEPH-XXXXX
