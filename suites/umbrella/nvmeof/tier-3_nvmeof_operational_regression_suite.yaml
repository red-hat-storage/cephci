  - test:
      abort-on-fail: false
      config:
        command: apply
        cleanup:
          - subsystems
          - initiators
          - pool
          - gateway
          - disconnect_all
        service: nvmeof
        gw_group: 'gw_group1'
        install: true
        nvme_metadata_pool: rbd
        pos_args:
          - rbd                 # name of the pool
        gw_nodes: ["node5", "node6"]
        args:
          placement_options:
            - nodes: ["node5", "node6"]
            - label: nvmeof-gw
            - apply_spec: True
        rbd_pool: rbd
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        initiators:
          - node: node10
            nqn: connect-all
            listener_port: 4420
        subsystems: # Configure subsystems with all sub-entities
          - nqn: nqn.2016-06.io.spdk:ceph-83608266
            serial: 1
            bdevs:
              count: 1
              size: 5G
            listener_port: 4420
            allow_host: "*"
        operation: CEPH-83608266
