---
tests:
  -
    test:
      abort-on-fail: true
      desc: "Setup phase to deploy the required pre-requisites for running the tests."
      module: install_prereq.py
      name: "setup install pre-requisistes"
  -
    test:
      abort-on-fail: true
      config:
        steps:
          -
            config:
              args:
                mon-ip: node1
                orphan-initial-daemons: true
                registry-url: registry.redhat.io
                allow-fqdn-hostname: true
                skip-monitoring-stack: true
              base_cmd_args:
                verbose: true
              command: bootstrap
              service: cephadm
          -
            config:
              args:
                attach_ip_address: true
                labels: apply-all-labels
              command: add_hosts
              service: host
          -
            config:
              args:
                placement:
                  label: mgr
              command: apply
              service: mgr
          -
            config:
              args:
                placement:
                  label: mon
              command: apply
              service: mon
          -
            config:
              args:
                all-available-devices: true
              command: apply
              service: osd
          -
            config:
              args:
                - ceph
                - fs
                - volume
                - create
                - cephfs
              command: shell
          -
            config:
              args:
                placement:
                  label: mds
              base_cmd_args:
                verbose: true
              command: apply
              pos_args:
                - cephfs
              service: mds
          - config:
              args:
                - ceph
                - fs
                - set
                - cephfs
                - max_mds
                - "2"
              command: shell
        verify_cluster_health: true
      desc: "Execute the cluster deployment workflow with label placement."
      destroy-cluster: false
      module: test_cephadm.py
      name: "cluster deployment"
      polarion-id: CEPH-83573777
  - test:
      abort-on-fail: true
      config:
        command: add
        copy_admin_keyring: true
        id: client.1
        install_packages:
          - ceph-common
          - ceph-fuse
        node: node8
      desc: "Configure the Cephfs client system 1"
      destroy-cluster: false
      module: test_client.py
      name: "configure client"
  - test:
      abort-on-fail: true
      config:
        command: add
        copy_admin_keyring: true
        id: client.2
        install_packages:
          - ceph-common
          - ceph-fuse
        node: node9
      desc: "Configure the Cephfs client system 2"
      destroy-cluster: false
      module: test_client.py
      name: "configure client"
  - test:
      abort-on-fail: true
      config:
        command: add
        copy_admin_keyring: true
        id: client.3
        install_packages:
          - ceph-common
          - ceph-fuse
        node: node10
      desc: "Configure the Cephfs client system 3"
      destroy-cluster: false
      module: test_client.py
      name: "configure client"
  - test:
      abort-on-fail: true
      config:
        command: add
        copy_admin_keyring: true
        id: client.4
        install_packages:
          - ceph-common
          - ceph-fuse
        node: node11
      desc: "Configure the Cephfs client system 4"
      destroy-cluster: false
      module: test_client.py
      name: "configure client"

  - test:
      abort-on-fail: false
      desc: "cephfs basic operations"
      module: cephfs_basic_tests.py
      name: cephfs-basics
      polarion-id: "CEPH-11293"

  - test:
      name: cephfs_tier1_ops
      module: cephfs_tier1_ops.py
      polarion-id: CEPH-83573447
      desc: cephfs tier1 operations
      abort-on-fail: false

  - test:
      name: Increase and Decrease of MDS
      module: mds_inc_dec.py
      desc: Deploy mds using cephadm and increase & decrease number of mds.
      polarion-id: CEPH-83574286
      abort-on-fail: false

  - test:
      abort-on-fail: false
      desc: "Ensure kernel mounts works with all available options and validate the functionality of each option"
      module: fs_kernel_mount_options.py
      name: fs_kernel_mount_options
      polarion-id: "CEPH-83575389"

  - test:
      name: Subvolume metadata creation, delete and modifying test
      module: cephfs_vol_management.cephfs_vol_mgmt_subvolume_metadata.py
      polarion-id: CEPH-83575032
      desc: Subvolume metadata creation, delete and modifying test
      abort-on-fail: false

  - test:
      abort-on-fail: false
      name: "qtn_sanity"
      desc: "CephFS subvolume quarantine — Sanity/Acceptance (A1–A3 + lifecycle/isolation/mds/e2e)"
      module: cephfs_subvol_quarantine.test_subvolume_quarantine_sanity.py
      polarion-id: CEPH-83632677
      config:
        fs_name: cephfs

  - test:
      name: snapshot_metadata
      module: snapshot_clone.snapshot_metadata.py
      polarion-id: CEPH-83575038
      desc: verify CRUD operation on metadata of subvolume's snapshot
      abort-on-fail: false

  - test:
      name: ceph auth caps change permission and check
      module: clients.ceph_auth_caps_modifying_permissions.py
      polarion-id: CEPH-83574328
      desc: generate all the possible permissions and verify the permissions
      abort-on-fail: false
