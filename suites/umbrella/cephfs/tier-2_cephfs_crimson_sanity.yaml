#=======================================================================================================================
# Suite: tier-2_cephfs_crimson_sanity.yaml
# Purpose: Crimson OSD deploy + CephFS FUSE sanity (IBMCEPH-16161 / IBMCEPH-17094)
# Conf (suggested): conf/umbrella/cephfs/tier-0_fs.yaml
#   - Adjust client node IDs if using a different conf (tier-0 uses node7 as client)
# Deploy reference:
#   - https://docs.ceph.com/en/latest/crimson/crimson/#deploying-crimson-osds
#   - Pattern based on suites/umbrella/rados/tier-2_rados_crimson_sanity.yaml
# Notes:
#   - Crimson is Tech Preview; set-allow-crimson is irreversible
#   - OSD spec sets osd_type: crimson (required by upstream docs)
#   - Default objectstore is bluestore; for SeaStore use objectstore: seastore (LVM only)
#   - Kernel / NFS / mirror / multimds suites intentionally omitted (epic out of scope)
#=======================================================================================================================
tests:
  - test:
      name: setup install pre-requisistes
      desc: Setup phase to deploy the required pre-requisites for running the tests.
      module: install_prereq.py
      abort-on-fail: true

  - test:
      name: cluster deployment
      desc: Bootstrap Cephadm cluster (no OSDs yet — Crimson flags must be set before OSD deploy).
      module: test_cephadm.py
      abort-on-fail: true
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              base_cmd_args:
                verbose: true
              args:
                mon-ip: node1
                orphan-initial-daemons: true
                allow-fqdn-hostname: true
                skip-monitoring-stack: true

  - test:
      name: Add host
      desc: Add cluster hosts with labels
      module: test_host.py
      destroy-cluster: false
      abort-on-fail: true
      config:
        command: add_hosts
        service: host
        args:
          attach_ip_address: true
          labels: apply-all-labels

  - test:
      name: Mgr and Mon deployment
      desc: Deploy Mgr and Mon via placement labels
      module: test_cephadm.py
      polarion-id: CEPH-83573746
      abort-on-fail: true
      config:
        steps:
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon

  # ---------------------------------------------------------------------------
  # Crimson required flags (docs.ceph.com) via existing CephCI helper
  # ---------------------------------------------------------------------------
  - test:
      name: Setup Crimson pre-requisites
      desc: >
        Enable experimental crimson feature, set-allow-crimson,
        osd_pool_default_crimson, and Crimson thread knobs
        (setup_crimson_pre_req in rados_prep / core_workflows).
      module: rados_prep.py
      abort-on-fail: true
      config:
        setup-crimson-pre-req: true
        # Override defaults if lab CPU density requires it:
        # crimson_seastar_num_threads: 2
        # crimson_alien_op_num_threads: 6

  # Upstream docs also require crimson_cpu_num before OSD deploy
  - test:
      name: Set Crimson CPU allocation
      desc: Set crimson_cpu_num per https://docs.ceph.com/en/latest/crimson/crimson/#crimson-cpu-allocation
      module: test_cephadm.py
      abort-on-fail: true
      config:
        steps:
          - config:
              command: shell
              args:
                - ceph
                - config
                - set
                - osd
                - crimson_cpu_num
                - "2"

  # ---------------------------------------------------------------------------
  # Deploy Crimson OSDs — osd_type: crimson (docs: Deploying Crimson OSDs)
  # ---------------------------------------------------------------------------
  - test:
      name: Crimson OSD deployment
      desc: Deploy OSDs with osd_type crimson (BlueStore default objectstore)
      module: test_cephadm.py
      polarion-id: CEPH-83573746
      abort-on-fail: true
      config:
        steps:
          - config:
              command: apply_spec
              service: orch
              validate-spec-services: true
              specs:
                - service_type: osd
                  service_id: crimson-osds
                  placement:
                    label: osd
                  spec:
                    data_devices:
                      all: "true"
                    osd_type: crimson
                    # objectstore: bluestore   # default
                    # For SeaStore (LVM only), use:
                    # objectstore: seastore

  - test:
      name: Verify Crimson OSDs
      desc: Confirm OSDs are up after crimson deploy
      module: test_cephadm.py
      abort-on-fail: true
      config:
        steps:
          - config:
              command: shell
              args:
                - ceph
                - orch
                - ps
                - --daemon-type
                - osd
          - config:
              command: shell
              args:
                - ceph
                - versions

  # ---------------------------------------------------------------------------
  # CephFS enablement
  # ---------------------------------------------------------------------------
  - test:
      name: MDS Service deployment with spec
      desc: Create cephfs volume and deploy MDS
      module: test_cephadm.py
      polarion-id: CEPH-83574728
      abort-on-fail: true
      config:
        steps:
          - config:
              command: shell
              args:
                - ceph
                - fs
                - volume
                - create
                - cephfs
          - config:
              command: apply_spec
              service: orch
              validate-spec-services: true
              specs:
                - service_type: mds
                  service_id: cephfs
                  placement:
                    label: mds
          - config:
              command: shell
              args:
                - ceph
                - fs
                - set
                - cephfs
                - max_mds
                - "1"

  - test:
      name: Configure CephFS client
      desc: Configure client with ceph-common and ceph-fuse
      module: test_client.py
      destroy-cluster: false
      abort-on-fail: true
      config:
        command: add
        id: client.1
        node: node7
        install_packages:
          - ceph-common
          - ceph-fuse
        copy_admin_keyring: true
        caps:
          mon: "allow *"
          osd: "allow *"
          mds: "allow *"
          mgr: "allow *"

  - test:
      name: Enable logging to file
      module: rados_prep.py
      config:
        log_to_file: true
      desc: Enable daemon file logging for crash triage

  # ---------------------------------------------------------------------------
  # CephFS sanity operations (subset — no kernel / NFS / mirror)
  # ---------------------------------------------------------------------------
  - test:
      name: cephfs-basics
      desc: CephFS basic operations on Crimson-backed cluster
      module: cephfs_basic_tests.py
      polarion-id: CEPH-11293
      abort-on-fail: false

  - test:
      name: cephfs default values for mds
      desc: Deploy/verify MDS default values using cephadm
      module: mds_default_values.py
      polarion-id: CEPH-83574284
      abort-on-fail: false

  - test:
      name: cephfs_tier1_ops
      desc: CephFS tier1 operations (volume/subvol/IO style smoke)
      module: cephfs_tier1_ops.py
      polarion-id: CEPH-83573447
      abort-on-fail: false

  - test:
      name: cephfs_volume_management
      desc: CephFS volume management sanity
      module: cephfs_volume_management.py
      polarion-id: CEPH-83573446
      abort-on-fail: false

  - test:
      name: cephfs_snapshot_management
      desc: CephFS snapshot management sanity
      module: cephfs_snapshot_management.py
      polarion-id: CEPH-83573259
      abort-on-fail: false

  - test:
      name: cephfs subvolume authorize test
      desc: Subvolume client authorize sanity
      module: subvolume_authorize.py
      polarion-id: CEPH-83574596
      abort-on-fail: false

  - test:
      name: Increase and Decrease of MDS
      desc: Increase and decrease MDS count under CephFS IO path
      module: mds_inc_dec.py
      polarion-id: CEPH-83574286
      abort-on-fail: false
