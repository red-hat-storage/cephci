#===============================================================================================
#-------------------------------------
#---    Test Suite for NFS v4 ACL Tests (Tentacle) ---
#-------------------------------------
# Conf: conf/umbrella/nfs/1admin-7node-3client.yaml
# ACL test cases covering:
#    - Functional: ACL ops, ACE eval, permissions, identity, flags/inheritance,
#      POSIX interaction, symlinks, recursive, persistence (rename, hardlink,
#      restart, reboot)
#    - Negative: atomic failure, deny ordering, append-only, delete control,
#      UID/GID denial, symlink skip/traversal
#    - Scale: large ACL (2000+ ACEs), performance, overwrite/append/duplicate,
#      scale limit, persistence after remount
#    - Hotfix coverage: named-group inherit (existing vs new children),
#      multi-group file w/a loss, special-identity access ACE retention
#    - Extended coverage: inherited GROUP@ write rule vs. client umask on
#      new dirs/files (IBMCEPH-21565); wildcard partial-permission ALLOW ACE
#      survives removal by its original string (IBMCEPH-19377); explicit
#      OWNER@ deny-all ACE silently bypassed via mode-bit backfill
#      (IBMCEPH-21577); inherited EVERYONE@ write rule vs. client umask on
#      new dirs/files, same root cause as IBMCEPH-21565 (IBMCEPH-21579);
#      concurrent nfs4_setfacl/nfs4_getfacl on the same file intermittently
#      fails reads with ERANGE (IBMCEPH-21590)
#
#===============================================================================================
tests:
  - test:
      abort-on-fail: true
      desc: Install software pre-requisites for cluster deployment.
      module: install_prereq.py
      name: setup pre-requisites

  - test:
      abort-on-fail: true
      config:
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              command: apply
              service: rgw
              pos_args:
                - rgw.1
              args:
                placement:
                  label: rgw
          - config:
              args:
                - "ceph fs volume create cephfs"
              command: shell
          - config:
              args:
                placement:
                  label: mds
              base_cmd_args:
                verbose: true
              command: apply
              pos_args:
                - cephfs
              service: mds
          - config:
              args:
                - "ceph osd pool create rbd"
              command: shell
          - config:
              args:
                - "rbd pool init rbd"
              command: shell
      desc: bootstrap and deploy services.
      destroy-cluster: false
      polarion-id: CEPH-83573713
      module: test_cephadm.py
      name: Deploy cluster using cephadm

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.1
        node: node4
        install_packages:
          - ceph-common
          - ceph-fuse
        copy_admin_keyring: true
      desc: Configure the RGW,RBD client system
      destroy-cluster: false
      module: test_client.py
      name: configure client

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.2
        node: node5
        install_packages:
          - ceph-common
          - ceph-fuse
        copy_admin_keyring: true
      desc: Configure the RGW,RBD client system
      destroy-cluster: false
      module: test_client.py
      name: configure client

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.3
        node: node6
        install_packages:
          - ceph-common
          - ceph-fuse
        copy_admin_keyring: true
      desc: Configure the RGW,RBD client system
      destroy-cluster: false
      module: test_client.py
      name: configure client

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.4
        node: node7
        install_packages:
          - ceph-common
          - ceph-fuse
        copy_admin_keyring: true
      desc: Configure the RGW,RBD client system
      destroy-cluster: false
      module: test_client.py
      name: configure client

  # ====================== ACL Tests (NFS mount) ======================

  - test:
      name: NFS ACL - Functional Tests (NFS mount)
      module: acl.test_nfs_acl_functional.py
      desc: >
        Verify core ACL features using standard NFS mount - ACL ops
        (get/set/replace/incremental/spec-file), ACE ordering, read/write
        permissions, UID/GID identity, inheritance flags, POSIX interaction,
        symlink follow, recursive apply, and persistence across rename,
        hard-link, service restart, and node reboot.
      abort-on-fail: false
      config:
        nfs_version: 4.2
        clients: 1
        mount_type: nfs
      comments: "IBMCEPH-13880, IBMCEPH-13881"

  - test:
      name: NFS ACL - Negative Tests (NFS mount)
      module: acl.test_nfs_acl_negative.py
      desc: >
        Verify denial and failure paths using standard NFS mount - atomic
        failure on invalid spec, deny-before-allow ordering, append-only
        enforcement, delete control, UID mismatch, non-member denial,
        UID-vs-GID precedence, and symlink skip (-P) / traversal difference.
      abort-on-fail: false
      config:
        nfs_version: 4.2
        clients: 1
        mount_type: nfs
      comments: "IBMCEPH-13884"

  - test:
      name: NFS ACL - Scale Tests (NFS mount)
      module: acl.test_nfs_acl_scale.py
      desc: >
        Verify large ACL handling using standard NFS mount - apply 2000+ ACEs,
        ACE count verification, random access validation, non-listed user
        denial, performance check, overwrite/append/duplicate behaviour,
        scale limit (3276 entries), and persistence after NFS remount.
      abort-on-fail: false
      config:
        nfs_version: 4.2
        clients: 1
        mount_type: nfs

  - test:
      name: NFS ACL - Hotfix Coverage (NFS mount)
      module: acl.hotfix_coverage.py
      desc: >
        Hotfix coverage for named-group inheritance (parent access vs
        inherit-only; existing children unchanged; new children inherit;
        GID member vs non-member access), multi-group inherit w/a loss on
        child files (IBMCEPH-19501/19502), and special-identity
        OWNER@/GROUP@/EVERYONE@ access ACE retention after fdi adds.
      abort-on-fail: false
      config:
        nfs_version: 4.2
        clients: 1
        mount_type: nfs
      comments: "IBMCEPH-19501, IBMCEPH-19502"

  - test:
      name: NFS ACL - Extended Coverage (NFS mount)
      module: acl.extended_coverage.py
      desc: >
        Extended coverage for (1) a directory carrying an inherited GROUP@
        access rule (A:fdi:GROUP@:rwaDxtcy): newly created subdirectories
        and files under the suite's restrictive umask (0027) must retain
        the inherited write/append/delete-child permission instead of
        having it silently clipped by the umask. Verified both via
        nfs4_getfacl and an actual non-owner group-member write attempt.
        # Bug: IBMCEPH-21565 - inherited GROUP@ write bits are lost on both
        # new subdirectories (A::GROUP@:rxtcy instead of rwaDxtcy) and new
        # files (explicit D::GROUP@:wax Deny instead of the inherited
        # Allow); resulting mode bits match plain umask-only behaviour as
        # if the inherited ACL rule were never applied.
        and (2) a partial-permission inheritable ALLOW ACE (A:fdig:<gid>:w)
        must be removable by reapplying the exact same ACE string used to
        add it.
        # Bug: IBMCEPH-19377 - the server silently rewrites the single
        # requested ACE into a DENY+ALLOW pair at add time
        # (D:fdig:<gid>:rx + A:fdig:<gid>:waDtcy), so nfs4_setfacl -x with
        # the original string exits 0 ("success") but leaves the ACE for
        # <gid> in place.
        and (3) an explicit DENY-all ACE for OWNER@
        (D::OWNER@:rwaDxtTcCy) must actually deny the owner all access.
        # Bug: IBMCEPH-21577 - a compatibility patch that backfills empty
        # base POSIX ACL entries from the file's mode bits cannot tell
        # "OWNER@ never mentioned" apart from "OWNER@ explicitly denied
        # everything", so it silently reconstructs an ALLOW for the owner
        # from the pre-existing mode bits, discarding the explicit DENY.
        and (4) a directory carrying an inherited EVERYONE@ access rule
        (A:fdi:EVERYONE@:rwaDxtcy): same scenario as (1) but for the
        EVERYONE@ special identity.
        # Bug: IBMCEPH-21579 - same root cause as IBMCEPH-21565: the
        # umask-override check only fires when the parent's default ACL
        # has a POSIX ACL_MASK entry, which is only created for named
        # user/group ACEs, never for OWNER@/GROUP@/EVERYONE@. Inherited
        # EVERYONE@ write bits are lost on both new subdirectories and new
        # files (explicit D::EVERYONE@:rwax Deny instead of the inherited
        # Allow).
        and (5) concurrent nfs4_setfacl/nfs4_getfacl from different clients
        on the same file must not cause ACL reads to fail.
        # Bug: IBMCEPH-21590 - the kernel's two-step getxattr(size) then
        # getxattr(value) query against NFS-Ganesha's "system.nfs4_acl"
        # pseudo-xattr has nothing tying the two round trips together;
        # if another client resizes the ACL in between, the second call
        # is handed a stale size and nfs4_getfacl fails with ERANGE
        # ("Numerical result out of range") at a double-digit-percent hit
        # rate, with no crash and nothing logged as an error server-side.
      abort-on-fail: false
      config:
        nfs_version: 4.2
        clients: 1
        mount_type: nfs
      comments: "IBMCEPH-21565, IBMCEPH-19377, IBMCEPH-21577, IBMCEPH-21579, IBMCEPH-21590"
