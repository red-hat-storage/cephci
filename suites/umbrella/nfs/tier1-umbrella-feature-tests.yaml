# Suite: Tier 1 Umbrella feature tests
# Conf: conf/umbrella/nfs/1admin-7node-3client.yaml
#
# Umbrella 10.0 feature suite. First feature: cephadm NFS Ganesha log_to_file
# (IBMCEPH-13289 / ceph#71198). Do not add this assertion to tentacle 9.2
# shared CI or to NFS upgrade suites until this suite has passed on a 10.0
# build that contains the PR.
#
# Each LF case is its own suite step and its own Polarion ID.
# cleanup: false keeps the NFS cluster for the next step. LF8 removes it.
# stability_seconds is the LF5 window. followup_stability_seconds covers
# LF6 and LF9.
# Grouped drafts CEPH-83633102 (sign-off) and CEPH-83633103 (extended)
# stay in Polarion. The suite reports the eleven IDs below.

tests:
  - test:
      abort-on-fail: true
      desc: Install software pre-requisites for cluster deployment.
      module: install_prereq.py
      name: setup pre-requisites

  - test:
      abort-on-fail: true
      config:
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              command: apply
              service: rgw
              pos_args:
                - rgw.1
              args:
                placement:
                  label: rgw
          - config:
              args:
                - "ceph fs volume create cephfs"
              command: shell
          - config:
              args:
                placement:
                  label: mds
              base_cmd_args:
                verbose: true
              command: apply
              pos_args:
                - cephfs
              service: mds
          - config:
              args:
                - "ceph osd pool create rbd"
              command: shell
          - config:
              args:
                - "rbd pool init rbd"
              command: shell
      desc: bootstrap and deploy services.
      destroy-cluster: false
      polarion-id: CEPH-83573713
      module: test_cephadm.py
      name: Deploy cluster using cephadm

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.1
        node: node4
        install_packages:
          - ceph-common
          - ceph-fuse
        copy_admin_keyring: true
      desc: Configure NFS client
      destroy-cluster: false
      module: test_client.py
      name: configure client

  - test:
      name: NFS log_to_file LF0
      module: test_nfs_log_to_file.py
      desc: Record the build and bring up one NFS daemon
      polarion-id: CEPH-83633104
      abort-on-fail: true
      config: &log_to_file
        cases: LF0
        cleanup: false
        nfs_name: nfs-logf
        nfs_name_pair: nfs-logf2
        nfs_version: "4.2"
        port: "2049"
        fs_name: cephfs
        export: /export_lf
        mount_point: /mnt/nfs_log_to_file
        service_wait_timeout: 600
        auto_redeploy_wait: 90
        stability_seconds: 300
        followup_stability_seconds: 120
        poll_interval: 30

  - test:
      name: NFS log_to_file LF1
      module: test_nfs_log_to_file.py
      desc: Verify global log_to_file true creates a host log
      polarion-id: CEPH-83633105
      abort-on-fail: true
      config:
        <<: *log_to_file
        cases: LF1

  - test:
      name: NFS log_to_file LF2
      module: test_nfs_log_to_file.py
      desc: Verify client.nfs log_to_file true while global is false
      polarion-id: CEPH-83633106
      abort-on-fail: true
      config:
        <<: *log_to_file
        cases: LF2

  - test:
      name: NFS log_to_file LF3
      module: test_nfs_log_to_file.py
      desc: Verify the host log grows after NFS mount and IO
      polarion-id: CEPH-83633107
      abort-on-fail: true
      config:
        <<: *log_to_file
        cases: LF3

  - test:
      name: NFS log_to_file LF7
      module: test_nfs_log_to_file.py
      desc: Verify export recreate while file logging is on
      polarion-id: CEPH-83633108
      abort-on-fail: true
      config:
        <<: *log_to_file
        cases: LF7

  - test:
      name: NFS log_to_file LF5
      module: test_nfs_log_to_file.py
      desc: Verify file logging does not redeploy the NFS daemon in a loop
      polarion-id: CEPH-83633109
      abort-on-fail: true
      config:
        <<: *log_to_file
        cases: LF5

  - test:
      name: NFS log_to_file LF6
      module: test_nfs_log_to_file.py
      desc: Verify log_to_file false uses STDERR and NFS IO still works
      polarion-id: CEPH-83633110
      abort-on-fail: true
      config:
        <<: *log_to_file
        cases: LF6

  - test:
      name: NFS log_to_file LF4
      module: test_nfs_log_to_file.py
      desc: Verify the per-daemon log_to_file who
      polarion-id: CEPH-83633111
      abort-on-fail: true
      config:
        <<: *log_to_file
        cases: LF4

  - test:
      name: NFS log_to_file LF9
      module: test_nfs_log_to_file.py
      desc: Verify log_to_file toggle true, false, then true
      polarion-id: CEPH-83633112
      abort-on-fail: true
      config:
        <<: *log_to_file
        cases: LF9

  - test:
      name: NFS log_to_file LF10
      module: test_nfs_log_to_file.py
      desc: Verify orch redeploy keeps file logging
      polarion-id: CEPH-83633113
      abort-on-fail: true
      config:
        <<: *log_to_file
        cases: LF10

  - test:
      name: NFS log_to_file LF8
      module: test_nfs_log_to_file.py
      desc: Verify each NFS daemon has its own host log
      polarion-id: CEPH-83633114
      abort-on-fail: true
      config:
        <<: *log_to_file
        cases: LF8
        cleanup: true
