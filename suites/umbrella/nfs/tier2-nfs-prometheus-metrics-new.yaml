#===============================================================================================
# NFS-Ganesha Prometheus Metrics — Umbrella combined suite
# PME enablement (CEPH-83633168 / CEPH-83633169–83633182) +
# New metrics & nomenclature (CEPH-83633129 / CEPH-83633131–83633148)
# Modules:
#   tests/nfs/test_nfs_prometheus_metrics_enable.py
#   tests/nfs/test_nfs_prometheus_new_metrics.py
# Conf: conf/umbrella/nfs/1admin-7node-3client.yaml
# NEW/NOM/REG: shared NFS setup once + cleanup once (setup_nfs/cleanup_nfs)
# PME: per-TC create/delete retained (enablement is the test)
# Upgrade TCs U1/U2 remain in tier1-nfs-prometheus-metrics-enable-upgrade.yaml
#===============================================================================================
tests:
  - test:
      abort-on-fail: true
      desc: Install software pre-requisites for cluster deployment.
      module: install_prereq.py
      name: setup pre-requisites

  - test:
      abort-on-fail: true
      config:
        steps:
          - config:
              args:
                mon-ip: node1
                orphan-initial-daemons: true
                registry-url: registry.redhat.io
                allow-fqdn-hostname: true
                skip-monitoring-stack: false
              base_cmd_args:
                verbose: true
              command: bootstrap
              service: cephadm
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              args:
                - "ceph fs volume create cephfs"
              command: shell
          - config:
              args:
                placement:
                  label: mds
              base_cmd_args:
                verbose: true
              command: apply
              pos_args:
                - cephfs
              service: mds
      desc: Bootstrap and deploy Ceph for NFS Prometheus metrics testing.
      destroy-cluster: false
      module: test_cephadm.py
      name: Deploy cluster using cephadm

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.1
        node: node4
        install_packages:
          - ceph-common
          - ceph-fuse
          - fio
        copy_admin_keyring: true
      desc: Configure client 1
      destroy-cluster: false
      module: test_client.py
      name: configure client 1

