#============================================================
# Test-Case: Targeted OSD activation without whole-host device scanning (IBMCEPH-20991)
#
# Cluster Configuration:
#    conf/umbrella/cephadm/1admin-4node-1client-cluster.yaml
#============================================================

tests:
  - test:
      name: setup install pre-requisistes
      desc: Setup phase to deploy the required pre-requisites for running the tests.
      module: install_prereq.py
      abort-on-fail: true

  - test:
      abort-on-fail: true
      config:
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
      desc: bootstrap and deploy OSDs.
      destroy-cluster: false
      polarion-id: CEPH-83573713
      module: test_cephadm.py
      name: Deploy cluster using cephadm

  - test:
      name: Record OSD identity before redeploy
      desc: Capture OSD ID/UUID metadata used for targeted activation
      module: exec.py
      config:
        sudo: True
        check_status: True
        commands:
          - "ceph osd tree"
          - "ceph osd metadata"
          - "ceph orch ps --daemon-type osd"

  - test:
      name: Redeploy OSD daemons via orchestrator
      desc: Redeploy OSDs through cephadm activation path
      module: exec.py
      config:
        sudo: True
        check_status: True
        commands:
          - "ceph orch redeploy osd"
          - "ceph orch ps --daemon-type osd"
          - "ceph osd stat"
          - "ceph health detail"
