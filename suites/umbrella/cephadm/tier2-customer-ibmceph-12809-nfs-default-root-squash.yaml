#============================================================
# Test-Case: Default NFS export root squashing (IBMCEPH-12809)
#
# Cluster Configuration:
#    conf/umbrella/cephadm/1admin-4node-1client-cluster.yaml
#============================================================

tests:
  - test:
      name: setup install pre-requisistes
      desc: Setup phase to deploy the required pre-requisites for running the tests.
      module: install_prereq.py
      abort-on-fail: true

  - test:
      abort-on-fail: true
      config:
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              args:
                - "ceph fs volume create cephfs"
              command: shell
          - config:
              args:
                - "ceph osd pool create nfs-ganesha-pool"
              command: shell
          - config:
              command: apply
              service: nfs
              base_cmd_args:
                verbose: true
              pos_args:
                - mynfs
                - nfs-ganesha-pool
              args:
                placement:
                  nodes:
                    - node2
                  limit: 1
      desc: bootstrap and deploy NFS service.
      destroy-cluster: false
      polarion-id: CEPH-83573713
      module: test_cephadm.py
      name: Deploy cluster using cephadm

  - test:
      name: Create NFS export without squash option
      desc: Create export omitting squash; expect default root_squash
      module: exec.py
      config:
        sudo: True
        check_status: True
        commands:
          - "ceph nfs export create cephfs mynfs /cephfs-export cephfs / || true"
          - "ceph nfs export ls mynfs"
          - "ceph nfs export info mynfs /cephfs-export"

  - test:
      name: Verify squash default is root_squash
      desc: Inspect export config for root_squash default when squash omitted
      module: exec.py
      config:
        sudo: True
        check_status: True
        commands:
          - "ceph nfs export info mynfs /cephfs-export"
          - "ceph orch ps --daemon-type nfs"
          - "ceph health detail"
