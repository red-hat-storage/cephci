#============================================================
# Test-Case: Persistent RGW HTTP and HTTPS listener configuration (IBMCEPH-8166)
# Jira status: POST
#
# Cluster Configuration:
#    conf/umbrella/cephadm/1admin-4node-1client-cluster.yaml
#
# Note: Confirm accepted HTTP/HTTPS dual-listener schema for the fixed build.
#============================================================

tests:
  - test:
      name: setup install pre-requisistes
      desc: Setup phase to deploy the required pre-requisites for running the tests.
      module: install_prereq.py
      abort-on-fail: true

  - test:
      abort-on-fail: true
      config:
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              command: apply
              service: rgw
              pos_args:
                - rgw.1
              args:
                placement:
                  label: rgw
      desc: bootstrap and deploy baseline RGW.
      destroy-cluster: false
      polarion-id: CEPH-83573713
      module: test_cephadm.py
      name: Deploy cluster using cephadm

  - test:
      name: Apply RGW dual listener configuration
      desc: Configure approved HTTP and HTTPS listeners in one RGW spec
      module: exec.py
      config:
        sudo: True
        check_status: False
        commands:
          - "ceph orch ls rgw --export"
          - "ceph orch ps --daemon-type rgw"

  - test:
      name: Reapply RGW and verify listeners persist
      desc: Reapply unchanged RGW spec and confirm both listeners remain
      module: exec.py
      config:
        sudo: True
        check_status: True
        commands:
          - "ceph orch ls rgw --export"
          - "ceph orch redeploy rgw.rgw.1 || ceph orch redeploy rgw || true"
          - "ceph orch ps --daemon-type rgw"
          - "ceph health detail"
