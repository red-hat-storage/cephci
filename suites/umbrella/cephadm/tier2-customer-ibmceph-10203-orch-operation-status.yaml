#============================================================
# Test-Case: Verbose orchestrator operation status (IBMCEPH-10203 / 10.1 → umbrella)
#
# Cluster Configuration:
#    conf/umbrella/cephadm/1admin-4node-1client-cluster.yaml
#
# Note: Design-gated. Uses concurrent placement changes and available orch
#       status interfaces until the approved operation-status API lands.
#============================================================

tests:
  - test:
      name: setup install pre-requisistes
      desc: Setup phase to deploy the required pre-requisites for running the tests.
      module: install_prereq.py
      abort-on-fail: true

  - test:
      abort-on-fail: true
      config:
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
                orphan-initial-daemons: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
      desc: bootstrap and deploy services.
      destroy-cluster: false
      polarion-id: CEPH-83573713
      module: test_cephadm.py
      name: Deploy cluster using cephadm

  - test:
      name: Submit concurrent mon and mgr placement changes
      desc: Apply alternate mon/mgr placements to exercise concurrent orch work
      module: test_cephadm.py
      destroy-cluster: false
      abort-on-fail: true
      config:
        steps:
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr

  - test:
      name: Inspect orchestrator status during reconciliation
      desc: Capture orch status/ps while concurrent changes reconcile
      module: exec.py
      config:
        sudo: True
        check_status: True
        commands:
          - "ceph orch status"
          - "ceph orch ps"
          - "ceph orch ls mon"
          - "ceph orch ls mgr"
          - "ceph health detail"
