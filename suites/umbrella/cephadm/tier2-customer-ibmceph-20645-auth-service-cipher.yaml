#============================================================
# Test-Case: Auth service cipher convergence (IBMCEPH-20645)
#
# Cluster Configuration:
#    conf/umbrella/upgrades/1admin-3node-1client-upgrade.yaml
#============================================================

tests:
  - test:
      name: setup install pre-requisistes
      desc: Setup phase to deploy the required pre-requisites for running the tests.
      module: install_prereq.py
      abort-on-fail: true

  - test:
      name: Bootstrap cluster and deploy services with label placements.
      desc: Bootstrap cluster and deploy services with label placements.
      polarion-id: CEPH-83573777
      module: test_cephadm.py
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
                orphan-initial-daemons: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: Configure client1
      desc: Configure the RGW,RBD client system
      module: test_client.py
      polarion-id: CEPH-83573777
      config:
        command: add
        id: client.1
        node: node4
        install_packages:
          - ceph-common
        copy_admin_keyring: true
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: Capture auth cipher settings before upgrade
      desc: Record preferred and service cipher values before upgrade
      module: exec.py
      config:
        sudo: True
        check_status: True
        commands:
          - "ceph config get mon auth_preferred_cipher"
          - "ceph config get mon auth_service_cipher"
          - "ceph config get mon auth_service_ticket_ttl"

  - test:
      name: Upgrade cluster to latest ceph version
      desc: Upgrade cluster to migrate auth service cipher
      module: test_cephadm_upgrade.py
      polarion-id: CEPH-83573791,CEPH-83573790
      config:
        command: start
        service: upgrade
        base_cmd_args:
          verbose: true
        verify_cluster_health: true
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: Validate auth cipher after upgrade
      desc: Verify preferred/service cipher and health after migration
      module: exec.py
      config:
        sudo: True
        check_status: True
        commands:
          - "ceph config get mon auth_preferred_cipher"
          - "ceph config get mon auth_service_cipher"
          - "ceph health detail"
          - "ceph versions"
