#============================================================
# Test-Case: Full traceback for unexpected upgrade exceptions (IBMCEPH-21581)
# Jira status: POST
#
# Cluster Configuration:
#    conf/umbrella/upgrades/1admin-3node-1client-upgrade.yaml
#
# Note: On UPGRADE_EXCEPTION, manager logs must include formatted traceback
#       (file/line/call chain), not only a traceback object address.
#============================================================

tests:
  - test:
      name: setup install pre-requisistes
      desc: Setup phase to deploy the required pre-requisites for running the tests.
      module: install_prereq.py
      abort-on-fail: true

  - test:
      name: Bootstrap cluster and deploy services with label placements.
      desc: Bootstrap cluster and deploy services with label placements.
      polarion-id: CEPH-83573777
      module: test_cephadm.py
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
                orphan-initial-daemons: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: Configure client1
      desc: Configure the RGW,RBD client system
      module: test_client.py
      polarion-id: CEPH-83573777
      config:
        command: add
        id: client.1
        node: node4
        install_packages:
          - ceph-common
        copy_admin_keyring: true
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: Upgrade cluster to latest ceph version
      desc: Exercise upgrade path; inspect health/status for exception handling
      module: test_cephadm_upgrade.py
      polarion-id: CEPH-83573791,CEPH-83573790
      config:
        command: start
        service: upgrade
        base_cmd_args:
          verbose: true
        verify_cluster_health: true
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: Capture upgrade status and manager log markers
      desc: Verify upgrade status and that mgr logs are available for traceback review
      module: exec.py
      config:
        sudo: True
        check_status: True
        commands:
          - "ceph orch upgrade status"
          - "ceph health detail"
          - "ceph mgr dump | head -50"
          - "ceph versions"
