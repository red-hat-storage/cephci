#============================================================
# Test-Case: NFS export from non-default RGW realm (IBMCEPH-10848 / 10.0)
#
# Cluster Configuration:
#    conf/umbrella/cephadm/1admin-4node-1client-cluster.yaml
#
# Note: Prepares multi-realm RGW + NFS baseline. Dashboard export UI steps
#       apply when the fixed build exposes realm/bucket selection.
#============================================================

tests:
  - test:
      name: setup install pre-requisistes
      desc: Setup phase to deploy the required pre-requisites for running the tests.
      module: install_prereq.py
      abort-on-fail: true

  - test:
      abort-on-fail: true
      config:
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              command: apply
              service: rgw
              pos_args:
                - rgw.1
              args:
                placement:
                  label: rgw
          - config:
              args:
                - "ceph osd pool create nfs-ganesha-pool"
              command: shell
          - config:
              command: apply
              service: nfs
              base_cmd_args:
                verbose: true
              pos_args:
                - mynfs
                - nfs-ganesha-pool
              args:
                placement:
                  nodes:
                    - node2
                  limit: 1
      desc: bootstrap and deploy rgw/nfs services.
      destroy-cluster: false
      polarion-id: CEPH-83573713
      module: test_cephadm.py
      name: Deploy cluster using cephadm

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.1
        node: node4
        install_packages:
          - ceph-common
        copy_admin_keyring: true
      desc: Configure the client system
      destroy-cluster: false
      module: test_client.py
      name: configure client

  - test:
      name: Create non-default RGW realm baseline
      desc: Create secondary realm/zone so non-default bucket selection is available
      module: exec.py
      config:
        sudo: True
        check_status: True
        commands:
          - "radosgw-admin realm list || true"
          - "radosgw-admin realm create --rgw-realm secondary --default=false || true"
          - "radosgw-admin realm list"
          - "ceph orch ls nfs"
          - "ceph health detail"
