#============================================================
# Test-Case: Early validation of RGW frontend ports (IBMCEPH-18221)
#
# Cluster Configuration:
#    conf/umbrella/cephadm/1admin-4node-1client-cluster.yaml
#============================================================

tests:
  - test:
      name: setup install pre-requisistes
      desc: Setup phase to deploy the required pre-requisites for running the tests.
      module: install_prereq.py
      abort-on-fail: true

  - test:
      abort-on-fail: true
      config:
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              command: apply
              service: rgw
              pos_args:
                - rgw.1
              args:
                placement:
                  label: rgw
      desc: bootstrap and deploy baseline RGW.
      destroy-cluster: false
      polarion-id: CEPH-83573713
      module: test_cephadm.py
      name: Deploy cluster using cephadm

  - test:
      name: Record baseline RGW spec
      desc: Save valid RGW spec and daemon state before invalid applies
      module: exec.py
      config:
        sudo: True
        check_status: True
        commands:
          - "ceph orch ls rgw --export"
          - "ceph orch ps --daemon-type rgw"

  - test:
      name: Reject invalid RGW frontend ports during validation
      desc: Apply invalid rgw_frontend_port values and expect early rejection
      module: exec.py
      config:
        sudo: True
        check_status: False
        commands:
          - "printf '%s\\n' 'service_type: rgw' 'service_id: rgw.bad' 'placement:' '  label: rgw' 'spec:' '  rgw_frontend_port: -81' > /tmp/rgw-port-invalid.yaml"
          - "ceph orch apply -i /tmp/rgw-port-invalid.yaml || true"
          - "printf '%s\\n' 'service_type: rgw' 'service_id: rgw.bad' 'placement:' '  label: rgw' 'spec:' '  rgw_frontend_port: 0' > /tmp/rgw-port-invalid.yaml"
          - "ceph orch apply -i /tmp/rgw-port-invalid.yaml || true"
          - "printf '%s\\n' 'service_type: rgw' 'service_id: rgw.bad' 'placement:' '  label: rgw' 'spec:' '  rgw_frontend_port: 65536' > /tmp/rgw-port-invalid.yaml"
          - "ceph orch apply -i /tmp/rgw-port-invalid.yaml || true"

  - test:
      name: Verify baseline RGW unchanged after rejected specs
      desc: Confirm invalid applies did not replace valid RGW configuration
      module: exec.py
      config:
        sudo: True
        check_status: True
        commands:
          - "ceph orch ls rgw --export"
          - "ceph orch ps --daemon-type rgw"
          - "ceph health detail"
