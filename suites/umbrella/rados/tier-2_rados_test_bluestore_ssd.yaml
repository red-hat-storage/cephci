#===============================================================================================
#----- Tier-2 - BlueStore fast allocation recovery ------
#===============================================================================================
# Conf: conf/umbrella/rados/7-node-cluster.yaml
#
# Deploys a standard cephadm cluster. Scenarios discover FSID / OSD / nproc /
# 2×nproc / systemd unit at runtime (no hard-coded thread counts).
# allow_null_fm_convert: true lets CI convert HDD bitmap-FM OSDs to null-FM
# when the designated single-type gate would otherwise fail.
#
#===============================================================================================

tests:
  - test:
      name: setup install pre-requisistes
      desc: Setup phase to deploy the required pre-requisites for running the tests.
      module: install_prereq.py
      abort-on-fail: true

  - test:
      name: cluster deployment
      desc: Execute the cluster deployment workflow.
      module: test_cephadm.py
      polarion-id:
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              base_cmd_args:
                verbose: true
              args:
                mon-ip: node1
                orphan-initial-daemons: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: Configure client admin
      desc: Configures client admin node on cluster
      module: test_client.py
      polarion-id:
      config:
        command: add
        id: client.1
        node: node7
        install_packages:
          - ceph-common
        copy_admin_keyring: true
        caps:
          mon: "allow *"
          osd: "allow *"
          mds: "allow *"
          mgr: "allow *"

  - test:
      name: Enable logging to file
      module: rados_prep.py
      config:
        log_to_file: true
      desc: Change config options to enable logging to file

  - test:
      name: bluestore fast alloc recovery - positive spot check
      desc: Null-FM freelist gate and config validation (F01-F04) with discovered MT threads
      module: test_bluestore_fast_alloc_recovery.py
      polarion-id:
      config:
        allow_null_fm_convert: true
        scenarios_to_run:
          - positive_spot_check

  - test:
      name: bluestore fast alloc recovery - offline smoke
      desc: Offline recovery-compare smoke with discovered thread list (incl. 2×nproc)
      module: test_bluestore_fast_alloc_recovery.py
      polarion-id:
      config:
        allow_null_fm_convert: true
        scenarios_to_run:
          - offline_recovery_compare_smoke

  - test:
      name: bluestore fast alloc recovery - runtime smoke
      desc: Runtime crash + compare smoke with discovered thread×compare set
      module: test_bluestore_fast_alloc_recovery.py
      polarion-id:
      config:
        allow_null_fm_convert: true
        scenarios_to_run:
          - runtime_crash_compare_smoke

  - test:
      name: bluestore fast alloc recovery - negative spot check
      desc: G01 live-path lock + G03 from_file=false on null-FM (must revert)
      module: test_bluestore_fast_alloc_recovery.py
      polarion-id:
      config:
        allow_null_fm_convert: true
        scenarios_to_run:
          - negative_spot_check

  - test:
      name: bluestore fast alloc recovery - QA teardown
      desc: Remove compare_chance; assert no runtime compare after SIGKILL
      module: test_bluestore_fast_alloc_recovery.py
      polarion-id:
      config:
        allow_null_fm_convert: true
        scenarios_to_run:
          - qa_teardown_compare_chance
