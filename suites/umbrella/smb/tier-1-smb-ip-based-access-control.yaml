# Test Description:
# Validates SMB IP-based access control with 1 admin, 5 nodes, and 2 clients.
#
# Suite config:
# conf/tentacle/smb/1admin-5node-2client-ip-access.yaml

tests:
  - test:
      name: setup pre-requisites
      desc: Install software pre-requisites for cluster deployment
      module: install_prereq.py
      abort-on-fail: true

  - test:
      name: Deploy cluster using cephadm
      desc: Bootstrap and deploy services
      module: test_cephadm.py
      polarion-id: CEPH-83573713
      config:
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              command: apply
              service: rgw
              pos_args:
                - rgw.1
              args:
                placement:
                  label: rgw
          - config:
              args:
                - "ceph fs volume create cephfs"
              command: shell
          - config:
              args:
                placement:
                  label: mds
              base_cmd_args:
                verbose: true
              command: apply
              pos_args:
                - cephfs
              service: mds
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: configure client
      desc: Configure client system
      module: test_client.py
      config:
        command: add
        id: client.1
        nodes:
          - node4
          - node5
        install_packages:
          - ceph-common
          - samba-client
        copy_admin_keyring: true
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: Configure hosts_access to allow single client IP
      desc: Verify that only a specifically allowed client IP can access the SMB share
      module: smb_host_access_operations.py
      polarion-id: CEPH-83632315
      config:
        file_type: yaml
        file_mount: /tmp
        host_access:
          - {kind: address, source: client, client: 0, access: allow}
        access_checks:
          - {client: 0, expect: allow}
          - {client: 1, expect: deny}

  - test:
      name: Configure hosts_access to explicitly deny client IP
      desc: Verify that a specifically denied IP cannot access the SMB share
      module: smb_host_access_operations.py
      polarion-id: CEPH-83632316
      config:
        file_type: yaml
        file_mount: /tmp
        host_access:
          - {kind: address, source: client, client: 0, access: deny}
        access_checks:
          - {client: 0, expect: deny}
          - {client: 1, expect: allow}

  - test:
      name: Configure hosts_access to allow network client IP
      desc: Verify that clients within an allowed subnet can access the SMB share
      module: smb_host_access_operations.py
      polarion-id: CEPH-83632317
      config:
        file_type: yaml
        file_mount: /tmp
        require_clients_same_network: true
        host_access:
          - {kind: network, source: client, client: 0, access: allow}
        access_checks:
          - {client: 0, expect: allow}
          - {client: 1, expect: allow}

  - test:
      name: Configure hosts_access to deny network client IP
      desc: Verify that clients within a denied subnet cannot access the SMB share
      module: smb_host_access_operations.py
      polarion-id: CEPH-83632318
      config:
        file_type: yaml
        file_mount: /tmp
        require_clients_same_network: true
        host_access:
          - {kind: network, source: client, client: 0, access: deny}
        access_checks:
          - {client: 0, expect: deny}
          - {client: 1, expect: deny}

  - test:
      name: Remove hosts_access from SMB share and connect from any IP
      desc: Verify unrestricted access after hosts_access is removed
      module: smb_host_access_operations.py
      polarion-id: CEPH-83632319
      config:
        file_type: yaml
        file_mount: /tmp
        initial_host_access:
          - {kind: address, source: client, client: 0, access: allow}
        initial_access_checks:
          - {client: 0, expect: allow}
          - {client: 1, expect: deny}
        host_access: []
        access_checks:
          - {client: 0, expect: allow}
          - {client: 1, expect: allow}

  - test:
      name: Configure multiple allow IP entries and connect from one of them
      desc: Verify access when multiple client IPs are explicitly allowed
      module: smb_host_access_operations.py
      polarion-id: CEPH-83632320
      config:
        file_type: yaml
        file_mount: /tmp
        host_access:
          - {kind: address, source: client, client: 0, access: allow}
          - {kind: address, source: client, client: 1, access: allow}
        access_checks:
          - {client: 0, expect: allow}
          - {client: 1, expect: allow}

  - test:
      name: Configure multiple allow IP entries and connect from non-listed IP
      desc: Verify that a non-listed client IP is denied by an allow list
      module: smb_host_access_operations.py
      polarion-id: CEPH-83632321
      config:
        file_type: yaml
        file_mount: /tmp
        host_access:
          - {kind: address, source: client, client: 0, access: allow}
          - {kind: address, source: unused, access: allow}
        access_checks:
          - {client: 0, expect: allow}
          - {client: 1, expect: deny}

  - test:
      name: Configure hosts_access with only deny IP and connect from other IP
      desc: Verify that clients other than the explicitly denied IP are allowed
      module: smb_host_access_operations.py
      polarion-id: CEPH-83632322
      config:
        file_type: yaml
        file_mount: /tmp
        host_access:
          - {kind: address, source: client, client: 0, access: deny}
        access_checks:
          - {client: 1, expect: allow}

  - test:
      name: Configure hosts_access with only deny network and connect from outside subnet
      desc: Verify that clients outside the denied subnet are allowed
      module: smb_host_access_operations.py
      polarion-id: CEPH-83632323
      config:
        file_type: yaml
        file_mount: /tmp
        host_access:
          - {kind: network, source: unused, access: deny}
        access_checks:
          - {client: 0, expect: allow}
          - {client: 1, expect: allow}
